    // landing's, the rest held by `reserved` below.
    RepositoryLanding repository_landing = 200;
    // `ruling.keep_all`, behind `board_ruling_actions`: the rulings it kept.
    // Tag 210, after landing's block (200-209); `Request.ruling_keep_all` keeps
    // 200, which landing never took on the request side.
    RulingsKept rulings_kept = 210;
    // `terminal.tell` (ov-360): sent as the agent's next prompt, or queued
    // behind the turn it's in. A daemon from before replies with the
