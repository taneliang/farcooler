syntax = "proto3";

package farcooler.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Wire envelope
//
// Concurrency, lease, and idempotency metadata are canonical ONLY here. Business
// payloads never repeat the target ID, target version, or lease generation. The
// generic dispatcher validates these preconditions before invoking domain logic.
// ---------------------------------------------------------------------------

message WireEnvelope {
  uint32 protocol_version = 1;
  bytes message_id = 2; // UUIDv7, 16 bytes

  oneof body {
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    Request request = 12;
    Response response = 13;
    Event event = 14;
    SnapshotChunk snapshot_chunk = 15;
    TerminalFrame terminal_frame = 16;
  }
}

message ClientHello {
  repeated uint32 supported_protocol_versions = 1;
  string client_name = 2;
  string client_version = 3;
}

message ServerHello {
  uint32 selected_protocol_version = 1;
  string daemon_version = 2;
  uint32 max_control_envelope_bytes = 3;
  uint32 max_terminal_payload_bytes = 4;
  Scope granted_scope = 5;
  // What this daemon can do, by name.
  //
  // The mechanism that lets an app and a daemon drift. `protocol_version` is
  // reserved for a framing break that additivity cannot express and is expected
  // never to move; everything a client must know exists, it asks for HERE, by
  // name, rather than by comparing version strings.
  //
  // In the handshake rather than behind `daemon.version`, so every client has
  // the answer before its first request at no extra round trip.
  repeated string capabilities = 6;
}

message Request {
  bytes request_id = 1;
  string method = 2;

  // Generic envelope preconditions. A mutation of an existing resource targets
  // that resource; a create mutation targets and versions its PARENT.
  optional bytes target_resource_id = 3;
  optional uint64 expected_resource_version = 4;
  optional uint64 expected_lease_generation = 5;
  optional string idempotency_key = 6;
  // Capabilities this request needs the daemon to have.
  //
  // Another generic precondition, checked in the same dispatcher and for the
  // same reason as the four above: a daemon that lacks one refuses with
  // CAPABILITY_UNSUPPORTED before any domain logic runs.
  //
  // It exists for the case negotiation alone cannot catch. A new FIELD on an
  // existing payload is dropped by an older daemon as an unknown proto3 field,
  // which means it does the old thing while the client believes it asked for
  // the new one — silently, with no error and nothing in a log. A client that
  // fills in such a field names the capability it belongs to here, and the
  // refusal becomes loud.
  //
  // On the envelope rather than checked at each call site because there are
  // some thirty of those, and a check that can be forgotten at any one of them
  // leaves the silence exactly where it was.
  repeated string required_capabilities = 7;

  oneof payload {
    Empty empty = 20;
    RepositoryRootAdd repository_root_add = 21;
    RepositoryRegister repository_register = 22;
    WorktreeCreate worktree_create = 23;
    TerminalCreate terminal_create = 24;
    TerminalResize terminal_resize = 25;
    TerminalStop terminal_stop = 26;
    TypedConfirmation typed_confirmation = 27;
    // Attach to one terminal's live bytes, on the connection this arrives on.
    //
    // `terminal.attach`, and the reason it is a wire method rather than the
    // second SSH exec it used to be. This tag was retired once, with the note
    // "streaming a terminal is a second SSH exec of `farcoolerd --stream <id>`,
    // not a wire method". That was true when it was written and stopped being
    // true when enrollment started forcing a command: every key `crates/fence`
    // enrolls carries
    // `restrict,command="~/.local/bin/farcoolerd --stdio --client … --scope …"`,
    // and a forced command is OpenSSH discarding whatever the client asked to
    // run — which `crates/daemon/tests/a_real_sshd_forces_the_scope.rs` pins as
    // a security property. So the second exec landed on a `--stdio` relay, which
    // is a protocol server and says nothing until it is spoken to: the channel
    // opened, the client read success, and no byte ever arrived. Every enrolled
    // phone and every Android device sat on the capture-polling fallback, which
    // carries no scrollback (`crates/tmux/src/windows.rs`), so those panes could
    // not scroll — and retried the doomed attach forever against sshd's
    // ten-session ceiling.
    //
    // Speaking the protocol on the second channel is what ends that, because
    // `--stdio` is the one command BOTH key types run: a forced-command key has
    // sshd substitute it, and a plain key matches it in `main.rs` before
    // `--stream`. The client stops depending on which line it holds — the
    // difference that made this bug invisible on the Mac, which enrolls a plain
    // shell key beside its restricted one, and in every loopback test.
    //
    // Still a SECOND `--stdio` session rather than events on the control
    // connection: `Client::call` reads frames until it sees its own response, so
    // a scrollback replay carried there would sit in front of every fleet
    // refresh. `farcooler events` already streams over ssh this way.
    //
    // `--stream` is not replaced. It is what the Mac's CLI uses and the only
    // path a plain-key client has on a runner too old to advertise
    // `terminal_stream`; a client that does not see that capability keeps
    // exec'ing it, and keeps the poll fallback behind it.
    TerminalAttach terminal_attach = 28;
    LayoutUpdate layout_update = 29;
    // 30 was WorktreeImport. Worktrees are adopted by the daemon's reconciler
    // now, so there is nothing for a client to import. The tag is retired
    // rather than reused.
    TerminalWrite terminal_write = 31;
    TerminalScreenRequest terminal_screen_request = 32;
    SetPaneMode set_pane_mode = 33;
    AgentSubscribe agent_subscribe = 34;
    AgentPrompt agent_prompt = 35;
    AgentAnswer agent_answer = 36;
    AgentSetMode agent_set_mode = 37;
    AgentCancel agent_cancel = 38;
    WorktreeFileSearch worktree_file_search = 39;
    AgentSetModel agent_set_model = 40;
    AgentSetConfig agent_set_config = 41;
    AgentEditQueued agent_edit_queued = 42;
    AgentCancelQueued agent_cancel_queued = 43;
    AgentSteerQueued agent_steer_queued = 44;
    Adapter adapter = 45;
    // Machine settings. `HostSettings` doubles as the write payload for the one
    // scalar it carries, and `Theme` is the same message the read returns —
    // there is nothing an upsert needs that a read does not already describe.
    HostSettings host_settings = 46;
    Theme theme = 47;
    TerminalFilePut terminal_file_put = 48;
    ChangeSetRequest change_set_request = 49;
    CommitFilesRequest commit_files_request = 50;
    FileDiffRequest file_diff_request = 51;
    ChangesSetBase changes_set_base = 52;
    ChangesMarkRead changes_mark_read = 59;
    StackGet stack_get = 62;
    StackSetParent stack_set_parent = 63;
    PrRefresh pr_refresh = 64;
    ChangesInboxRequest changes_inbox = 65;
    ClientEnroll client_enroll = 66;
    ClientRevoke client_revoke = 67;
    TerminalsWatched terminals_watched = 68;
    ClientSetNodeKey client_set_node_key = 69;
    WorktreeReorder worktree_reorder = 70;
    // The board. Reads first, then the writes; see the section at the foot of
    // this file for why there is no payload here that edits a note.
    TaskListRequest task_list = 71;
    TaskGetRequest task_get = 72;
    TaskCreate task_create = 73;
    TaskUpdate task_update = 74;
    TaskSetStatus task_set_status = 75;
    TaskNoteAppend task_note_append = 76;
    TaskBlockSet task_block_set = 77;
    TaskSearchRequest task_search = 78;
    TaskGetByKeyRequest task_get_by_key = 79;
    // Workspaces: workstreams that own a board and, once claimed, worktrees.
    // Every one of these is behind the `workstreams` capability.
    // `workspace.list` and `workspace.delete` carry `Empty` and name what they
    // act on in `target_resource_id`.
    WorkspaceCreate workspace_create = 80;
    WorkspaceRename workspace_rename = 81;
    WorkspaceSetPrefix workspace_set_prefix = 82;
    TaskMove task_move = 83;
    WorktreeAssign worktree_assign = 84;
    TerminalSetRole terminal_set_role = 85;
    WorkspaceStartOrchestrator workspace_start_orchestrator = 86;
    // Behind the `wake_on_answer` capability.
