message Response {
  bytes request_id = 1;
  oneof outcome {
    Result result = 2;
    Error error = 3;
  }
}

message Error {
  ErrorCode code = 1;
  bool retryable = 2;
  string message = 3; // redacted: never a path, terminal byte, command, or session id
  // WHICH argument the runner refused, when the code alone does not say.
  //
  // `INVALID_ARGUMENT` covers a cycle, a blocker that names no task, a bad
  // actor and a title two hundred characters too long, and until this field
  // existed all four arrived as the bare word `invalid-argument`. A client had
  // no way to tell them apart, so it had to guess which producer fired from
  // the call it had just made -- and a wrong guess is a confident, wrong
  // sentence in front of somebody.
  //
  // **Switch on it; never print it.** Same rule as `code`: the runner sends a
  // word, the app owns the sentence. This is the runner's OWN vocabulary --
  // mostly field names (`title`, `actor`, `blocked_by`), occasionally a phrase
  // written for a daemon log -- so a client maps the words it knows and falls
  // back to its own wording for anything else. It carries no caller data: every
  // value is a literal in the runner's source.
  //
  // Empty where the code is the whole answer, which is most of them.
  string what = 4;
}

message Result {
  oneof value {
    Host host = 1;
    RepositoryRoot repository_root = 2;
    RepositoryRootList repository_root_list = 3;
    Repository repository = 4;
    RepositoryList repository_list = 5;
    Worktree worktree = 6;
    WorktreeList worktree_list = 7;
    Terminal terminal = 8;
    TerminalList terminal_list = 9;
    Operation operation = 10;
    DaemonVersion daemon_version = 11;
    TerminalAttachResult terminal_attach = 12;
    BranchList branch_list = 13;
    PaneGroupList pane_group_list = 14;
    DiscoveredWorktreeList discovered_worktree_list = 15;
    TerminalScreen terminal_screen = 16;
    AgentEventBatch agent_event_batch = 17;
    WorktreeFileList worktree_file_list = 18;
    // "It worked and there is nothing to describe" — `daemon.shutdown`, whose
    // whole result is that the daemon is going away. Echoing any resource back
    // would be describing a process that is about to stop existing.
    Empty empty = 19;
    ThemeList theme_list = 20;
    AdapterList adapter_list = 21;
    AdapterTestResult adapter_test_result = 22;
    TerminalFilePutResult terminal_file_put = 23;
    ChangeSet change_set = 24;
    FileChangeList file_change_list = 25;
    FileDiff file_diff = 26;
    StackLinkList stack_link_list = 32;
    ChangesInbox changes_inbox = 33;
    ClientList client_list = 34;
    ClientEnrollResult client_enroll = 35;
    ClientSetNodeKeyResult client_set_node_key = 36;
    // The board. `task.note` answers with the note it appended rather than
    // with the task, because the note carries the id a later `supersedes` has
    // to name.
    Task task = 37;
    TaskList task_list = 38;
    TaskDetail task_detail = 39;
    TaskNote task_note = 40;
    TaskBlockList task_block_list = 41;
    TaskNoteHitList task_note_hit_list = 42;
    Workspace workspace = 43;
    WorkspaceList workspace_list = 44;
    // `needs_you.list`: this runner's items, in rank order. Behind the
    // `needs_you` capability.
    NeedsYouList needs_you_list = 45;
    // `report.get`: what got done in a period. Behind the `report`
    // capability.
    Report report = 46;
    // `usage.report` and `usage.task`, behind `agent_usage`.
    UsageReport usage_report = 120;
    TaskUsage task_usage = 121;
    // `workspace.mark_read`: the board's read state after the merge.
    BoardReads board_reads = 122;
    // `worktree.list_dir` and `worktree.read_file`, behind `worktree_files`.
    WorktreeDir worktree_dir = 150;
    WorktreeFile worktree_file = 151;
    // The plan layer (ov-268), behind `board_plan`. `board_theme.*` answer
    // with the theme, `lane.*` with the lane, `plan.get` and `plan.set` with
    // the whole plan, and `plan.events` with a timeline.
    BoardThemeView board_theme_view = 160;
    Lane lane = 161;
    Plan plan = 162;
    PlanEventList plan_event_list = 163;
    // Orchestrator pages (ov-269), behind `board_pages`. `page.list` answers
    // with the list, `page.get` and `page.remove` with the page, `page.set`
    // with the page and whether the write changed it, and `page.stats` with
    // how each slot has been published.
    BoardPageList board_page_list = 170;
    BoardPage board_page = 171;
    PageSetResult page_set_result = 172;
    PageStatsList page_stats_list = 173;
    // `ruling.add` and `ruling.set`, behind `board_rulings`: the ruling.
    BoardRuling board_ruling = 180;
    // `train.start` and `train.set`, behind `board_trains`: the train.
    BoardTrain board_train = 190;
    // `repository.landing` (ov-313), behind `landing`: what the runner read of
