    TerminalTold terminal_told = 310;
    // `agent.rows` and `agent.rows_follow` (ov-366), behind `agent_rows`.
    AgentRowPage agent_row_page = 370;
    AgentRowChanges agent_row_changes = 371;
    // `terminal.draft_prompt` asked to hold behind a dialog, and
