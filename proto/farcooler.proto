syntax = "proto3";

package farcooler.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Wire envelope
//
// Concurrency, lease, and idempotency metadata are canonical ONLY here. Business
// payloads never repeat the target ID, target version, or lease generation. The
// generic dispatcher validates these preconditions before invoking domain logic.
// ---------------------------------------------------------------------------

message WireEnvelope {
  uint32 protocol_version = 1;
  bytes message_id = 2; // UUIDv7, 16 bytes

  oneof body {
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    Request request = 12;
    Response response = 13;
    Event event = 14;
    SnapshotChunk snapshot_chunk = 15;
    TerminalFrame terminal_frame = 16;
  }
}

message ClientHello {
  repeated uint32 supported_protocol_versions = 1;
  string client_name = 2;
  string client_version = 3;
}

message ServerHello {
  uint32 selected_protocol_version = 1;
  string daemon_version = 2;
  uint32 max_control_envelope_bytes = 3;
  uint32 max_terminal_payload_bytes = 4;
  Scope granted_scope = 5;
}

message Request {
  bytes request_id = 1;
  string method = 2;

  // Generic envelope preconditions. A mutation of an existing resource targets
  // that resource; a create mutation targets and versions its PARENT.
  optional bytes target_resource_id = 3;
  optional uint64 expected_resource_version = 4;
  optional uint64 expected_lease_generation = 5;
  optional string idempotency_key = 6;

  oneof payload {
    Empty empty = 20;
    RepositoryRootAdd repository_root_add = 21;
    RepositoryRegister repository_register = 22;
    WorkspaceCreate workspace_create = 23;
    TerminalCreate terminal_create = 24;
    TerminalResize terminal_resize = 25;
    TerminalStop terminal_stop = 26;
    TypedConfirmation typed_confirmation = 27;
    TerminalAttach terminal_attach = 28;
    LayoutUpdate layout_update = 29;
    // 30 was WorktreeImport. Worktrees are adopted by the daemon's reconciler
    // now, so there is nothing for a client to import. The tag is retired
    // rather than reused.
    TerminalWrite terminal_write = 31;
    TerminalScreenRequest terminal_screen_request = 32;
    SetPaneMode set_pane_mode = 33;
    AgentSubscribe agent_subscribe = 34;
    AgentPrompt agent_prompt = 35;
    AgentAnswer agent_answer = 36;
    AgentSetMode agent_set_mode = 37;
    AgentCancel agent_cancel = 38;
    WorktreeFileSearch worktree_file_search = 39;
    AgentSetModel agent_set_model = 40;
    AgentSetConfig agent_set_config = 41;
    AgentEditQueued agent_edit_queued = 42;
    AgentCancelQueued agent_cancel_queued = 43;
    AgentSteerQueued agent_steer_queued = 44;
  }
}

message Response {
  bytes request_id = 1;
  oneof outcome {
    Result result = 2;
    Error error = 3;
  }
}

message Error {
  ErrorCode code = 1;
  bool retryable = 2;
  string message = 3; // redacted: never a path, terminal byte, command, or session id
}

message Result {
  oneof value {
    Host host = 1;
    RepositoryRoot repository_root = 2;
    RepositoryRootList repository_root_list = 3;
    Repository repository = 4;
    RepositoryList repository_list = 5;
    Workspace workspace = 6;
    WorkspaceList workspace_list = 7;
    Terminal terminal = 8;
    TerminalList terminal_list = 9;
    Operation operation = 10;
    DaemonVersion daemon_version = 11;
    TerminalAttachResult terminal_attach = 12;
    BranchList branch_list = 13;
    PaneGroupList pane_group_list = 14;
    WorktreeList worktree_list = 15;
    TerminalScreen terminal_screen = 16;
    AgentEventBatch agent_event_batch = 17;
    WorktreeFileList worktree_file_list = 18;
    // "It worked and there is nothing to describe" — `daemon.shutdown`, whose
    // whole result is that the daemon is going away. Echoing any resource back
    // would be describing a process that is about to stop existing.
    Empty empty = 19;
    ThemeList theme_list = 20;
  }
}

// ---------------------------------------------------------------------------
// Agent channel
//
// A sequence number counts EVENTS, not bytes. Unlike a terminal stream these
// have record boundaries, so a cursor can name one.
// ---------------------------------------------------------------------------

message SetPaneMode {
  bytes terminal_id = 1;
  PaneMode pane_mode = 2;
  // Switching to TERMINAL while a turn is in flight discards work that
  // `claude --resume` cannot reattach to, so it is refused unless the user has
  // been told and said yes.
  bool force = 3;
}

message AgentSubscribe {
  bytes terminal_id = 1;
  uint64 from_seq = 2;
  // The run of the stream this cursor belongs to.
  //
  // A shim numbers events by position in its own ring and every pane-mode
  // toggle starts a new shim counting from zero, so a cursor alone cannot say
  // which stream it means. Send back what the last batch reported; a mismatch
  // returns the whole transcript instead of a slice.
  uint64 epoch = 3;
}

message ImageBlock {
  string mime_type = 1;
  bytes data = 2;
}

message AgentPromptBlock {
  oneof content {
    string text = 1;
    // A worktree-relative path from an @-mention.
    string file_mention = 2;
    ImageBlock image = 3;
  }
}

message AgentPrompt {
  bytes terminal_id = 1;
  repeated AgentPromptBlock blocks = 2;
}

message AgentAnswer {
  bytes terminal_id = 1;
  // Carried back exactly as the adapter sent it. Inventing an id here would
  // make the answer unroutable and hang the agent on its own question.
  string request_id = 2;
  string option_id = 3;
}

message AgentSetMode {
  bytes terminal_id = 1;
  string agent_mode = 2;
}

message AgentSetModel {
  bytes terminal_id = 1;
  string model = 2;
}

// Change one of the agent's advertised selectors, generically. Mode, model,
// subagent and whatever an adapter adds next all travel this one way.
message AgentSetConfig {
  bytes terminal_id = 1;
  string config_id = 2;
  string value = 3;
}

// Rewrite or withdraw a prompt that is waiting for the current turn to end.
//
// Only possible because Far Cooler holds the queue itself: a prompt handed to
// the adapter is gone, and one still here is still the user's to change.
message AgentEditQueued {
  bytes terminal_id = 1;
  string queued_id = 2;
  string text = 3;
}

message AgentCancelQueued {
  bytes terminal_id = 1;
  string queued_id = 2;
}

// Send a queued prompt into the turn already running, rather than waiting for
// it to end. The adapter accepts prompts mid-turn (`promptQueueing`), and the
// agent picks them up between tool calls — which is what makes a correction
// worth sending at all.
message AgentSteerQueued {
  bytes terminal_id = 1;
  string queued_id = 2;
}

message AgentCancel { bytes terminal_id = 1; }

message WorktreeFileSearch {
  bytes workspace_id = 1;
  string query = 2;
  uint32 limit = 3;
}

message WorktreeFileList { repeated string paths = 1; }

// Why part of a transcript is missing.
//
// Rendered as a visible break, never silently omitted. A derived transcript is
// only permissible in this product because it can say where it is incomplete —
// the same contract as a lost terminal.
enum AgentGapReason {
  AGENT_GAP_REASON_UNSPECIFIED = 0;
  // The ring dropped events the subscriber had not read.
  AGENT_GAP_REASON_RING_TRIMMED = 1;
  // Reconnected, but the agent cannot replay its own history.
  AGENT_GAP_REASON_LOAD_UNSUPPORTED = 2;
  // An update arrived that this adapter could not interpret.
  AGENT_GAP_REASON_UNPARSED = 3;
}

message AgentEventFrame {
  uint64 seq = 1;
  // The normalized event, as JSON.
  //
  // JSON rather than a generated message, and deliberately: the shape is
  // `farcooler_agent::event::AgentEvent`, which is the single Rust definition
  // both apps decode. Restating that union in protobuf would create a second
  // definition to keep in step, and the two would disagree the first time an
  // adapter grew a variant.
  string payload_json = 2;
}

message AgentEventBatch {
  bytes terminal_id = 1;
  repeated AgentEventFrame events = 2;
  // The run these events belong to. A client that gets back an epoch other
  // than the one it asked with is holding a transcript of a stream that no
  // longer exists, and should replace it with this batch rather than append.
  uint64 epoch = 3;
}

message Event {
  bytes event_id = 1;
  uint64 sequence = 2;
  oneof payload {
    Host host_changed = 10;
    RepositoryRoot repository_root_changed = 11;
    Repository repository_changed = 12;
    Workspace workspace_changed = 13;
    Terminal terminal_changed = 14;
    Operation operation_changed = 15;
    // A workspace's whole set of groups, not a diff.
    //
    // Layout is edited from three places at once — the app, the CLI, and an
    // agent driving the CLI — so a client that missed an event has to converge
    // on the next one rather than apply a delta to a state it may not hold.
    PaneGroupList layout_changed = 16;
    // New events for one terminal's agent session, in seq order. A client that
    // missed some asks for them by cursor rather than reconstructing.
    AgentEventBatch agent_events = 17;
    // The set of workspaces changed — re-read.
    //
    // Reconciliation can both create and delete workspace rows in the same
    // pass, and a deletion has no resource to carry: there is no `Workspace`
    // left to describe. This fires once per reconcile pass that changed
    // anything, not once per workspace, so a client re-reads the fleet rather
    // than trying to apply it as a delta.
    Empty fleet_changed = 18;
  }
}

message SnapshotChunk {
  oneof kind {
    SnapshotBegin begin = 1;
    SnapshotEnd end = 2;
    Event resource = 3;
  }
}

message SnapshotBegin {
  bytes snapshot_id = 1;
  google.protobuf.Timestamp generated_at = 2;
}

message SnapshotEnd {
  bytes snapshot_id = 1;
}

// ---------------------------------------------------------------------------
// Terminal channel
//
// A sequence number is a uint64 BYTE OFFSET from the first byte of the current
// terminal epoch. Frame boundaries carry no protocol meaning.
// ---------------------------------------------------------------------------

message TerminalFrame {
  bytes terminal_id = 1;
  uint64 epoch = 2;

  oneof kind {
    TerminalOutput output = 10;
    TerminalInput input = 11;
    TerminalInputAck input_ack = 12;
    TerminalResizeFrame resize = 13;
    FlowAck flow_ack = 14;
    Gap gap = 15;
  }
}

message TerminalOutput {
  uint64 start_sequence = 1; // byte offset of the first payload byte
  bytes payload = 2;
}

message TerminalInput {
  uint64 lease_generation = 1;
  uint64 client_input_id = 2;
  bytes payload = 3;
}

message TerminalInputAck {
  uint64 client_input_id = 1;
}

message TerminalResizeFrame {
  uint32 columns = 1;
  uint32 rows = 2;
  uint64 view_activity_id = 3;
}

message FlowAck {
  uint64 acked_sequence = 1; // one past the highest contiguous byte applied
}

message Gap {
  uint64 resumed_at_sequence = 1;
  optional uint64 lost_bytes = 2; // exact when the epoch matches; absent otherwise
  GapReason reason = 3;
}

enum GapReason {
  GAP_REASON_UNSPECIFIED = 0;
  GAP_REASON_REPLAY_EVICTED = 1;
  GAP_REASON_EPOCH_CHANGED = 2;
  GAP_REASON_CLIENT_TOO_SLOW = 3;
  GAP_REASON_RUNTIME_LOST = 4;
}

// ---------------------------------------------------------------------------
// Resources
// ---------------------------------------------------------------------------

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_READ = 1;
  SCOPE_CONTROL = 2;
  SCOPE_HOST_ADMIN = 3;
}

// Settings this machine's config.toml decides, as opposed to facts about it.
//
// Its own message rather than scalars hung off `Host`, so it can grow by a
// field: a machine settings editor adds to this, and a bare scalar would need a
// migration where a nested message needs a tag. Kept distinguishable from the
// live facts beside it — `self_health`, `live_terminal_count` — for the same
// reason the two are worth separating at all: one is what the machine IS, the
// other is what somebody chose.
message HostSettings {
  // Prepended to a branch name derived from a task description. Empty opts out
  // entirely; the daemon's own default when config.toml says nothing is
  // `feat/`, so an absent message and an empty string mean different things.
  //
  // Applied by the CLIENT, not by the daemon, because the task composer shows
  // you the branch it is about to create — a prefix added daemon-side would
  // make that preview a lie. The daemon still validates the finished name.
  string branch_prefix = 1;
}

message Host {
  bytes id = 1;
  uint64 resource_version = 2;
  string platform = 3;
  string daemon_version = 4;
  uint32 protocol_version = 5;
  SelfHealth self_health = 6;
  repeated string self_health_reasons = 7;
  uint64 replay_bytes_retained = 8; // observability for the per-terminal replay cost
  // Live tagged panes the daemon can currently see. A client must not count
  // these itself: a remote one has no tmux to look at, and a local one that
  // looked would be a second authority on the same question.
  uint32 live_terminal_count = 9;
  // Rides on this message rather than a call of its own, because every client
  // already makes this one and the prefix is needed on the path that creates a
  // workspace — a second round trip there would be a round trip spent asking
  // for a string.
  HostSettings settings = 10;
}

enum SelfHealth {
  SELF_HEALTH_UNSPECIFIED = 0;
  SELF_HEALTH_HEALTHY = 1;
  SELF_HEALTH_DEGRADED = 2;
}

message RepositoryRoot {
  bytes id = 1;
  uint64 resource_version = 2;
  bytes host_id = 3;
  string path_token = 4;
  optional string display_path = 5; // host_admin only
  google.protobuf.Timestamp created_at = 6;
  uint32 repository_count = 7;
}

message RepositoryRootList { repeated RepositoryRoot items = 1; }

message Repository {
  bytes id = 1;
  uint64 resource_version = 2;
  bytes host_id = 3;
  bytes repository_root_id = 4;
  string display_name = 5;
  optional string canonical_git_dir = 6; // host_admin only
  string remote_summary = 7;
}

message RepositoryList { repeated Repository items = 1; }

// A colour scheme this host defines, from `[themes.<name>]` in config.toml.
//
// Sent as packed 0x00RRGGBB integers rather than as the "#rrggbb" strings the
// file is written in: the client hands these straight to the VT core, and
// re-parsing hex on three platforms is three chances to disagree about a
// colour the daemon has already read correctly.
message Theme {
  string name = 1;
  // Whether the app's own surfaces go dark. Carried rather than derived from
  // the background, so a theme author picking a mid-grey ground decides which
  // way the chrome goes instead of a luminance threshold deciding for them.
  bool dark = 2;
  uint32 background = 3;
  uint32 foreground = 4;
  uint32 cursor = 5;
  // Exactly 16: ANSI 0-7 then 8-15. Anything else is dropped by the daemon
  // before it reaches here.
  repeated uint32 ansi = 6;
}

message ThemeList { repeated Theme items = 1; }

message Workspace {
  bytes id = 1;
  uint64 resource_version = 2;
  bytes repository_id = 3;
  string task_name = 4;
  string branch = 5;
  string worktree_path_token = 6;
  optional string worktree_path = 7; // host_admin only
  WorkspaceState state = 8;
  // Whether this workspace IS the repository's own checkout, from `git
  // worktree list`. Recognized this way rather than by task name, which a
  // linked worktree in a directory called `main` would defeat — and what
  // it guards is whether a client offers to delete the directory you work in.
  bool is_main_checkout = 9;
}

message WorkspaceList { repeated Workspace items = 1; }

enum WorkspaceState {
  WORKSPACE_STATE_UNSPECIFIED = 0;
  WORKSPACE_STATE_CREATING = 1;
  WORKSPACE_STATE_READY = 2;
  WORKSPACE_STATE_ACTIVE = 3;
  WORKSPACE_STATE_ERROR = 4;
  // Tag 5 was ARCHIVED. Same state, one word: archiving never touched git and
  // neither does hiding, so having both meant users guessing which one deleted
  // files. Reusing the tag is correct here and only here — it is a rename, not
  // a new meaning wearing an old number.
  WORKSPACE_STATE_HIDDEN = 5;
  // git no longer lists this worktree, but the row carries terminals worth
  // keeping. A row with nothing in it is deleted instead, never shown.
  WORKSPACE_STATE_WORKTREE_MISSING = 6;
}

// `intent` is durable. `state` is DERIVED at read time and never stored.
// Clients render `state` and must never compute it themselves.
message Terminal {
  bytes id = 1;
  uint64 resource_version = 2;
  uint64 lease_generation = 3;
  bytes workspace_id = 4;
  string title = 5;
  string command_preset = 6;
  TerminalIntent intent = 7;
  TerminalState state = 8;
  optional ExitStatus exit_status = 9;
  optional bytes writer_client_id = 10;
  uint32 columns = 11;
  uint32 rows = 12;
  optional bytes size_controller_client_id = 13;
  uint64 epoch = 14;

  // What the AGENT is doing, as distinct from whether its process is alive.
  // Derived from the terminal's screen by the daemon, never by a client: a
  // remote client has no screen to look at, and two clients that each decided
  // for themselves could disagree about the same terminal.
  AgentActivity activity = 15;
  // When `activity` last changed. A client shows "working for 4m" from this
  // rather than timing it locally, which would restart on every reconnect.
  optional google.protobuf.Timestamp activity_changed_at = 16;
  // What is RUNNING in the pane right now, as tmux reports it.
  //
  // Distinct from `command_preset`, which is only what the terminal was
  // launched as. Terminals are created as plain shells and the user types
  // `claude` into them, so the preset stops being true after the first
  // command; only this says what is actually there.
  string current_command = 17;

  // What this terminal's pane is HOSTING: a TUI, or a headless ACP agent.
  //
  // Durable intent, not runtime state. Distinct from the VT modes a terminal
  // reports and from `agent_mode` below — three unrelated things in one pane
  // would otherwise all be called mode.
  PaneMode pane_mode = 18;

  // The ACP session this terminal is for.
  //
  // Intent in the same sense as the branch: it says what this terminal is FOR.
  // It outlives every pane that ever hosts it, which is what makes toggling
  // `pane_mode` land on the same conversation rather than a new one. The
  // conversation itself is never stored anywhere.
  optional string agent_session_id = 19;

  // The ACP mode the agent is in, and the ones it offers. Both empty in
  // TERMINAL pane mode, where there is no agent to ask.
  optional string agent_mode = 20;
  repeated string available_agent_modes = 21;

  // Whether this terminal can be rendered as a native chat.
  //
  // Derived on the host, because it takes a screen read to answer: an agent
  // renames its own process, so what is running can only be identified by
  // looking. A client that guessed would offer the switch for a Codex pane,
  // which has no adapter — and the pane would come back as a different agent.
  bool chat_capable = 22;
}

// What a pane is hosting.
//
// UNSPECIFIED is never sent by the daemon: a client that cannot tell which
// mode a pane is in would not know which surface to draw.
enum PaneMode {
  PANE_MODE_UNSPECIFIED = 0;
  // A TUI. The default, the product's terminal-first promise, and the mode
  // that works with no ACP adapter installed.
  PANE_MODE_TERMINAL = 1;
  PANE_MODE_AGENT = 2;
}

// The four states a coding agent is in, plus the two non-answers.
//
// DONE is not a state of the process — it is IDLE that the user has not seen
// yet. That is what makes it the thing worth notifying about, and what makes it
// clear itself when someone looks.
enum AgentActivity {
  AGENT_ACTIVITY_UNSPECIFIED = 0;
  // Not an agent at all: a plain shell. Distinct from UNKNOWN, which means we
  // could not tell.
  AGENT_ACTIVITY_NONE = 1;
  AGENT_ACTIVITY_IDLE = 2;
  AGENT_ACTIVITY_WORKING = 3;
  // Waiting on the user: a permission prompt, a question, a confirmation.
  AGENT_ACTIVITY_BLOCKED = 4;
  AGENT_ACTIVITY_DONE = 5;
  // An agent is present but its screen matched nothing we recognize. Reported
  // honestly rather than guessed at, the same as a lost terminal.
  AGENT_ACTIVITY_UNKNOWN = 6;
}

message TerminalList { repeated Terminal items = 1; }

enum TerminalIntent {
  TERMINAL_INTENT_UNSPECIFIED = 0;
  TERMINAL_INTENT_RUNNING = 1; // the user wants this terminal alive
  TERMINAL_INTENT_STOPPED = 2; // deliberate stop or observed exit
  TERMINAL_INTENT_FAILED = 3;  // creation never established a live runtime
}

enum TerminalState {
  TERMINAL_STATE_UNSPECIFIED = 0;
  TERMINAL_STATE_STARTING = 1;
  TERMINAL_STATE_RUNNING = 2;
  TERMINAL_STATE_EXITED = 3;
  TERMINAL_STATE_ERROR = 4;
  TERMINAL_STATE_LOST = 5;
}

message ExitStatus {
  optional int32 code = 1;
  optional int32 signal = 2;
}

// A layout: terminals shown together, as tmux has arranged them.
//
// A tmux WINDOW is a layout and a tmux PANE is a terminal. Far Cooler stores none
// of this and computes none of it — tmux has had split trees, five named
// layouts, resizable dividers, zoom and pane movement between windows for twenty
// years, and it is already the authority for what is running. Keeping a second
// tree in the daemon meant a third copy of the geometry in every client that
// drew it, which is three chances to disagree about where a pane is.
//
// Nothing here is durable, and that is right: panes are processes, and if the
// server they live in dies there is no arrangement left to restore them into.
message PaneGroup {
  // The tmux window id, `@7`. Stable for the window's life, which is exactly as
  // long as the layout exists.
  string id = 1;
  bytes workspace_id = 2;
  string name = 3;
  bool active = 4;
  // The window's size in cells. A client scales these to pixels with its own
  // cell metrics; it never decides the arrangement.
  uint32 columns = 5;
  uint32 rows = 6;
  repeated PaneRect panes = 7;
  // tmux's own layout description, carried opaquely.
  //
  // Never parsed here. It is tmux's format, tmux is the only thing that has to
  // understand it, and a parser in Far Cooler would be a copy of tmux's tree free
  // to drift from it. Handed straight back to `select-layout` to restore an
  // arrangement.
  string layout = 8;
}

// Where one terminal sits inside its layout, in cells, as tmux placed it.
message PaneRect {
  bytes terminal_id = 1;
  uint32 left = 2;
  uint32 top = 3;
  uint32 columns = 4;
  uint32 rows = 5;
  // Holds the keyboard. tmux's active pane, so it cannot disagree with where
  // typing actually goes.
  bool focused = 6;
  bool zoomed = 7;
}

// Ordered by window index, which is what `layout group select 2` counts.
message PaneGroupList {
  bytes workspace_id = 1;
  repeated PaneGroup items = 2;
}

// tmux's five, by tmux's names.
enum LayoutPreset {
  LAYOUT_PRESET_UNSPECIFIED = 0;
  LAYOUT_PRESET_EVEN_HORIZONTAL = 1; // side by side, one row
  LAYOUT_PRESET_EVEN_VERTICAL = 2;   // stacked, one column
  LAYOUT_PRESET_MAIN_VERTICAL = 3;   // one big pane left, rest stacked right
  LAYOUT_PRESET_MAIN_HORIZONTAL = 4; // one big pane top, rest in a row below
  LAYOUT_PRESET_TILED = 5;           // grid
}

// Which edge of a pane something was dropped on.
//
// The whole vocabulary of an arbitrary split, and it maps onto tmux exactly:
// left and right are `-h`, top and bottom are `-v`, and left and top add `-b`.
enum SplitSide {
  SPLIT_SIDE_UNSPECIFIED = 0;
  SPLIT_SIDE_LEFT = 1;
  SPLIT_SIDE_RIGHT = 2;
  SPLIT_SIDE_TOP = 3;
  SPLIT_SIDE_BOTTOM = 4;
}

message Operation {
  bytes id = 1;
  uint64 resource_version = 2;
  string kind = 3;
  bytes resource_id = 4;
  OperationState state = 5;
  bool cancellable = 6;
  optional ErrorCode error_code = 7;
  uint64 log_cursor = 8;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_QUEUED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_SUCCEEDED = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELING = 5;
  OPERATION_STATE_CANCELED = 6;
}

message DaemonVersion {
  string daemon_version = 1;
  repeated uint32 protocol_versions = 2;
  repeated string capabilities = 3;
}

// ---------------------------------------------------------------------------
// Business payloads (no target ids, no expected_* fields)
// ---------------------------------------------------------------------------

message Empty {}

message TypedConfirmation { string typed_confirmation = 1; }

message RepositoryRootAdd {
  string absolute_path = 1;
  string typed_confirmation = 2;
}

message RepositoryRegister { string relative_path = 1; }

message WorkspaceCreate {
  string task_name = 1;
  string branch = 2;
  string base_revision = 3;
  string cli_preset = 4;
  // Adopt `branch` instead of creating it.
  //
  // Work arrives on a branch as often as it starts on one — pushed from
  // another machine, handed over by a colleague, or produced by a cloud agent.
  // A branch that exists only on a remote gets a local tracking branch.
  bool adopt_existing = 5;
}

message Branch {
  string name = 1;
  bool local = 2;
  optional string remote = 3;
  // Already checked out in another worktree. git refuses a second checkout, so
  // a client must be able to show this before someone picks it.
  bool checked_out = 4;
  google.protobuf.Timestamp updated_at = 5;
  string subject = 6;
}

message BranchList { repeated Branch items = 1; }

// A worktree that exists on disk but is not yet a task workspace.
//
// People arrive with a repository they have used for months and several
// worktrees already checked out. Until Far Cooler can see those it only knows
// about work it started itself, which means re-creating by hand what you already
// have — a bad first hour with a tool whose whole point is saving you time.
message ExistingWorktree {
  // Present, not optional, and deliberately.
  //
  // Every other path in this protocol is redacted below host_admin and stood in
  // for by a token derived from the resource's id — a hash of the path would be
  // a fixed function of the secret being withheld, so a client could confirm a
  // guess. A worktree that is not registered HAS no id to derive one from, and
  // inventing an ephemeral one would make the daemon remember something between
  // two requests for no gain. So the method requires host_admin instead, and
  // anyone who can call it can already see paths.
  string path = 1;
  // Absent for a detached HEAD, rather than filled in with a guess.
  optional string branch = 3;
  string head = 4;
  // Suggested workspace name: the directory's own, which is what whoever made
  // the worktree already chose to call this work.
  string suggested_name = 5;
  // git holds a lock on it. Importable, but worth saying.
  bool locked = 6;
}

message WorktreeList { repeated ExistingWorktree items = 1; }

message TerminalCreate {
  string title = 1;
  string command_preset = 2;
  // Put the new terminal straight into the workspace's active group.
  //
  // What `prefix %` means: you are looking at a layout and you want another
  // pane in it. Nothing tiles by default, so this is the one path that adds to
  // a group without being asked twice, and it does nothing when there is no
  // group to add to.
  bool join_active_group = 3;
}

message TerminalResize {
  uint32 columns = 1;
  uint32 rows = 2;
  uint64 view_activity_id = 3;
}

message TerminalStop {
  bool force = 1;
  optional string typed_confirmation = 2;
}

// A pane's visible screen, escapes and all.
//
// For clients that cannot reach tmux themselves, which is every remote one: the
// CLI and the Mac app read screens straight from tmux because they are on the
// host, and a phone over ssh has no such option. Without this the phone can list
// terminals and act on them but never show one, which is most of what it is for
// at 3am.
//
// Escape sequences are preserved rather than stripped. The client has the same
// emulator the daemon does, so what travels is what tmux would have sent and the
// phone renders color, cursor position and all — a plain-text capture would
// arrive already flattened and could never be anything but grey.
message TerminalScreen {
  // Empty when `unchanged` is set, so an idle pane costs a few bytes instead of
  // a few kilobytes on every poll.
  bytes contents = 1;
  uint32 columns = 2;
  uint32 rows = 3;
  uint32 cursor_column = 4;
  uint32 cursor_row = 5;
  // A cheap identity for this screen. Hand it back on the next request and the
  // host will say `unchanged` rather than resend a screen you already hold.
  //
  // A phone polls a terminal several times a second and most of those screens
  // are identical — an agent thinking, a shell at a prompt. Sending the whole
  // capture each time is bandwidth spent to learn nothing, and on a phone that
  // is battery.
  uint64 revision = 6;
  bool unchanged = 7;
  // The escape sequences that put a fresh emulator into the modes the pane's
  // program is actually in — alternate screen, mouse tracking and its
  // encoding, application cursor keys, wrap, caret visibility.
  //
  // A capture is contents; modes are not contents. They were set once, by
  // sequences the program emitted long before any client attached, so a client
  // that builds an emulator from a capture is wrong about all of them. The
  // stream's replay states them too, but a client cannot depend on that: a
  // stream that ends and reattaches rebuilds the emulator, and whichever
  // replay carried the modes may have gone into one that was then discarded.
  // Sent with the screen, they arrive with the state they describe.
  string modes = 8;
}

// Exact bytes for a pane's input.
//
// Bytes, not text: a key is not always a character. Arrows, Ctrl-C and a
// bracketed paste are all byte sequences, and anything that re-encoded them on
// the way would have to know the terminal's mode to get them right.
message TerminalWrite {
  bytes payload = 1;
}

// Ask for a screen, saying which one you already have.
message TerminalScreenRequest {
  // The `revision` from the last screen received. Zero means "send it whatever".
  uint64 known_revision = 1;
}

message TerminalAttach {
  optional uint64 last_acked_sequence = 1;
  optional string resume_token = 2;
}

// One payload for every layout mutation; the METHOD says which.
message LayoutUpdate {
  // The layout to act on, as a tmux window id. Empty means the workspace's
  // active one, which is what a person or an agent means by "here" almost every
  // time.
  string group_id = 1;
  optional LayoutPreset preset = 2;
  repeated bytes terminals = 3;
  optional bytes focus = 4;
  optional bytes zoom = 5;
  bool unzoom = 6;
  string name = 7;
  // Relative movement: -1 and +1 are the whole vocabulary.
  optional int32 step = 8;
  // Absolute pane, one-based, the way `prefix 1` reads.
  optional uint32 pane = 9;
  // For a split or a drop: which edge of `target`.
  SplitSide side = 10;
  // The pane being split or dropped onto. Empty means the focused one.
  optional bytes target = 11;
  // What to run in a pane this call creates.
  string command_preset = 12;
  // Cells to move a divider by, signed.
  optional int32 resize = 13;
  // The window's size in cells, so tmux lays out for the viewport actually on
  // screen rather than for whatever the last client asked for.
  optional uint32 columns = 14;
  optional uint32 rows = 15;
}

message TerminalAttachResult {
  uint64 epoch = 1;
  uint64 next_sequence = 2;
  uint64 oldest_sequence = 3;
  uint32 columns = 4;
  uint32 rows = 5;
  string resume_token = 6;
}

// ---------------------------------------------------------------------------
// Stable error codes. `core` owns one domain error enum exhaustively matched
// onto these; there is no catch-all arm.
// ---------------------------------------------------------------------------

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AUTH_REQUIRED = 1;
  ERROR_CODE_SCOPE_DENIED = 2;
  ERROR_CODE_VERSION_INCOMPATIBLE = 3;
  ERROR_CODE_HOST_OFFLINE = 4;
  ERROR_CODE_REPOSITORY_LOCKED = 5;
  ERROR_CODE_BRANCH_EXISTS = 6;
  ERROR_CODE_WORKTREE_EXISTS = 7;
  ERROR_CODE_DIRTY_WORKTREE = 8;
  ERROR_CODE_RUNNING_PROCESSES = 9;
  ERROR_CODE_OUTPUT_GAP = 10;
  ERROR_CODE_CLIENT_TOO_SLOW = 11;
  ERROR_CODE_OPERATION_FAILED = 12;
  ERROR_CODE_RESOURCE_CONFLICT = 13;
  ERROR_CODE_NOT_FOUND = 14;
  ERROR_CODE_INVALID_ARGUMENT = 15;
  ERROR_CODE_IDEMPOTENCY_MISMATCH = 16;
  ERROR_CODE_TMUX_UNAVAILABLE = 17;
  ERROR_CODE_PATH_NOT_ALLOWED = 18;
  ERROR_CODE_CONFIRMATION_REQUIRED = 19;
  // Workspaces still exist under the resource being removed. Distinct from
  // RUNNING_PROCESSES: nothing is running, but records would be orphaned.
  ERROR_CODE_WORKSPACES_EXIST = 20;
  // Distinct from PATH_NOT_ALLOWED: that one means "not covered by any
  // root you've allowlisted yet, allowlist it"; this one means "this exact
  // location — a whole home directory or a system path — will never be
  // allowlistable, pick something narrower inside it instead."
  ERROR_CODE_SENSITIVE_ROOT = 21;
}
