[package]
name = "farcooler-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native"]
# The daemon's side (a socket, sshd's stdio, the connections they serve) and
# the client's Unix-socket connect: everything that needs an OS under it. Off
# for the browser's build (ov-768), which is the client alone over a stream it
# is handed, and whose tokio must not pull in mio.
native = [
    "dep:libc",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/io-std",
    "tokio/process",
    "tokio/time",
    "tokio/signal",
    "tokio/fs",
]

[dependencies]
# Not `workspace = true`: the workspace's tokio carries `net`, and a feature
# can only be added to an inherited dependency, never taken away. These three
# are what the client needs on any target; `native` adds the rest.
tokio = { version = "1", default-features = false, features = ["sync", "io-util", "macros"] }
farcooler-protocol.workspace = true
farcooler-core.workspace = true
# `encoded_len`, so the push queue counts the bytes it holds rather than events.
prost.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# The local caller's pid (`LOCAL_PEERPID`), which tokio's `peer_cred` doesn't
# read on macOS: how the daemon tells a rep's pane from the owner (ov-494).
libc = { workspace = true, optional = true }

# `rt::spawn` and `rt::timeout` natively, whatever the features.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

# `rt::spawn` and `rt::timeout` in a browser: the page's task queue and its
# `setTimeout`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
# A paused clock, so timing tests decide by order of events rather than by
# how fast the machine is (ov-147).
tokio = { workspace = true, features = ["test-util"] }
