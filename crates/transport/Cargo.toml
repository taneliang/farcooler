[package]
name = "farcooler-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# io-std is not part of the workspace tokio feature set (most crates never
# touch stdin/stdout); stdio.rs needs it for the sshd entry point (rule 1).
tokio = { workspace = true, features = ["io-std"] }
farcooler-protocol.workspace = true
farcooler-core.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
