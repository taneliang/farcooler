[package]
name = "farcooler-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# io-std is not part of the workspace tokio feature set (most crates never
# touch stdin/stdout); stdio.rs needs it for the sshd entry point (rule 1).
tokio = { workspace = true, features = ["io-std"] }
farcooler-protocol.workspace = true
farcooler-core.workspace = true
# `encoded_len`, so the push queue counts the bytes it holds rather than events.
prost.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# The local caller's pid (`LOCAL_PEERPID`), which tokio's `peer_cred` doesn't
# read on macOS: how the daemon tells a rep's pane from the owner (ov-494).
libc.workspace = true

[dev-dependencies]
tempfile = "3"
# A paused clock, so timing tests decide by order of events rather than by
# how fast the machine is (ov-147).
tokio = { workspace = true, features = ["test-util"] }
