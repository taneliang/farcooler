[package]
name = "farcooler-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
farcooler-protocol.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
serde.workspace = true
# Runtime, not just tests: `activity::handshake` speaks JSON-RPC to an ACP
# adapter, which is the same wire the tests used to build by hand.
# `raw_value`: a tool call's input is kept as written, for its row (ov-452).
serde_json = { workspace = true, features = ["raw_value"] }
toml.workspace = true
toml_edit.workspace = true
libc.workspace = true
icu_normalizer.workspace = true
