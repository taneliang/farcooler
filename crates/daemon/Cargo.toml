[package]
name = "farcooler-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "farcooler_daemon"
path = "src/lib.rs"

[[bin]]
name = "farcoolerd"
path = "src/main.rs"

# The default build has no Go archive linked into `farcooler-tailcat`, and
# that is fine: `allowlist::start_tunnel` exists in this crate's code either
# way, it just always fails with `no_tailcat` until a platform script supplies
# the archive with `--features farcooler-tailcat/linked`. `tailcat` here is a
# thin mirror of that flag, the same one `crates/client/Cargo.toml` carries,
# for the one place inside this crate that would need to know at compile time
# whether the archive is really linked.
[features]
default = []
tailcat = ["farcooler-tailcat/linked"]

[dependencies]
farcooler-agent.workspace = true
farcooler-core.workspace = true
farcooler-fence.workspace = true
farcooler-review.workspace = true
# The tunnel. Stubbed by default — see the `tailcat` feature above — so a
# plain checkout with no Go toolchain still produces a `farcoolerd` that
# serves nothing but fails with one named error rather than silently opening
# an empty allowlist to the world. See `allowlist::start_tunnel`.
farcooler-tailcat.workspace = true
sha2 = "0.10"
# Recursive filesystem watching for the three session-log roots. Not already
# in the tree (checked `Cargo.lock` and every crate's `Cargo.toml` first).
notify = "8"
farcooler-protocol.workspace = true
farcooler-store.workspace = true
farcooler-tmux.workspace = true
farcooler-transport.workspace = true
prost-types.workspace = true
bytes.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
directories.workspace = true
libc.workspace = true
# Reading and writing `authorized_keys`, which is the one file this daemon
# edits that somebody's SSH access already depends on. Hand-rolling a public
# key parser to decide whether a received string is an ed25519 key would be a
# parser written against attacker-supplied bytes, which is the last place to
# want one.
#
# Already in the lock at this exact version, through russh in `farcooler-client`
# — this adds an edge, not a tree. `default-features = false` with only `alloc`
# because nothing here verifies a signature: the algorithms are decoded, never
# used, so none of ed25519-dalek, rsa, p256, p384 or p521 is wanted.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["alloc"] }
# Descriptor-relative file operations, for the one write in this program that
# must not be redirected: `openat`, `flock`, `fstat`, `renameat`, `fsync`.
#
# A decision rather than an implementation detail. `O_NOFOLLOW` on the final
# path guards only that component, so somebody who replaces `.ssh` with a
# symlink between the check and the rename redirects a key into a directory
# they can read. Anchoring every component to a held descriptor is what closes
# that, `openat2` would be neater and is Linux-only, and doing it through raw
# `libc` means hand-managing descriptor lifetimes in unsafe blocks on the path
# where a mistake costs somebody their access.
#
# Already in the lock at this version, through `tempfile` and
# `alacritty_terminal` — an edge, not a tree.
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
farcooler-transport.workspace = true
# The emulator every client runs, so `replay`'s tests can assert what a client
# ends up holding rather than which bytes were written at it. A dev-dependency
# only: the daemon itself never parses a screen.
farcooler-vt = { path = "../vt" }
# The client the phone actually runs, so the streaming test drives
# `Session::open_stream` rather than a second idea of what it does. A
# dev-dependency cycle — `farcooler-client` depends on this crate — which cargo
# permits precisely for this: a test that needs the real caller.
farcooler-client.workspace = true
