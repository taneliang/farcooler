[package]
name = "farcooler-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "farcooler_daemon"
path = "src/lib.rs"

[[bin]]
name = "farcoolerd"
path = "src/main.rs"

[dependencies]
farcooler-agent.workspace = true
farcooler-core.workspace = true
farcooler-review.workspace = true
sha2 = "0.10"
# Recursive filesystem watching for the three session-log roots. Not already
# in the tree (checked `Cargo.lock` and every crate's `Cargo.toml` first).
notify = "8"
farcooler-protocol.workspace = true
farcooler-store.workspace = true
farcooler-tmux.workspace = true
farcooler-transport.workspace = true
prost-types.workspace = true
bytes.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
directories.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile = "3"
farcooler-transport.workspace = true
