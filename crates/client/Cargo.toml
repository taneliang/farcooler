[package]
name = "farcooler-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "farcooler_client"
# Both, so iOS links statically and macOS development can link dynamically.
# staticlib for Apple platforms and the NDK; rlib so the workspace can
# use it directly. No cdylib: iOS does not load dynamic libraries from an
# app bundle, and its presence made every iOS build fail at a link step
# that produces something nothing would ever load.
crate-type = ["staticlib", "rlib"]

# Two builds of one client (ov-768, plan-763 slice 5).
#
# `native`, the default, is every client that runs as a process: the phones'
# FFI, the CLI and the Mac. russh on aws-lc, tokio's sockets and processes,
# the tunnel (`farcooler-tailcat`) and the fenced `~/.ssh/config` writer.
#
# `web` is the browser's (crates/web): russh on ring, an SSH connection the
# page already authenticated over a stream it dialed, and the page's task
# queue and clock (`farcooler_transport::rt`). It builds for
# wasm32-unknown-unknown, where aws-lc's C and tokio's mio cannot, and CI
# holds that tree to neither (scripts/web-client-tree-check.py).
#
# The two can be built together, which is what `--workspace` lints with
# `--all-features` would do, but nothing ships that way.
#
# The default build has no Go archive linked into `farcooler-tailcat`, and
# that is fine: the tunnel path exists in this crate's code either way, it
# just always fails with `no_tailcat` until a platform script supplies the
# archive with `--features farcooler-tailcat/linked`. `tailcat` here is a
# thin mirror of that flag, for the one place inside this crate that needs to
# know at compile time whether the archive is really linked: the test that
# proves a build without one fails the tunnel by name.
[features]
default = ["native"]
native = [
    "dep:farcooler-tailcat",
    "dep:farcooler-fence",
    "dep:farcooler-ffi-guard",
    "dep:rand",
    "farcooler-transport/native",
    "russh/aws-lc-rs",
    "russh/flate2",
    "russh/rsa",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/io-std",
    "tokio/process",
    "tokio/time",
    "tokio/signal",
    "tokio/fs",
]
web = ["russh/ring", "uuid/js"]
tailcat = ["native", "farcooler-tailcat/linked"]

[dependencies]
farcooler-core.workspace = true
farcooler-protocol.workspace = true
# A path, not `workspace = true`: an inherited dependency keeps the
# workspace's default features whatever this line says, and the browser's
# build must not have `native`.
farcooler-transport = { path = "../transport", default-features = false }
farcooler-ffi-guard = { workspace = true, optional = true }
farcooler-tailcat = { workspace = true, optional = true }
# The ceremony's codes and rules, re-exported as `ceremony` so every caller is
# unchanged. Their own crate so the browser builds the same rules (ov-764).
farcooler-ceremony.workspace = true
# Not `workspace = true`, for the reason farcooler-transport's manifest gives:
# the workspace's tokio carries `net`, which is mio, which a browser cannot
# build. `native` adds the rest.
tokio = { version = "1", default-features = false, features = ["sync", "io-util", "macros"] }
bytes.workspace = true
uuid.workspace = true
# Derived, for the two ceremony payloads. Hand-written encoders for a struct
# that must round-trip byte-for-byte between three platforms is a second place
# for the field names to be wrong.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
# The crypto backend is the feature's: aws-lc natively, ring in a browser.
russh = { version = "0.62", default-features = false }
async-trait = "0.1"
# The RNG russh itself uses to generate keys. Matching upstream rather than
# picking our own means one source of randomness, and one thing to audit.
rand = { version = "0.10", optional = true }

# The fenced writer for `~/.ssh/config`, and NOT target-gated.
#
# This used to be a dependency on `farcooler-daemon` — a client crate reaching
# into the crate that serves it — gated to macOS and Linux so that phones did not
# compile bundled SQLite, an HTTPS stack, the terminal multiplexer and every agent
# adapter into the iOS static archive and the Android `.so` for a call they cannot
# make. Extracting `fence` removed the gate rather than moving it: this crate is
# the protocol's `Scope` and some syscalls, and it builds for
# `aarch64-apple-ios` and `aarch64-linux-android` as readily as for a desktop.
#
# One implementation rather than two, for the reason that has not changed:
# `fence::write` opens every path component relative to a held descriptor with
# `O_NOFOLLOW`, verifies each with `fstat`, takes an advisory lock, fsyncs the
# file AND its directory before renaming, and leaves a checksummed backup. A
# second implementation would drift a missing fsync into a corrupted
# `~/.ssh/config`, which breaks Zed, git and plain `ssh` at once.
#
# The `~/.ssh/config` entry point is still `cfg`-gated in `ffi.rs`, now for the
# only honest reason left: a phone has no `~/.ssh` for an editor to read.
farcooler-fence = { workspace = true, optional = true }

# ring asks getrandom 0.2 for randomness, and a browser's is the page's.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
# The page's clock, for `session::now_millis`.
js-sys = "0.3"

# `pipe.rs` closes what a spawned `runner pipe` would inherit; macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
# `test-util` for tokio's pausable clock: the foreground probe's deadline
# (ov-613) tested in no wall time. A dev-dependency, so nothing ships with it.
tokio = { workspace = true, features = ["test-util"] }
# `NeedsYouItem.since`, built by hand for the shared needs-you fixture.
prost-types.workspace = true
# The plan fixture's wire bytes, encoded and decoded as the runner's are (ov-274).
prost.workspace = true
# The tests drive the real daemon binary, not a stub — this is a dev-dependency
# only, so it does not put the daemon back on any shipping build's graph.
farcooler-daemon.workspace = true
# Test teardown ends its tmux server by PID (ov-207).
farcooler-tmux.workspace = true
# A board's tasks, written into the runner's store for the phone-path tests (ov-113).
farcooler-store.workspace = true
