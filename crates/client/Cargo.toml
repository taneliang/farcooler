[package]
name = "farcooler-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "farcooler_client"
# Both, so iOS links statically and macOS development can link dynamically.
# staticlib for Apple platforms and the NDK; rlib so the workspace can
# use it directly. No cdylib: iOS does not load dynamic libraries from an
# app bundle, and its presence made every iOS build fail at a link step
# that produces something nothing would ever load.
crate-type = ["staticlib", "rlib"]

[dependencies]
farcooler-core.workspace = true
farcooler-protocol.workspace = true
farcooler-transport.workspace = true
tokio.workspace = true
bytes.workspace = true
uuid.workspace = true
# Derived, for the two ceremony payloads. Hand-written encoders for a struct
# that must round-trip byte-for-byte between three platforms is a second place
# for the field names to be wrong.
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
russh = "0.62"
async-trait = "0.1"
# The RNG russh itself uses to generate keys. Matching upstream rather than
# picking our own means one source of randomness, and one thing to audit.
rand = "0.10"

# The fenced writer for `~/.ssh/config`, which lives in the daemon because
# `~/.ssh/authorized_keys` needed it first.
#
# A dependency pointing the wrong way — a client crate reaching into the crate
# that serves it — and it is here rather than reimplemented for one reason:
# `fence::write` opens every path component relative to a held descriptor with
# `O_NOFOLLOW`, verifies each with `fstat`, takes an advisory lock, fsyncs the
# file AND its directory before renaming, and leaves a checksummed backup. A
# second implementation would drift a missing fsync into a corrupted
# `~/.ssh/config`, which breaks Zed, git and plain `ssh` at once. There is no
# cycle: nothing the daemon depends on depends on this crate.
#
# **The right shape is `fence` in a crate of its own**, which both this and the
# daemon depend on. That is a change to `crates/daemon`, so it is a follow-up
# rather than a thing to do on the way past — and until it happens, this edge is
# the honest cost of having one writer.
#
# Target-gated to the platforms that have an `~/.ssh` for an editor to read.
# Unconditional, it would compile bundled SQLite, an HTTPS stack, the terminal
# multiplexer and every agent adapter into the iOS static archive and the Android
# `.so` — measured at 85 seconds of new compilation per slice — for a call a
# phone cannot make. The entry point itself is NOT gated: see `ffi.rs`, because a
# symbol that exists on some targets is a link error waiting for whoever shares
# that Swift file next.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
farcooler-daemon.workspace = true

[dev-dependencies]
tempfile = "3"
# The tests drive the real daemon binary, not a stub. Also the source of the
# fence markers the `~/.ssh/config` tests assert on: spelling them again in a
# test would let the two sides drift and still pass.
farcooler-daemon.workspace = true
