[package]
name = "farcooler-ceremony"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The enrollment ceremony's two codes and every rule that refuses one, in a
# crate of their own so the browser runs the same rules (ov-764). Out of
# `farcooler-client`, which re-exports it as `farcooler_client::ceremony`, so
# every native caller is unchanged.
#
# Nothing here may reach for a socket, a file or a thread: `crates/web` builds
# it for wasm32-unknown-unknown. That is why the node-key predicate comes from
# `farcooler-protocol` rather than from `farcooler-fence`, whose file writer
# is unix syscalls.
[lib]
name = "farcooler_ceremony"

[dependencies]
farcooler-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The same version russh brings, so a fingerprint here is the one the
# daemon's fence and the host-key check print. `alloc` is all the ceremony
# asks of it: parsing an OpenSSH public key and printing its SHA256.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["alloc"] }
# The ceremony id's 128 random bits, from the RNG russh itself uses.
rand = "0.10"
# Sealing the reply for the relay (ov-769): RFC 9180 HPKE, base mode, with
# X25519, HKDF-SHA256 and ChaCha20-Poly1305 and nothing else. Not
# `getrandom`'s feature: the caller's RNG is `rand`'s, which already knows how
# to ask a browser. The same aead, hkdf and curve25519 versions as the rest of
# the tree, so this adds hpke and x25519-dalek and no second copy of either.
# Checked against RFC 9180's test vectors upstream but never formally
# audited: acceptable for keeping a topology blob from the relay (ov-769
# security review, N5).
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha"] }
# The reply key and the sealed reply as unpadded base64url: compact enough
# that a full sealed manifest stays under the relay's 4 KB with room to
# spare, and the encoder `ssh-key` already brings.
base64ct = { version = "1.8", features = ["alloc"] }
# The comparison code's hash (ov-770): the version crates/web and ssh-key
# already bring, so no second copy.
sha2 = { version = "0.11", default-features = false }

# A browser has no OS RNG for rand to call, so wasm asks the page's
# `crypto.getRandomValues` for the ceremony id's bits. Not a native build's
# concern: the target gate keeps it off every other graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
