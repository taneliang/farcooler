[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/agent",
    "crates/store",
    "crates/tmux",
    "crates/transport",
    "crates/vt",
    "crates/client",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
overnight-protocol = { path = "crates/protocol" }
overnight-core = { path = "crates/core" }
overnight-agent = { path = "crates/agent" }
overnight-store = { path = "crates/store" }
overnight-tmux = { path = "crates/tmux" }
overnight-transport = { path = "crates/transport" }
overnight-client = { path = "crates/client" }
overnight-daemon = { path = "crates/daemon" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
# The only HTTPS client in the workspace, and it exists for exactly one call:
# the daemon telling the relay that an agent needs its owner. Every other
# network path here is ssh, which is a subprocess.
#
# `rustls` rather than the default TLS, so a Linux host does not need OpenSSL
# headers to build the thing that watches its agents; `default-features = false`
# because none of the rest — cookies, blocking, multipart, compression — is
# wanted on that path.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
