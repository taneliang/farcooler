# One relay per channel.
#
# The channels design partitions everything on a machine — runtime directory,
# database, tmux server, binary name, bundle identifier — and this carries that
# through the server. Four deployments, four databases, four WorkOS
# environments, four hostnames.
#
# NOT one relay that knows about channels, and the reason is authentication:
# `verifySession` fetches the JWKS for WORKOS_CLIENT_ID and the code exchange
# spends WORKOS_API_KEY, so a single relay serving two WorkOS environments would
# have to choose which credentials to verify a token against BEFORE it knows who
# the caller is. Accounts do not carry across anyway — `accounts.id` is the
# WorkOS user id, so a preview on its own WorkOS environment issues ids from a
# different namespace and the same person is already two rows.
#
# The payoff is that `src/` needs no idea any of this exists. Every per-channel
# value is a var or a secret, so the code is single-tenant for whichever channel
# it was deployed as. See
# docs/superpowers/specs/2026-08-12-relay-channels-and-staging-design.md.
#
# Bindings are NOT inherited by environments. Wrangler inherits `main` and
# `compatibility_date` but not vars, databases or bindings, so each block below
# repeats the full set. An environment missing one does not fail to deploy — it
# fails at runtime, on a request, which is a much worse place to find out.
#
# `[observability]` is the one exception and it is deliberate — see the block
# under `routes`, which explains why it is declared once and inherited.

name = "farcooler-relay"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# The hostname every stable client is compiled to reach.
#
# In the file rather than bound in the dashboard, which is where it lived
# before: `crates/daemon/src/push.rs`, `Account.swift` and `Account.kt` all
# default to this, and those defaults ship inside App Store binaries that cannot
# be told a new one for days. A hostname that load-bearing should not be a click
# that exists in no diff and no backup.
#
# Safe to re-declare: wrangler treats an already-bound custom domain as a no-op.
routes = [{ pattern = "relay.farcooler.com", custom_domain = true }]

# Workers Logs, on, for all four relays.
#
# THE ONE KEY IN THIS FILE THAT IS INHERITED, which is why it appears once at
# the top and in no environment block — the exact opposite of the rule the
# header above sets out. Checked against the wrangler this repo pins (3.114.17,
# see package-lock.json): `vars`, `d1_databases` and `unsafe.bindings` go
# through `notInheritable()`, which is why each environment below repeats them,
# while `observability` goes through `inheritable()`, which falls back to the
# top-level value when an environment does not set one. Repeating it per
# environment would work and would be four places to forget.
#
# Not a dashboard toggle, because a dashboard toggle does not survive. Every
# `wrangler deploy` PATCHes script-settings with
# `observability: worker.observability ?? { enabled: false }` — absent from this
# file means "the operator wants it off", not "leave it alone" — so switching it
# on by hand lasts exactly until the next push to main.
#
# Without it `console.error` is write-only. The relay logs four things that
# exist for after the fact: the top-level 500 handler, the WorkOS authenticate
# failure, the live-activity push failure, and `relay misconfigured` — which is
# the one that names an APNS_TOPIC belonging to another channel, a fault whose
# entire symptom is notifications that never arrive. `wrangler tail` catches
# none of it unless someone happened to be attached at the time.
#
# head_sampling_rate = 1 keeps every invocation. This is one relay per channel
# serving pushes for a handful of paired devices, not a service where sampling
# is a cost question, and a sampled log is worthless for the failures here:
# every one of them is a single request that somebody is asking about by name.
[observability]
enabled = true
head_sampling_rate = 1

# Identity, devices, and pairings. Small and relational.
[[d1_databases]]
binding = "DB"
database_name = "farcooler"
database_id = "fe999c45-6f1f-4883-bf09-c1adc88b9e6a"

# Counters, kept apart from the account data on purpose — see analytics.ts.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "farcooler_events"

[vars]
WORKOS_CLIENT_ID = "client_01M03MXEFY8BCKCEJCXARCHMMX"
# The only issuer whose tokens this deployment accepts.
#
# THE PATH FORM, `https://api.workos.com/user_management/<client id>`, and so a
# DIFFERENT VALUE IN EVERY ENVIRONMENT: the path segment is that environment's
# WORKOS_CLIENT_ID, the line directly above this one. It is not a bare host, and
# the comment that used to stand here said at length that it was.
#
# How that was established, because the docs will tell you otherwise: a live
# canary access token was decoded — base64url the middle segment of the JWT,
# `iss` is in the resulting JSON — and it read
# `https://api.workos.com/user_management/client_01M03MZKRH5ZPR160DATT149WX`,
# which is exactly canary's client id below. A real token from the deployment in
# question beats a sample in a docs page and beats a GitHub thread about
# somebody else's setup, and it is a thirty-second check anyone can repeat
# against any channel before touching this line.
#
# What the wrong value did, so the cost of getting it wrong is on the record.
# `verifySession` compares `claims.iss` against this var and the comparison
# landed in the same commit as the wrong value (eb56857, Aug 17), so from that
# commit every session-authenticated route on every channel returned 401:
# /v1/devices refused to register a phone, /v1/daemons refused to pair a runner
# — the Mac said "The relay wouldn't issue a token" — and /v1/account could load
# neither. /v1/notify authenticates with a daemon token rather than a session,
# so it went on answering 200 while delivering to zero devices, which is how two
# days passed with no push notifications and nothing red anywhere.
#
# In a var rather than a constant in code because the issuer is not derivable
# from the client id forever: a channel that takes a custom AuthKit domain gets
# an issuer on that domain instead, and a relay with the host compiled in would
# refuse every real token with no way to correct it short of a deploy. Per
# environment rather than shared for the same reason it has to be per
# environment today — the value genuinely differs, and `vars` are not inherited.
WORKOS_ISSUER = "https://api.workos.com/user_management/client_01M03MXEFY8BCKCEJCXARCHMMX"
# Which channel this deployment IS.
#
# Only so the relay can check that APNS_TOPIC belongs to it. That secret must
# equal the receiving app's bundle identifier and each channel has its own, so
# a relay holding another channel's topic has every push rejected by APNs with
# nothing anywhere saying so. Six secrets have to be right per environment and
# this is the one whose wrongness is invisible. See `topicMismatch` in push.ts.
CHANNEL = "stable"
# Everything else is a secret, set with `wrangler secret put`:
#   WORKOS_API_KEY      verifying session tokens
#   APNS_KEY_P8         the Apple auth key
#   APNS_KEY_ID
#   APNS_TEAM_ID
#   APNS_TOPIC          the iOS bundle id
#   FCM_SERVICE_ACCOUNT the Google service account JSON, for Android
#   ANALYTICS_SALT      rotates monthly; see analytics.ts
#
# Per environment, with `--env`:
#   wrangler secret put APNS_TOPIC --env preview
#
# APNS_TOPIC is the one that differs by more than value: it must equal the
# RECEIVING APP'S BUNDLE ID, and each channel has its own. A preview relay
# holding the stable topic reproduces exactly the bug this partition exists to
# fix —
# APNS rejects the pairing, the notification never arrives, and nothing says so.

# Throttling for /v1/auth/*, the only routes anyone can call without a
# credential — and two of them spend the WorkOS API key per request, so
# unlimited they are a way to exhaust the upstream quota and deny sign-in to
# everyone. Thirty in a minute is far above a person signing in and far below
# anything worth doing to us.
[[unsafe.bindings]]
name = "AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# ---------------------------------------------------------------------------
# preview
#
# What the EXTERNAL TestFlight app and `farcoolerd-preview` talk to. Its own
# everything: a WorkOS environment, so a preview sign-in is a different account
# namespace; its own D1, so a preview pairing cannot notify a stable app; its
# own APNS topic, because the preview app is a different bundle.
#
# Deployed when a preview is promoted, at the tagged commit, so this relay is
# the preview's own code. `workflow_dispatch` also puts any ref here, which is how a
# relay change gets tried against a real app before it is promoted anywhere.
# See .github/workflows/relay.yml.
# ---------------------------------------------------------------------------
[env.preview]
name = "farcooler-relay-preview"
routes = [{ pattern = "relay-preview.farcooler.com", custom_domain = true }]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "farcooler-preview"
database_id = "853ac487-4ce6-4b0e-8291-1e54c7233eb3"

# Its own dataset, not a shared one with a channel column: an analytics query
# that had to remember to filter is a query someone will forget to filter.
[[env.preview.analytics_engine_datasets]]
binding = "METRICS"
dataset = "farcooler_events_preview"

[env.preview.vars]
WORKOS_CLIENT_ID = "client_01M03MXE27CHCZJJ0TMY7KCMAH"
# The path form, carrying THIS environment's client id — the line above, again.
# The stable block says why at length, and what the bare host cost.
WORKOS_ISSUER = "https://api.workos.com/user_management/client_01M03MXE27CHCZJJ0TMY7KCMAH"
CHANNEL = "preview"

# A separate namespace, so a burst against preview cannot spend the stable
# relay's rate-limit budget.
[[env.preview.unsafe.bindings]]
name = "AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# ---------------------------------------------------------------------------
# canary
#
# What the INTERNAL TestFlight app and `farcoolerd-canary` talk to. Every push
# to main lands here, so this is the relay that breaks first — which is the
# whole job. Its data is expendable in a way no other channel's is.
# ---------------------------------------------------------------------------
[env.canary]
name = "farcooler-relay-canary"
routes = [{ pattern = "relay-canary.farcooler.com", custom_domain = true }]

[[env.canary.d1_databases]]
binding = "DB"
database_name = "farcooler-canary"
database_id = "9a02931a-1f29-4560-8da2-69af03674f6f"

[[env.canary.analytics_engine_datasets]]
binding = "METRICS"
dataset = "farcooler_events_canary"

[env.canary.vars]
WORKOS_CLIENT_ID = "client_01M03MZKRH5ZPR160DATT149WX"
# The path form, carrying THIS environment's client id — the line above, again.
# The stable block says why at length, and what the bare host cost.
WORKOS_ISSUER = "https://api.workos.com/user_management/client_01M03MZKRH5ZPR160DATT149WX"
CHANNEL = "canary"

[[env.canary.unsafe.bindings]]
name = "AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# ---------------------------------------------------------------------------
# local
#
# What a build made on somebody's own machine talks to.
#
# Defined here so the shape is complete and a local build has somewhere to
# point, but it need not be PROVISIONED until someone wants push notifications
# out of one. Until then a local build's registration fails visibly, which is
# the honest behaviour for a channel whose whole point is that nothing is
# settled.
# ---------------------------------------------------------------------------
[env.local]
name = "farcooler-relay-local"
routes = [{ pattern = "relay-local.farcooler.com", custom_domain = true }]

[[env.local.d1_databases]]
binding = "DB"
database_name = "farcooler-local"
database_id = "797e5eb9-8e90-4464-9890-3e35494205fe"

[[env.local.analytics_engine_datasets]]
binding = "METRICS"
dataset = "farcooler_events_local"

[env.local.vars]
WORKOS_CLIENT_ID = "client_01M03N3DFQNDCK819XSRTK2FJD"
# The path form, carrying THIS environment's client id — the line above, again.
# The stable block says why at length, and what the bare host cost.
WORKOS_ISSUER = "https://api.workos.com/user_management/client_01M03N3DFQNDCK819XSRTK2FJD"
CHANNEL = "local"

[[env.local.unsafe.bindings]]
name = "AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
