# The marketing site: one Worker, static assets, served at www.farcooler.com.
# And the web app at /app, once per relay channel (ov-521): this top-level block
# is production (www.farcooler.com, reading relay.farcooler.com), and
# [env.preview] and [env.canary] below are the same Worker code at
# preview.farcooler.com and canary.farcooler.com, reading relay-preview and
# relay-canary, each signing in through that relay's WorkOS client. Production
# is the top level, as it is in
# services/relay/wrangler.toml, so `wrangler deploy` with no --env still means
# www. How each one deploys is in .github/workflows/site.yml.
#
# A Worker in front of the assets rather than assets alone, because three things
# need code: `/download/canary` (a redirect to whatever the newest canary build
# is), the analytics beacon (injected into the page only when a token is set),
# and, later, the web app at /app. `run_worker_first` makes every request go
# through it; the page itself is then fetched from the ASSETS binding.
#
# www.farcooler.com is a Workers custom domain, like relay.farcooler.com in
# services/relay/wrangler.toml: the zone is already on this account, and
# wrangler creates the DNS record and certificate on deploy.
name = "farcooler-site"
main = "src/index.ts"
compatibility_date = "2026-01-15"
routes = [
  { pattern = "www.farcooler.com", custom_domain = true },
  # The bare domain only redirects to www (src/index.ts). Its MX records are untouched.
  { pattern = "farcooler.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

# No invocation log. It records each request's URL, and a join link carries its
# invite code in the path (/app/join/<code>, ov-524): Workers Logs would keep
# every code for as long as it keeps logs. Console logs stay on, and the app
# writes none that carry a request (test/app-logs.test.ts). Inherited by the
# preview and canary environments below, like the rest of [observability].
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

# Downloads per build (ov-504): one row per /download/canary redirect, holding
# the build number and nothing about the visitor.
[[analytics_engine_datasets]]
binding = "DOWNLOADS"
dataset = "farcooler_downloads"

[vars]
# Where the newest canary build is announced. The download redirect only ever
# sends a browser to the host of this URL (and only to a .dmg under /canary/).
APPCAST_URL = "https://updates.farcooler.com/canary/appcast.xml"
# Cloudflare Web Analytics site token. EMPTY ON PURPOSE: with no token the page
# carries no beacon at all. Set it here (a token is public: it ships in the page)
# once the site exists in Cloudflare Web Analytics.
ANALYTICS_TOKEN = "167c3ceefc5f495a8f3ee467d3825c0f"
# The web app at /app (src/app). With either one empty, /app shows "Not
# available yet" and nothing else. Set both together, from ONE relay's block in
# services/relay/wrangler.toml: the relay's hostname and that same block's
# WORKOS_CLIENT_ID, the one WorkOS client the apps and the web app share (a
# client id is public). That client needs https://www.farcooler.com/app/callback
# as a redirect URI and https://www.farcooler.com/app as a sign-out redirect.
# Sign-in goes through the relay's own /v1/auth/token, which holds the WorkOS
# API key. The one secret is VISITOR_SECRET, below.
APP_RELAY_URL = "https://relay.farcooler.com"
APP_WORKOS_CLIENT_ID = "client_01M03MXEFY8BCKCEJCXARCHMMX"

# The web app's limit on sign-in and refresh, per visitor (src/app/relay.ts,
# `withinLimit`). The relay limits /v1/auth/* by caller address, and every call
# from this Worker arrives from Cloudflare's, so all web visitors share that one
# bucket of 30 a minute; this stops a single visitor emptying it with junk
# callbacks or dead cookies. Ten a minute is far above one person signing in.
# Declared like the relay's AUTH_LIMIT, in its own namespace.
#
# VISITOR_SECRET is required for /app to leave that shared bucket (ov-811). It
# is a secret, not a var, set per channel to the same value as that channel's
# relay's VISITOR_SECRET (services/relay/wrangler.toml):
#   wrangler secret put VISITOR_SECRET                 (www, relay.farcooler.com)
#   wrangler secret put VISITOR_SECRET --env preview   (relay-preview)
#   wrangler secret put VISITOR_SECRET --env canary    (relay-canary)
# With it, each /v1/auth call names the visitor, signed, and the relay limits
# each visitor on its own (`visitorHeaders` in services/common/relay.ts).
# Without it, every /app visitor shares the relay's one bucket for all of
# Cloudflare's Worker traffic, which anyone's Worker can fill.
[[unsafe.bindings]]
name = "APP_AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# ---------------------------------------------------------------------------
# preview and canary: the web app only.
#
# Same code, same assets, but every path outside /app and /download goes to
# MARKETING_ORIGIN (src/index.ts), so the marketing page lives on www alone.
# Like the relay's environments, each repeats every var and binding: wrangler
# inherits `main`, `routes`, `[assets]` and `[observability]`, but not `vars`
# or `unsafe.bindings`. Each declares its own routes, or it would inherit www.
# Each rate-limit namespace is its own: the relay's are 1001-1004.
# ---------------------------------------------------------------------------
[env.preview]
name = "farcooler-site-preview"
routes = [{ pattern = "preview.farcooler.com", custom_domain = true }]

# Downloads per build (ov-504): one row per /download/canary redirect, holding
# the build number and nothing about the visitor.
[[env.preview.analytics_engine_datasets]]
binding = "DOWNLOADS"
dataset = "farcooler_downloads_preview"

[env.preview.vars]
APPCAST_URL = "https://updates.farcooler.com/canary/appcast.xml"
# No beacon: these hosts serve no marketing page.
ANALYTICS_TOKEN = ""
APP_RELAY_URL = "https://relay-preview.farcooler.com"
# The preview relay's WORKOS_CLIENT_ID, shared with the apps.
APP_WORKOS_CLIENT_ID = "client_01M03MXE27CHCZJJ0TMY7KCMAH"
MARKETING_ORIGIN = "https://www.farcooler.com"

# VISITOR_SECRET: required, as a secret (`--env preview`); see the top block.
[[env.preview.unsafe.bindings]]
name = "APP_AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[env.canary]
name = "farcooler-site-canary"
routes = [{ pattern = "canary.farcooler.com", custom_domain = true }]

# Downloads per build (ov-504): one row per /download/canary redirect, holding
# the build number and nothing about the visitor.
[[env.canary.analytics_engine_datasets]]
binding = "DOWNLOADS"
dataset = "farcooler_downloads_canary"

[env.canary.vars]
APPCAST_URL = "https://updates.farcooler.com/canary/appcast.xml"
ANALYTICS_TOKEN = ""
APP_RELAY_URL = "https://relay-canary.farcooler.com"
# The canary relay's WORKOS_CLIENT_ID, shared with the apps.
APP_WORKOS_CLIENT_ID = "client_01M03MZKRH5ZPR160DATT149WX"
MARKETING_ORIGIN = "https://www.farcooler.com"

# VISITOR_SECRET: required, as a secret (`--env canary`); see the top block.
[[env.canary.unsafe.bindings]]
name = "APP_AUTH_LIMIT"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 10, period = 60 }
