# One iOS UI run: unpack the products the `ios` job built, boot a simulator and
# run a shard's classes. Three jobs use it: ci.yml's `ios-ui` (the per-push
# smoke set), and nightly.yml's `ios-ui` (a matrix of the shards) and
# `captures`; the steps live here so they cannot drift (ov-534).
#
# The caller checks the repository out first. A local action is read from the
# checkout, which is why that step cannot be in here.
name: iOS UI shard
description: Run one shard of the runnerless iOS UI tests against the products the iOS job built.
inputs:
  shard:
    description: A key of SHARDS in scripts/ios-ui-shards.py, or `smoke` (its SMOKE set) or `captures`, `captures2` or `captures3` (its CAPTURE_SHARDS classes).
    required: true
  capture-out:
    description: A folder for the capture classes' images. Set, it is passed to the tests as TEST_RUNNER_FARCOOLER_CAPTURE_OUT; unset, the tests get no such variable (they skip without it).
    default: ""
# `shell: bash -e {0}` and not `bash`: a composite step must name its shell, and
# plain `bash` adds `pipefail`, which the jobs' default shell does not. With it
# `xcodebuild -version | head -1 | grep -q` aborts with 134 when `grep -q`
# closes the pipe early (run 37538062330, shard phone, 13 s in).
runs:
  using: composite
  steps:
    - name: Check the runner has Xcode 27
      shell: bash -e {0}
      run: |
        xcodebuild -version
        xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
    - name: Download the products the iOS job built
      uses: actions/download-artifact@v4
      with:
        name: ios-ui-products
        path: ${{ runner.temp }}
    - name: Unpack them
      shell: bash -e {0}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ios-dd"
        tar -C "$RUNNER_TEMP/ios-dd" -xf "$RUNNER_TEMP/ios-ui-products.tar"
        runs=("$RUNNER_TEMP"/ios-dd/Products/*.xctestrun)
        [ "${#runs[@]}" -eq 1 ] && [ -f "${runs[0]}" ] || {
          echo "expected one .xctestrun in the iOS job's products, found: ${runs[*]}" >&2; exit 1; }
        echo "XCTESTRUN=${runs[0]}" >> "$GITHUB_ENV"
        echo "Running ${runs[0]}"

    # By UDID, so the destination cannot be ambiguous. `iPhone 17` (or, for the
    # iPad shard, the 11-inch Pro) on ANY installed runtime, newest first: every
    # local timing and every layout-sensitive assertion was measured on it, and
    # an image whose newest runtime carries only an iPhone Duo (iOS 27.1,
    # 466 x 678 pt) still has one on an older runtime (ov-709, ov-710). Only
    # with none does it fall back to the first device of the family on the
    # newest runtime, said out loud. No such device at all is a hard stop with
    # the list printed. The choice is in scripts/ios-ui-pick-simulator.py,
    # which has a self-test.
    - name: Pick a simulator
      shell: bash -e {0}
      env:
        SHARD: ${{ inputs.shard }}
      run: |
        family=$(./scripts/ios-ui-shards.py --device "$SHARD")
        pick=$(xcrun simctl list devices available -j | ./scripts/ios-ui-pick-simulator.py "$family" || true)
        if [ -z "$pick" ]; then
          xcrun simctl list devices available
          echo "No available $family simulator on this runner." >&2
          exit 1
        fi
        read -r udid how name_and_runtime <<< "$pick"
        if [ "$how" = fallback ]; then
          echo "::warning::No exact match for the $family device on any runtime on this runner; using $name_and_runtime. Local timings and layouts were measured on iPhone 17 and iPad Pro 11-inch."
        fi
        echo "Simulator: $name_and_runtime ($udid)"
        echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"

    # Booted, and waited for, in a step of its own, so the first test does
    # not pay for the boot inside its probe's timeout. A first launch after
    # an install has still taken over a minute, which is what each test's
    # `launchDrawn` (180 s for the first frame) is for.
    #
    # Tried and dropped (ov-384): starting the boot here and letting xcodebuild
    # wait for it. It saved nothing. From the first step to the first test took
    # 250 to 444 s (median about 390) against about 380 s waiting, because on a
    # three-core runner xcodebuild's own start-up slows down by what the boot
    # takes (run 37541243561).
    - name: Boot the simulator
      shell: bash -e {0}
      run: |
        xcrun simctl boot "$SIMULATOR_ID"
        xcrun simctl bootstatus "$SIMULATOR_ID" -b
        # The screen, for the log: a test failing on one device and not another
        # is read against its size (pixels; the scale is the device's).
        xcrun simctl io "$SIMULATOR_ID" enumerate 2>/dev/null \
          | awk '/Display class: 0/ {d=1} d && /Default width/ {w=$3} d && /Default height/ {print "Screen: " w " x " $3 " px"; exit}' || true

    # The script, never xcodebuild directly: it fails a run where every test
    # skipped, and one where a test skipped for want of a runner. XCTESTRUN,
    # set above, makes it `test-without-building` against those products.
    - name: Run the runnerless UI tests
      shell: bash -e {0}
      env:
        SHARD: ${{ inputs.shard }}
        CAPTURE_OUT: ${{ inputs.capture-out }}
        # Reruns once, loudly, when the simulator or runner failed and no test
        # did (ov-449); an assertion failure is never retried.
        IOS_UI_RETRY_INFRA: "1"
      run: |
        # Exported only when set: an empty value would still be "set" to the
        # capture classes, which skip unless the variable exists.
        if [ -n "$CAPTURE_OUT" ]; then
          mkdir -p "$CAPTURE_OUT"
          export TEST_RUNNER_FARCOOLER_CAPTURE_OUT="$CAPTURE_OUT"
        fi
        # The class list is split into arguments on purpose.
        # shellcheck disable=SC2046
        SKIP_TESTING="$(./scripts/ios-ui-shards.py --skip)" \
          ./scripts/ios-ui-tests.sh $(./scripts/ios-ui-shards.py "$SHARD")

    # The result bundle, kept for a week when the run is red: its failure
    # screenshots, element trees and the app's crash and hang reports are
    # what a nightly failure is diagnosed from. Without it, nightly
    # 41095427660's four red tests had only their one-line messages, and a
    # cancelled shard (`cancelled()`, at the timeout) left nothing at all.
    - name: Keep the result bundle of a red run
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ios-ui-xcresult-${{ inputs.shard }}
        path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
        retention-days: 7
        if-no-files-found: warn
