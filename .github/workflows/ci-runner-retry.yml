name: Retry CI failures and runner acquisition
# The engine follows the controller for this exact completed attempt.
run-name: Retry CI ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: write
  checks: read
  contents: read
jobs:
  retry:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Share one Linux reservation with the recovery controller.
    concurrency:
      group: ci-runner-retry
      cancel-in-progress: false
      queue: max
    steps:
      # workflow_run checks out the default branch, never the untrusted run's head.
      - uses: actions/checkout@v4
      - run: python3 scripts/ci-runner-retry.py
        env:
          GH_TOKEN: ${{ github.token }}
