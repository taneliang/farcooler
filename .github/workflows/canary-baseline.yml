# The wire Canary now owes compatibility to, as proto/baseline/canary.proto,
# which ci.yml and canary.yml's `wire` job lint every commit against. Canary is
# on the owner's phones and Macs within the hour, so a field renumbered on main
# is a Canary phone and a newer Canary daemon silently decoding the same bytes
# as different things — unless this file is current.
#
# A WORKFLOW OF ITS OWN, run when a Canary run ends, rather than jobs inside
# canary.yml. Canary cancels its run when the next push lands, and that cancels
# every job in it, so recording jobs there were cancelled AFTER the TestFlight
# upload or the Mac app had already shipped. The baseline then lagged what was
# in the field, and a later break against the shipped proto linted clean. A
# job-level concurrency group cannot protect them: the workflow-level cancel
# takes the whole run. This one is not in Canary's run, so nothing cancels it.
#
# EVERY CONCLUSION, not only success: a cancelled or failed run can have
# shipped (the iOS job fails on the upload limit while the Mac one ships).
# scripts/canary-shipped.py reads the run's jobs and steps to decide, and says
# why. The cost is that recording waits for the whole run, not each ship job,
# so canary.yml's `wire` job does not trust the baseline alone: it also checks
# every proto on main since the recorded commit (proto-lint --since-baseline).
#
# NO CONCURRENCY GROUP, deliberately. A group queues one run and cancels any
# older one still pending, which would drop a recording outright. Recorders
# that run together are safe without one: scripts/canary-baseline.sh retries a
# push that loses, never forces, never moves the baseline backwards, and checks
# a late recording of an older commit against the newer baseline instead of
# skipping it, so the order they finish in does not matter.
#
# NO LOOP: the push uses the default GITHUB_TOKEN, which triggers no workflow,
# and canary.yml ignores proto/baseline/ besides.
#
# This file runs as it is on main, whatever the Canary run's commit: GitHub
# takes a workflow_run workflow from the default branch. The commit only
# supplies the proto, which is read as data.
#
# CANARY RUNS AFTER CI (ov-301), so the Canary run is itself a workflow_run run
# and its head_sha is main's head when it started. Which commit it built is in
# its title; canary.yml's run-name puts it there.
name: Canary wire baseline

on:
  workflow_run:
    # Canary's `name:`. proto-lint.py's self-test fails if the two drift apart,
    # since a name that matches nothing simply never runs.
    workflows: [Canary]
    types: [completed]

permissions: {}

jobs:
  record:
    name: Record the wire baseline
    # Main only. Canary can be dispatched from any branch, and that branch's
    # proto is not what main owes compatibility to; scripts/canary-baseline.sh
    # refuses such a commit too.
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # A checkout, one API call and a push: minutes at most, and a hung one
    # should not hold a runner for GitHub's six-hour default.
    timeout-minutes: 10
    # `contents: write` to commit the baseline, `actions: read` to list the
    # Canary run's jobs. Held by this job's shell alone, not by a build.
    permissions:
      contents: write
      actions: read
    steps:
      # Main, where the baseline is committed, with full history so the script
      # can tell how the shipped commit and the recorded one are related.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Every attempt's jobs: a re-run that shipped counts as much as the first.
      - name: Work out what shipped
        id: shipped
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
            --jq '.jobs[]' > "$RUNNER_TEMP/jobs.ndjson"
          scripts/canary-shipped.py "$RUNNER_TEMP/jobs.ndjson"
      # The commit that shipped, from the Canary run's title ("Canary <sha>",
      # its run-name). Not github.sha, which is main's head when this workflow
      # started, and not the Canary run's own head_sha either: Canary is a
      # workflow_run workflow, so that is main's head when IT started. A title
      # that names no commit fails the job rather than record a wrong one.
      - name: Record the shipped proto
        if: steps.shipped.outputs.shipped == 'true'
        env:
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          shipped=$(scripts/canary-shipped.py --commit "$TITLE")
          scripts/canary-baseline.sh "$shipped"
