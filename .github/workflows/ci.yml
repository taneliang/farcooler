# What must be true of every commit.
#
# GitHub Actions, and specifically because this repo is public: public repos get
# unlimited minutes on standard runners, macOS ones included, which is the whole
# question for a project that has to build a Mac app and an iOS app. A private
# repo would burn its monthly allowance on macOS runners in a couple of days
# (they bill at 10× Linux), and that is the point at which CircleCI's open-source
# plan would be worth the move.
#
# Independent jobs cover Rust, Swift, iOS, Android, and the services. Rust
# builds one Linux test archive for four shards; its platform checks and native
# Mac suite run alongside that build.
#
# Android is on Linux, unlike the two Apple jobs: nothing in that build needs a
# Mac, and a macOS runner for it would be ten times the minutes for the same
# result.
#
# iOS UI tests run in three tiers (ov-534): a small smoke set on every push (the
# `ios-ui` job below), the classes a diff touches at a train gate, and the whole
# suite nightly on main (nightly.yml). See the comment above `ios-ui`.
name: CI

on:
  push:
    branches: [main]
    # The canary workflow's own baseline commit touches only this file. Without
    # this, its run supersedes and cancels the CI of the commit it records.
    paths-ignore: ['proto/baseline/canary.proto']
  pull_request:

concurrency:
  # A push that supersedes another cancels it. Nobody needs the results of a
  # commit that is already two commits behind.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Does this push change anything but the website and docs? (ov-507)
  #
  # A push that touches only services/site/, services/web/, services/common/,
  # docs/, a root-level .md or the site-proof files runs none of the app jobs
  # below: Swift, Rust, Android, iOS and the UI shards were 32 minutes of macOS
  # time for the daily site-proof refresh. They `needs:` this job and test its
  # output with `!cancelled()` and `!= 'false'`, so anything else (this job
  # failing, an empty output) runs them, and a skipped job reports as passed,
  # so the run still ends green. The lints in `wire`, the tunnel, the relay,
  # the site and the web jobs always run.
  #
  # Judged against the nearest green CI run on main, not `before`, exactly as
  # `ios-ui-plan` does: a code push whose run was cancelled or went red must
  # not be waved through by a site-only push on top of it. The allowlist, and
  # its self-test (run in `wire`), are in scripts/ci-changes.py.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      app: ${{ steps.changes.outputs.app }}
      rust: ${{ steps.changes.outputs.rust }}
      apple: ${{ steps.changes.outputs.apple }}
      android: ${{ steps.changes.outputs.android }}
      web: ${{ steps.changes.outputs.web }}
      relay: ${{ steps.changes.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Main's successful CI runs, as in `ios-ui-plan`. When gh fails the step
      # records why in CANDIDATES_ERROR and everything runs.
      - name: List the green CI runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | {head_sha, created_at}' > "$RUNNER_TEMP/green.ndjson" 2> "$RUNNER_TEMP/gh.err"; then
            echo "$(wc -l < "$RUNNER_TEMP/green.ndjson") green CI runs listed"
          else
            why="$(head -c 200 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
            echo "CANDIDATES_ERROR=${why:-gh exited non-zero}" >> "$GITHUB_ENV"
          fi
      - name: Decide whether the app jobs run
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AFTER: ${{ github.event.after }}
          CANDIDATES: ${{ runner.temp }}/green.ndjson
        run: ./scripts/ci-changes.py

  # Can a client already in the field still talk to this?
  #
  # Its own job rather than a step inside `rust`, because it answers a different
  # question than "does this compile and pass". An App Store review takes days
  # and a daemon update takes one command, so there is always an app in the
  # field older than the machine it is talking to — and it decodes by tag
  # number, with no way to learn that a meaning changed.
  #
  # Needs no toolchain and no checkout depth: the baseline is a committed file
  # rather than something discovered from git history. See the script for why.
  wire:
    name: Wire compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The lint's own tests first. Before the first release there is no
      # baseline to compare against, so without these every check in it would
      # sit unexercised until exactly the moment it mattered.
      - run: ./scripts/proto-lint.py --self-test
      # preview and stable, which are the two channels promote.yml records a
      # baseline for. These said `beta` and `release` until `2ae5cf3` renamed
      # the channels — names no promotion has ever written, so both runs found
      # no baseline and passed without comparing anything.
      - run: ./scripts/proto-lint.py --channel preview
      - run: ./scripts/proto-lint.py --channel stable
      # And canary, which canary-baseline.yml records when a Canary run ends —
      # the channel on the owner's phones within the hour, where a renumbered
      # field would otherwise reach a phone and a newer daemon unchecked.
      - run: ./scripts/proto-lint.py --channel canary
      # The script that writes that baseline, against a scratch remote: a
      # mistake in it records nothing, and the lint above then passes saying
      # nothing shipped.
      - run: ./scripts/canary-baseline-test.sh
      # How the recorder decides a Canary run shipped, from its jobs' steps,
      # and that the job and step names it keys on are still in canary.yml.
      - run: ./scripts/canary-shipped.py --self-test
      # Whether Canary builds a CI-green commit: its path rule, the range, and
      # the commit it names, against a scratch repository.
      - run: ./scripts/canary-plan.py --self-test
      # The readiness check before strict device-key matching (ov-573): each gate's
      # verdict on canned wrangler answers, and that its only query is a SELECT.
      - run: ./scripts/device-keys-readiness.py --self-test
      # The website's generated proof section: the generator's output for a
      # fixture equals the golden file, and nothing outside its markers moves
      # (ov-499).
      - run: ./scripts/site-proof.py --self-test
      # Which paths let a push skip the app jobs (ov-507): the allowlist against
      # the code paths it must never swallow, and the green-base rule against a
      # scratch repository.
      - run: ./scripts/ci-changes.py --self-test
      - run: python3 scripts/rust-shadow-test.py
      - run: python3 scripts/rust-shards.py --self-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/macos-rust-tests.py --self-test --check
      # Reproduce a gate launched by scripts/heavy: private test queues must
      # still lock even though the parent already holds the machine queue.
      - run: HEAVY_LOCK_HELD=1 ./scripts/lane-gate.py --self-test
      - run: python3 scripts/gate-evidence-test.py
      - run: python3 scripts/engine-gate-test.py
      - run: HEAVY_LOCK_HELD=1 ./scripts/heavy_lock.py --self-test
      - run: ./scripts/notarytool-retry.sh --self-test
      # What version.sh answers decides where a daemon installs — its runtime
      # directory, database, tmux server and binary name — so a wrong channel is
      # not a cosmetic version string.
      - run: ./scripts/version-test.sh
      # The same answer decides which WorkOS project an app signs in against,
      # and there the partition is invisible when it breaks: a preview build
      # holding the stable client id looks entirely correct and is signing
      # people into the stable environment's accounts.
      - run: ./scripts/workos-test.sh
      # Pure Python and needs no Mac, unlike icon-test.sh — which is why that
      # one lives in the `swift` job below and this one lives here instead.
      - run: ./scripts/appcast-test.sh
      # The flake tally reads the log formats CI really prints (ov-697): each
      # parser pinned to the test name it must find in a saved real failure,
      # since a parser that stops matching just finds nothing.
      - run: ./scripts/ci-flake-tally-test.sh
      # The one retry an iOS UI shard gets (ov-449): on a simulator or runner
      # failure only, never on an assertion, and red if the retry fails too.
      - run: ./scripts/ios-ui-retry-test.sh
      # One simulator per run (ov-679): a lease per device, freed when its
      # holder dies, and a wait with a message when none is free.
      - run: ./scripts/ios-ui-lease-test.sh
      # No count in parentheses in the Mac's, the phones' or the shared
      # package's copy (ov-101): its own patterns first, against cases it
      # must catch and cases it must pass, then the tree.
      - run: ./scripts/copy-lint.py --self-test
      # No Swift test makes its own defaults suite (ov-541): `ScratchDefaults`
      # removes the plist at exit, `UserDefaults(suiteName:)` leaves it. No Rust
      # test names `temp_dir()` either (ov-552): `scratch::dir` removes itself.
      - run: ./scripts/test-leak-check.py --lint
      - run: ./scripts/copy-lint.py
      # Feature logic that reads runner data lives in crates/client (R-112, ov-1018):
      # each rule planted and seen red, then the tree against its recorded baseline,
      # so only a new duplicate string, wire-word switch, twin file or growth fails.
      - run: ./scripts/shared-core-lint.py --self-test
      - run: ./scripts/shared-core-lint.py
      # The baseline only shrinks: one that records more than main's is refused,
      # so a pull request cannot make a new violation pass by writing it down.
      - name: Baseline did not grow
        run: |
          # No `--depth`: in a worktree the git dir is shared, and a depth makes every
          # lane's repository shallow (lane-gate refuses a step that does).
          git fetch --no-tags origin main
          ./scripts/shared-core-lint.py --baseline-not-grown FETCH_HEAD
      # The capability names the apps ask a runner for are generated from
      # `farcooler_protocol::capability` (ov-154), and `can` takes the
      # generated type, so a misspelling does not compile. A generated file
      # that is out of date fails here, naming the command that rewrites it.
      - name: Capability names
        run: |
          ./scripts/capability-names.py --self-test
          ./scripts/capability-names.py --check
      # The price script's parser, on a page written in the test (no network).
      # The page itself is checked daily by claude-prices.yml, which no push
      # waits on.
      - run: ./scripts/claude-prices.py --self-test
      # The same for OpenAI's page; the page itself is checked daily by openai-prices.yml.
      - run: ./scripts/openai-prices.py --self-test
      # The DERP-hosts check's parser, on maps written in the test. The live map
      # is checked daily by derp-hosts.yml, which no push waits on.
      - run: ./scripts/derp-hosts-check.py --self-test
      # No source file grows past 1,500 lines (ov-169); the ones already past
      # it are grandfathered in scripts/file-size-budget.txt, each with a
      # ceiling of its size then plus max(2%, 50 lines). The rule against its
      # own cases first, then the tree.
      - name: File size budget
        run: |
          ./scripts/file-size-budget.py --self-test
          ./scripts/file-size-budget.py
      # The plan layer is removable (ov-268): the code that serves the board
      # never names its tables or modules. Its rule against planted
      # references first, then the tree. The drill that drops the tables from
      # a populated database is `plan_tests.rs`, in the Rust job.
      - name: Plan layer references
        run: |
          ./scripts/plan-layer-lint.py --self-test
          ./scripts/plan-layer-lint.py
      # Orchestrator pages are removable too (ov-269): nothing the board or the
      # plan layer runs on names them. Its rule against planted references
      # first, then the tree. The drills that drop the pages' tables from a
      # populated database are `pages_tests.rs` and
      # `pages_over_the_socket.rs`, in the Rust job.
      - name: Page layer references
        run: |
          ./scripts/page-layer-lint.py --self-test
          ./scripts/page-layer-lint.py
      # No new swallowed call to the host (ov-167): a `try?` on core.call or
      # runCLI, or an ignored runCatching/attempt or empty catch in the Android
      # app's Kotlin. Existing ones are listed, each with its reason,
      # in scripts/swallow-lint-allow.txt.
      - run: ./scripts/swallow-lint.py --self-test
      - run: ./scripts/swallow-lint.py
      # No new hand-drawn corner radius, material, glass, rule, stroke, shadow or
      # gray in a Mac or AgentKit view (ov-216): the tokens in DesignTokens.swift
      # draw them. There is no baseline: any site fails.
      - run: ./scripts/visual-tokens-lint.py --self-test
      - run: ./scripts/visual-tokens-lint.py
      # Mac pixel tests hold at 1x (ov-280): CI renders at 1x and every local Mac
      # at 2x, so a hard-coded 2 in a bitmap sample is red only on CI.
      - run: ./scripts/pixel-scale-lint.py --self-test
      - run: ./scripts/pixel-scale-lint.py
      # Mac tests show a window only through TestWindow.show (ov-473): behind
      # every app's windows, in a process that can never come to the front.
      # A test that orders a window front or activates the app fails here.
      - run: ./scripts/test-window-lint.py --self-test
      - run: ./scripts/test-window-lint.py
      # Mac tests never spin a run loop (ov-606): a synchronous main-actor test
      # that does never gives the main actor back, and every other test waits.
      - run: ./scripts/runloop-spin-lint.py --self-test
      - run: ./scripts/runloop-spin-lint.py
      # A Mac capture names its state before the shot (ov-642).
      - run: ./scripts/capture-window-lint.py --self-test
      - run: ./scripts/capture-window-lint.py
      # Mac tests run a stand-in script as `/bin/sh script`, never as a program
      # of its own (ov-566): a file written a moment ago waits on the system's
      # first-run check, which stalls under load (ov-551).
      - run: ./scripts/fresh-script-lint.py --self-test
      - run: ./scripts/fresh-script-lint.py
      # Every Start Orchestrator on the Mac goes through the charter's screens
      # (ov-519): only the start and the screens call startOrchestratorNow.
      - run: ./scripts/charter-intercept-lint.py --self-test
      - run: ./scripts/charter-intercept-lint.py
      # The iOS targets compile a hand-kept subset of AgentKit
      # (apps/ios/generate-project.py). A shared file that names a type from a
      # file the phone or watch doesn't compile builds on the Mac and breaks only
      # there (ov-339; PageLive and OneTreeFilter, Oct 5).
      - run: ./scripts/ios-agentkit-subset-lint.py --self-test
      - run: ./scripts/ios-agentkit-subset-lint.py
      # Two lanes can't both take a migration number or a rate-limit namespace id
      # (ov-553): relay `NNNN_*.sql` run without a gap or a repeat, the store's
      # `migration_NNNN_` labels never repeat or go backwards, and the relay's
      # and the site's `namespace_id`s, which Cloudflare shares account-wide, are
      # unique across both files.
      - run: ./scripts/migration-lint.py --self-test
      - run: ./scripts/migration-lint.py
      # The app decoders are generated from the Rust view models (ov-1035): the CLI is pinned and
      # cached by version (the cargo install is skipped when it is already there), the script
      # rewrites the Swift, Kotlin and TypeScript wire types, and a difference from what is
      # checked in (or a generated file that is not checked in at all) fails the run.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}
      - name: Install typeshare 1.13.4
        run: |
          if [ "$(typeshare --version 2>/dev/null)" != "typeshare 1.13.4" ]; then
            cargo install typeshare-cli --version 1.13.4 --locked
          fi
      - name: The generated wire types are current
        run: |
          ./scripts/gen-wire-types.sh
          git diff --exit-code -- apps/shared/AgentKit/Sources/AgentKit/WireTypes.swift apps/android/app/src/main/java/com/farcooler/core/wire services/web/src/client/generated
          test -z "$(git status --porcelain -- apps/shared/AgentKit/Sources/AgentKit/WireTypes.swift apps/android/app/src/main/java/com/farcooler/core/wire services/web/src/client/generated)"

  # The tunnel itself, which is Go, and which nothing in this workflow ran until
  # now.
  #
  # `crates/tailcat/go` has had a test file since the tunnel landed, and every
  # test in it executed nowhere but the machine that wrote it: the two jobs that
  # install Go do so to BUILD an archive for an app, and neither ever ran `go
  # test`. That covers the identity file's 0600 mode, the region pin that keeps
  # a device's token resolving across a restart, the allowlist that must never
  # be handed to tailcat empty, and the panic recovery that turns a crash into
  # an errno — the guards nearest the part of this product that opens a path to
  # somebody's sshd.
  #
  # Its own job because it needs nothing else: no Rust, no Xcode, no NDK, no
  # tmux. Ubuntu, because none of it is platform-specific and a macOS runner
  # bills at ten times the minutes for the same answer.
  tunnel:
    name: Tunnel (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/tailcat/go
    steps:
      - uses: actions/checkout@v4
      # Pinned by `go-version-file` rather than trusted to the image, the same
      # way the two jobs that build the archive pin it: an image bump that
      # changes Go under this fails with an error that never mentions Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          # The module lives under crates/, and setup-go looks for go.sum at
          # the root by default: without this every run warned "Dependencies
          # file is not found", restored nothing and built the tunnel cold
          # (about a minute in each job that builds it; ov-301).
          cache-dependency-path: crates/tailcat/go/go.sum
      # Unlike the Rust tree, which is hand-formatted and skips `fmt --check`
      # on purpose, this directory is gofmt's. It is one command and it has an
      # answer everybody agrees with.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "gofmt wants: $unformatted"; exit 1; }
      # BOTH cgo settings, and that is not belt-and-braces — it is the only way
      # every file in this package is type-checked by anything.
      #
      # The package has two entry points and they are mutually exclusive by
      # construction: `exports_cgo.go` imports "C", which Go excludes whenever
      # cgo is off, and `main_helper.go` carries `//go:build !cgo`, which Go
      # excludes whenever cgo is on. A runner has a C toolchain, so
      # `CGO_ENABLED` defaults to 1 and `go list` puts `main_helper.go` in
      # `IgnoredGoFiles` — an ignored file is not compiled, not vetted and not
      # tested. That is the file that starts the tunnel helper on Linux, which
      # is how every Linux runner serves a tunnel at all, and until this line it
      # was compiled by nothing in CI.
      #
      # Measured rather than reasoned: dropping an argument from its one call to
      # `runHelper` left `gofmt -l .`, `CGO_ENABLED=1 go vet ./...` and
      # `CGO_ENABLED=1 go test -count=1 ./...` all at exit 0, and
      # `CGO_ENABLED=0 go vet ./...` at exit 1 naming the line. gofmt is the
      # exception that proves the rule — it reads every `.go` file regardless of
      # build tags, so formatting was never the gap; type-checking was.
      #
      # Running only at 0 would swap one hole for the other, since that is the
      # setting that ignores `exports_cgo.go` — the archive the Apple and
      # Android apps link. Neither setting alone covers this package.
      #
      # `-count=1` so a cached result from a previous run is never mistaken for
      # this commit passing.
      - name: Vet and test with cgo, which is what the apps link
        run: |
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=1 go test -count=1 ./...
      # And without it, which is what a Linux runner actually ships: the helper
      # is built `CGO_ENABLED=0` precisely because a Go c-archive inside a musl
      # binary segfaults in Go's runtime startup. This is that build.
      - name: Vet and test without cgo, which is what Linux ships
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...

  rust:
    name: Rust (${{ matrix.os }})
    permissions:
      actions: read
      contents: read
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ matrix.os }}
    # 35, not 25: a slow macOS runner spent 10 min on setup and was cut off while its tests still passed (Oct 13, runs 38427326757 and 38449300370).
    # macOS 60: its runners have run 2-3x slower, the crash-matrix binary alone takes about 6 min, and 35 min cut main off about 4900 of 6665 tests in (ov-992).
    # Ubuntu 45 (ov-1056): the last five green main runs took 24.8-31.1 min (gh run view, Nov 9). The leak-checked nextest step went 11.1 to 14.0 min and clippy 3.2 to 4.2 across them. 45 is 45% over the slowest.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 45 }}
    # Symbols only: optimization and debug assertions keep Cargo defaults.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        # Both, because the daemon runs on both and the differences are real:
        # tmux behaves differently, launchd and systemd are different code paths,
        # and the Linux build is the one that has to work without OpenSSL
        # headers — which is why reqwest uses rustls.
        # Ubuntu by version, not `ubuntu-latest`: the tmux it ships is the one
        # `scripts/ci-install-tmux.sh` expects, and a new image should be a
        # change somebody makes, not one GitHub makes for every lane at once.
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # aarch64 Linux, added alongside the host target rather than in
          # place of it — see the `farcooler-tailcat` check below for why.
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # cargo-nextest runs the tests below (ov-540). `cargo test` ran this
      # workspace's ~90 test binaries one after another, so a binary whose
      # tests mostly sleep left the runner idle; nextest keeps one pool full
      # across all of them. Both the action and the tool are pinned: the action
      # by tag, the tool by `tool: name@version`, which it downloads as a
      # prebuilt binary (no compile). Settings, and the groups of tests that
      # must not run beside each other, are in `.config/nextest.toml`.
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148

      # tmux is not a test double here. The tmux crate drives the real binary,
      # because a fake tmux would agree with whatever this code believed.
      # Bounded, and it has to be. This step hung for an hour on two
      # consecutive runs — `apt-get update` against a mirror that accepts the
      # connection and then stops answering, which has no timeout of its own
      # and no output, so the job reads as "still working" until someone looks
      # at the step list. A run that fails in five minutes can be re-run; one
      # that hangs holds a runner until the six-hour ceiling.
      #
      # And a KNOWN tmux, one per runner (ov-554): see the header of
      # `scripts/ci-install-tmux.sh` for which, why, and how to move one. The
      # Swift job's Mac tests use the same script and the same build.
      - name: Cache the pinned tmux build
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmux
          key: tmux-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-install-tmux.sh') }}
      - name: Install tmux
        timeout-minutes: 10
        run: ./scripts/ci-install-tmux.sh

      # git-lfs, for the two daemon tests that use it
      # (`crates/daemon/tests/lfs_content_under_the_git_sandbox.rs`): one makes
      # the repository the daemon's own LFS filter reads, and one shows that a
      # planted `lfs.extension` does run under git-lfs, which is the control
      # for the test that it runs nothing under the daemon. The daemon itself
      # never runs git-lfs. With `CI` set, a missing git-lfs fails them rather
      # than skipping. Both runner images usually have it; bounded like tmux.
      - name: Install git-lfs
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs version
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${APT_OPTS[@]}" update
            sudo apt-get "${APT_OPTS[@]}" install -y git-lfs
          else
            brew install git-lfs
          fi
          git-lfs version

      # fish, because it is a login shell people have and the one whose quoting
      # differs: inside single quotes it reads `\\` and `\'`, which sh does not.
      # A pane's command is parsed by the login shell, so the daemon's launch
      # tests run every quoting case through fish as well as sh, bash and zsh
      # — and with `CI` set, a missing fish FAILS them rather than skipping
      # its half (`launch_prompt_tests::shells`). Bounded like tmux above.
      # Ubuntu's fish is 3.7 and Homebrew's is 4.x; the launch needs 3.4 or
      # later for `"$(…)"`.
      - name: Install fish
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
              sudo apt-get "${APT_OPTS[@]}" update
              sudo apt-get "${APT_OPTS[@]}" install -y fish
            else
              brew install fish
            fi
          fi
          fish --version

      # `crates/daemon/tests/a_real_sshd_forces_the_scope.rs` stands up a real
      # loopback sshd, and `cargo nextest run --workspace` below runs it. It is the
      # closest thing this repository has to a security guard: sshd, not the
      # daemon, is what makes a `read` device unable to ask for `host_admin`,
      # and only a real sshd can be asked whether that is true.
      #
      # It was `#[ignore]`d for four months behind a reason that named a
      # scheduled lane that did not exist. Nothing ran it. The attribute is gone; this step is the one
      # thing the runner has to supply that is not universal.
      #
      # NOT root, and that was the open question — whether a non-root sshd
      # starts on a GitHub runner. It was tried before this line was written, on
      # macOS 26.6 (OpenSSH 10.3p1) and Ubuntu 26.04 (OpenSSH 10.2p1):
      # `restrict`, `command=` and `environment=` all behave, and OpenSSH skips
      # privilege separation outright when `getuid()` is not 0, which is the
      # only part that would have wanted a privileged runner.
      #
      # `command -v` first for the same reason the tmux step does it: the
      # Ubuntu image ships `openssh-server` already and the macOS one ships
      # sshd with the OS, so this is normally free. The test asserts on
      # `/usr/sbin/sshd` by absolute path — it will not take one off PATH,
      # because a runner is entitled to know which sshd it authenticated
      # against — so that is the path this checks.
      - name: Make sure there is an sshd to test the fence against
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
              sudo apt-get "${APT_OPTS[@]}" update
              sudo apt-get "${APT_OPTS[@]}" install -y openssh-server
            else
              echo "no /usr/sbin/sshd on a macOS runner, which ships one with the OS" >&2
              exit 1
            fi
          fi
          /usr/sbin/sshd -V 2>&1 | head -1

      # No `cargo fmt --check`, deliberately, and it is worth saying why rather
      # than leaving it looking forgotten. This workspace predates any
      # formatter, and default rustfmt wants to reformat sixty files — mostly by
      # expanding onto four lines things that were written on one. Adopting it
      # is a reasonable call to make later; making it as a side effect of adding
      # CI is not. Clippy, which finds real defects rather than disagreeing
      # about widths, runs at -D warnings.
      # All Clippy feature variants run once, on Linux (ov-1182).
      # Mac keeps its native test build, feature tests and target checks.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: runner.os == 'Linux'

      # The line above is `--workspace` at DEFAULT features, and that word is
      # the whole gap these seven lines close: every `tailcat` feature in this
      # workspace is off by default, so the code behind them had never been
      # linted by anything. Not "less often" — never, since the features were
      # added.
      #
      # It was not hypothetical. `cargo clippy -p farcooler-daemon --features
      # tailcat-helper --all-targets` failed with two `await_holding_lock`
      # errors in `tests/a_pairing_gives_the_runner_a_tunnel.rs` — a
      # `std::sync::MutexGuard` held across four `.await`s, which is a deadlock
      # the moment tokio resumes that task on another thread — and `cargo
      # clippy -p farcooler-cli --features tailcat --all-targets` failed with a
      # `dead_code`. Both files are ones CI already BUILDS: the four
      # `cargo nextest run --features tailcat-helper` lines below run that daemon
      # test, and `apps/macos/build-app.sh` ships the CLI at `--features
      # tailcat`. Only the lint was blind.
      #
      # `-p` per crate rather than one `--workspace --features …`: clippy lints
      # only the packages it is asked for, so `-p farcooler-daemon --features
      # tailcat` says nothing about `farcooler-cli` even though it builds it.
      # `--all-targets` because all three findings were in test targets, which
      # is where a feature's `cfg(not(…))` arms live.
      #
      # None of these link, so none of them need a Go toolchain — verified with
      # `go` off PATH, the same standard `cargo check -p farcooler-daemon
      # --features tailcat` below is held to.
      #
      # Six of the seven lint source no other line here reaches: a
      # `cfg(feature = ...)` or `cfg(not(feature = ...))` item that the default
      # build never compiles. `farcooler-jni` is the exception and is kept
      # anyway — it has no feature-gated source of its own TODAY, so today it
      # only re-lints what `--workspace` already did, but `--features tailcat`
      # is what `scripts/build-android-libs.sh` and
      # `scripts/build-ios-frameworks.sh` both ship that crate with, and the
      # first `cfg` anybody writes there would otherwise land unlinted the same
      # way these findings did. Each of the seven was watched to go red on a
      # mutation behind its own feature while `--workspace` above stayed green.
      - run: cargo clippy -p farcooler-tailcat --features helper --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy -p farcooler-tailcat --features linked --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy -p farcooler-daemon --features tailcat-helper --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy -p farcooler-daemon --features tailcat --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy -p farcooler-client --features tailcat --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy -p farcooler-cli --features tailcat --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo clippy -p farcooler-jni --features tailcat --all-targets -- -D warnings
        if: runner.os == 'Linux'

      # The `linked` backend on the target it actually ships on. The clippy
      # line above now type-checks it too, but only for THIS job's host arch;
      # the second invocation here is the one that cannot be dropped, and the
      # first is kept as the plain-`check` baseline the paragraph below is
      # about. `--workspace` reaches neither: it builds every crate at DEFAULT
      # features, and so does `cargo nextest run --workspace` below. `linked` is off
      # by default on purpose (see that crate's `Cargo.toml`) so a checkout
      # with no Go toolchain still builds — but that meant the only backend
      # that will ever run in production, every FFI declaration and every
      # errno mapping in it, was for a long time checked by nothing here at
      # all.
      # `cargo check` doesn't link, so it needs no Go archive; it still
      # catches a type mismatch in the `extern "C"` block, which is exactly
      # what shipped once before this step existed — `c_char` is `u8` on ARM
      # Linux and a hardcoded `i8` compiled cleanly on this job's own host
      # while failing on `aarch64-unknown-linux-musl`, this crate's own
      # release target and the same architecture Android ships on. The
      # second invocation below is the one that catches that: the host arm
      # of this matrix is darwin or x86_64 Linux, neither of which disagrees
      # with `i8`.
      - run: cargo check -p farcooler-tailcat --features linked
      - run: cargo check -p farcooler-tailcat --features linked --target aarch64-unknown-linux-musl

      # The same gap, for the backend Linux actually ships. `helper` is off by
      # default too, so `--workspace` never builds it — and unlike `linked`
      # this one can be TESTED rather than only type-checked, because it links
      # no Go and needs no toolchain at all: it spawns a program, and a test
      # can hand it a shell script.
      #
      # The daemon test is the one that matters and it is named for what it
      # asserts: a runner that admits nobody must start no helper PROCESS, not
      # merely return a refusal. Tailcat reads an empty allowlist as "admit
      # everyone", so that guard is the one this design is most likely to lose,
      # and this is the only place in CI where losing it goes red.
      - run: cargo nextest run --profile ci -p farcooler-tailcat --features helper
      - run: cargo nextest run --profile ci -p farcooler-daemon --features tailcat-helper --test an_empty_allowlist_starts_no_tunnel
      # Revocation's guards live or die by this line. A default `cargo test`
      # links no tunnel, so `serve` refuses every call for any input and "was
      # the tunnel rebuilt" is unobservable -- every assertion in that file
      # would pass vacuously. Under the helper backend the tunnel is a process
      # a fake helper records commands for, which is the only shape in which
      # revoking the LAST tunneled device can be seen to stop a running server.
      - run: cargo nextest run --profile ci -p farcooler-daemon --features tailcat-helper --test revocation_closes_what_it_revoked
      # The pairing's two halves, and they pull opposite ways: a runner with no
      # tunnel must GET one, and a runner that has one must keep serving it
      # rather than have it replaced under every other device. Neither is
      # observable in a default build — `serve` refuses every call for any
      # input there, so "was the running server replaced" has the same answer
      # whatever the code does. Under the helper backend the tunnel is a
      # process, and a fake helper records the commands it was given tagged
      # with its own pid, so two servers are two numbers in a file.
      - run: cargo nextest run --profile ci -p farcooler-daemon --features tailcat-helper --test a_pairing_gives_the_runner_a_tunnel
      # The released devices' sweep (ov-783): K devices revoked in one tunnel
      # rebuild, and a daemon's first tunnel built only after its start sweep.
      # Both are counts of what a fake helper heard, so a default build, which
      # links no tunnel, can't see either.
      - run: cargo nextest run --profile ci -p farcooler-daemon --features tailcat-helper --test a_sweep_rebuilds_the_tunnel_once
      # `FARCOOLER_DERP_MAP` end to end, and it is here for the same reason as
      # the three lines above: a default build's `serve` refuses every call, so
      # nothing is spawned and nothing is told anything, and "did the runner's
      # DERP map reach the thing that serves" would be a vacuous assertion.
      #
      # What it buys that `rendezvous`'s own unit tests cannot: those prove the
      # decision is wired to `set_derp_map_url`, and nothing in this workspace
      # can prove `main` CALLS it — that line is inside `#[tokio::main] async fn
      # main()`, which no test links. This file spawns the real `farcoolerd`
      # with the variable set and reads back what the tunnel helper was told, so
      # deleting the call from `main` turns it red.
      - run: cargo nextest run --profile ci -p farcooler-daemon --features tailcat-helper --test a_configured_derp_map_reaches_the_tunnel

      # The end-to-end tunnel test, type-checked here and RUN nightly.
      #
      # `crates/daemon/tests/a_real_tunnel_carries_the_scope.rs` carries a byte
      # end to end through a real tunnel: a DERP relay on loopback, a real
      # tailcat server and client, a real sshd, and the scope out of a real
      # `authorized_keys`. It needs a Go archive linked into the test binary, a
      # built `derper`, `TS_DEBUG_USE_DERP_HTTP=1` and an Apple silicon host, so
      # `scripts/tunnel-e2e.sh` runs it, and `tunnel-e2e.yml` runs that script
      # nightly on macOS. Not here: it is minutes of cold builds and a dial that
      # waits on timeouts, which would make pushes to main flaky.
      #
      # So this line buys one thing: the file cannot rot between nightlies.
      # `--workspace` above builds default features, which `cfg`s that file away
      # entirely, so a shipped API it calls could be renamed and nothing here
      # would notice. `cargo check` links nothing, so it needs no archive and no
      # Go toolchain, and it goes red on exactly that drift: renaming
      # `allowlist::tunnel_plan` under it gives `error[E0425]: cannot find
      # function` and exit 101.
      #
      # It does NOT prove a tunnel comes up. Only the nightly run does.
      - run: cargo check -p farcooler-daemon --features tailcat --all-targets

      # A `changes` pane runs THIS CHANNEL'S CLI by name — `changes_host_command`
      # asks `shim_binary`, which looks beside the daemon's own executable and
      # otherwise falls back to the bare name for PATH to resolve. Under `cargo
      # test` the "daemon executable" is the test binary in `target/debug/deps`,
      # where no CLI has ever been placed. A harness that sets the test stub
      # switch also looks in `target/debug` (ov-547, `cli_binary`); one that
      # doesn't has only the PATH fallback.
      #
      # A developer machine has one installed, which is why
      # `a_pane_split_with_the_changes_preset_is_a_changes_pane` passes there and
      # nowhere else. A runner has none, the pane's command cannot start, and
      # `remain-on-exit` leaves a dead rectangle the test correctly calls Exited.
      #
      # Named for the channel because that is what `shim_binary` asks for, and a
      # clean untagged checkout is `local`. The other names are linked too, so
      # this does not quietly stop working the day CI builds a different one.
      - name: Put this channel's CLI where the daemon tests look for it
        run: |
          set -euo pipefail
          cargo build --workspace --bins
          for name in farcooler-local farcooler-preview farcooler-canary; do
            ln -sf "$PWD/target/debug/farcooler" "$PWD/target/debug/$name"
          done
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      # Wrapped so a test that leaves its tmux server running fails the job
      # (ov-207): one such server once ran for 15.5 hours at 92% CPU. And so a
      # test that leaves a file in TMPDIR does (ov-541): 685,000 of them
      # piled up on the owner's Mac.
      - run: ./scripts/tmux-leak-check.py --self-test
      - run: ./scripts/tmux-stale-sockets.py --self-test
      - run: ./scripts/test-leak-check.py --self-test
      # nextest again (ov-559). The two live_tmux layout tests that sent this
      # back to `cargo test` failed on tmux 3.8, not on nextest: 3.8 writes
      # layouts as JSON, which `farcooler_tmux::layout` now reads. Under
      # `cargo test` they had never run on 3.8, because an earlier binary had
      # already failed and `cargo test` stops at the first.
      # Linux default-feature tests run from one archive in rust-tests below.
      # nextest does not run doctests, so this is the only thing that would.
      # There are none today (checked: every `Doc-tests` target reports zero),
      # and the step costs a few seconds of empty rustdoc runs; it is here so
      # the first doctest anybody writes is run rather than silently skipped.
      - run: cargo test --workspace --doc

  # Compile the default workspace once, independently of lint/feature checks.

  rust-build:
    name: Rust test archive
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Symbols only: optimization and debug assertions keep Cargo defaults.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-test-archive
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Build the runtime binaries and test archive
        run: |
          cargo build --locked --workspace --bins
          cargo nextest archive --locked --profile ci --workspace --archive-file target/rust-tests.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: rust-tests
          overwrite: true
          path: target/rust-tests.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  rust-tests:
    name: Rust tests (${{ matrix.shard }}/4)
    needs: [changes, rust-build]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.rust-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      FARCOOLER_TEST_SHELL: /bin/sh
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@v4
        with:
          name: rust-tests
          path: target
      - name: Cache the pinned tmux build
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmux
          key: tmux-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-install-tmux.sh') }}
      - name: Install tmux
        timeout-minutes: 10
        run: ./scripts/ci-install-tmux.sh

      - name: Install git-lfs
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs version
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${APT_OPTS[@]}" update
            sudo apt-get "${APT_OPTS[@]}" install -y git-lfs
          else
            brew install git-lfs
          fi
          git-lfs version

      - name: Install fish
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
              sudo apt-get "${APT_OPTS[@]}" update
              sudo apt-get "${APT_OPTS[@]}" install -y fish
            else
              brew install fish
            fi
          fi
          fish --version

      - name: Make sure there is an sshd to test the fence against
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
              sudo apt-get "${APT_OPTS[@]}" update
              sudo apt-get "${APT_OPTS[@]}" install -y openssh-server
            else
              echo "no /usr/sbin/sshd on a macOS runner, which ships one with the OS" >&2
              exit 1
            fi
          fi
          /usr/sbin/sshd -V 2>&1 | head -1

      - name: Extract archive and prove partition coverage
        run: |
          python3 scripts/rust-shards.py --archive target/rust-tests.tar.zst --out target/shard-inventories
          for name in farcooler-local farcooler-preview farcooler-canary; do
            ln -sf "$PWD/target/debug/farcooler" "$PWD/target/debug/$name"
          done
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Full Rust workspace shard
        run: ./scripts/test-leak-check.py -- ./scripts/tmux-leak-check.py -- cargo nextest run --profile ci --no-fail-fast --archive-file target/rust-tests.tar.zst --extract-to . --extract-overwrite --workspace-remap "$PWD" --partition hash:${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-inventory-${{ matrix.shard }}
          overwrite: true
          path: target/shard-inventories

  # Native suite and feature/lint checks overlap on independent Mac runners.
  rust-macos-tests:
    name: Rust native tests (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    # Symbols only: optimization and debug assertions keep Cargo defaults.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-latest
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Cache the pinned tmux build
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmux
          key: tmux-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-install-tmux.sh') }}
      - name: Install tmux
        timeout-minutes: 10
        run: ./scripts/ci-install-tmux.sh

      - name: Install git-lfs
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs version
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${APT_OPTS[@]}" update
            sudo apt-get "${APT_OPTS[@]}" install -y git-lfs
          else
            brew install git-lfs
          fi
          git-lfs version

      - name: Install fish
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
              sudo apt-get "${APT_OPTS[@]}" update
              sudo apt-get "${APT_OPTS[@]}" install -y fish
            else
              brew install fish
            fi
          fi
          fish --version

      - name: Make sure there is an sshd to test the fence against
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
              sudo apt-get "${APT_OPTS[@]}" update
              sudo apt-get "${APT_OPTS[@]}" install -y openssh-server
            else
              echo "no /usr/sbin/sshd on a macOS runner, which ships one with the OS" >&2
              exit 1
            fi
          fi
          /usr/sbin/sshd -V 2>&1 | head -1

      - name: Put this channel's CLI where the daemon tests look for it
        run: |
          set -euo pipefail
          cargo build --workspace --bins
          for name in farcooler-local farcooler-preview farcooler-canary; do
            ln -sf "$PWD/target/debug/farcooler" "$PWD/target/debug/$name"
          done
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Python for macOS coverage guard
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: macOS native Rust tests
        if: runner.os == 'macOS'
        run: |
          # --workspace compiles ALL test binaries before nextest filters tests.
          # Keep this explicit so a future change to nextest cannot narrow builds.
          cargo nextest run --profile ci --workspace --no-run
          selection="$(python3 scripts/macos-rust-tests.py)"
          ./scripts/test-leak-check.py -- ./scripts/tmux-leak-check.py -- cargo nextest run --profile ci --workspace --no-fail-fast -E "$selection"

  # TWO JOBS, NOT ONE (ov-301). This was one job, "Swift (shared + macOS)", 27 minutes
  # at the median: the bundle build and its checks (about 13) and then the AgentKit
  # and Mac tests (about 13), one after the other. They share nothing but the
  # checkout, so they are `swift` and `swift-tests`, which start together and
  # each hold one macOS runner for about half the time. Every step runs exactly
  # once, in one of the two; the other jobs `needs:` neither.
  #
  # This one: build the whole bundle, then everything that inspects it.
  swift:
    name: Swift (app build + bundle checks)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    # Xcode 27 on macOS 27. `macos-latest` is still macOS 26 with Xcode 26.6;
    # Xcode 27 is only on this label, which GitHub calls a public preview.
    # To go back, put `macos-latest` here again and drop the check step.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check the runner has Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - uses: actions/checkout@v4
        with:
          # The build number is `git rev-list --count HEAD`, and the default
          # depth-1 checkout would make it 1 — silently, since the command
          # succeeds. scripts/version.sh now refuses a shallow clone outright,
          # so without this the bundle step fails rather than lying.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            apps/macos/.build/artifacts
            apps/macos/.build/checkouts
            apps/macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          # The module lives under crates/, and setup-go looks for go.sum at
          # the root by default: without this every run warned "Dependencies
          # file is not found", restored nothing and built the tunnel cold
          # (about a minute in each job that builds it; ov-301).
          cache-dependency-path: crates/tailcat/go/go.sum

      - name: Resolve this channel's app name
        run: |
          set -euo pipefail
          name="$(scripts/version.sh app-name)"
          [ -n "$name" ] || { echo "version.sh app-name returned nothing; refusing to continue"; exit 1; }
          echo "APP_NAME=$name" >> "$GITHUB_ENV"

      - name: Build Far Cooler.app
        run: apps/macos/build-app.sh

      - name: Check the bundled daemon has the tunnel linked
        run: scripts/tunnel-smoke.sh "apps/macos/build/$APP_NAME.app/Contents/Resources/farcoolerd"

      - name: Check the bundled CLI has the tunnel linked
        run: |
          set -euo pipefail
          out="$("apps/macos/build/$APP_NAME.app/Contents/Resources/farcooler" runner mint-node-key)"
          echo "$out" | grep -q '"public_key"' || {
            echo "the bundled CLI minted no key: $(echo "$out" | grep -o '"error":"[a-z_]*"')"
            exit 1
          }

      - name: Check the bundle is stamped with this commit's version
        run: |
          app="apps/macos/build/$APP_NAME.app"
          expected="$(scripts/version.sh)"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist")"
          [ "$expected" = "$actual" ] || {
            echo "bundle says $actual, the workspace says $expected"; exit 1; }

      - name: Check the CLI and daemon agree
        run: |
          app="apps/macos/build/$APP_NAME.app"
          resources="$app/Contents/Resources"
          cli="$("$resources/farcooler" --version | awk '{print $2}')"
          daemon="$("$resources/farcoolerd" --version | awk '{print $2}')"
          echo "cli $cli / daemon $daemon"
          [ "$cli" = "$daemon" ] || {
            echo "the bundled pair disagree — they must be built together"; exit 1; }
          case "$cli" in
            "$(scripts/version.sh)"+*) ;;
            *) echo "neither matches the workspace version $(scripts/version.sh)"; exit 1 ;;
          esac

      - run: ./scripts/icon-test.sh

      - run: ./scripts/sparkle-key-test.sh
      - run: ./scripts/gh-download-test.sh

      - run: ./scripts/macos-entitlements-test.sh "apps/macos/build/$APP_NAME.app"

  # The AgentKit and Mac tests, beside `swift` (see the note above it). The Mac
  # tests need only the Rust cores, which `apps/macos/test.sh` builds for itself,
  # so nothing here waits for the bundle.
  swift-tests:
    name: Swift (AgentKit + Mac tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    # Xcode 27 on macOS 27. `macos-latest` is still macOS 26 with Xcode 26.6;
    # Xcode 27 is only on this label, which GitHub calls a public preview.
    # To go back, put `macos-latest` here again and drop the check step.
    runs-on: xcode-27
    # 45: measured 32.7 min (green run 42613759545) and 34.9 min (run
    # 42662865971, cancelled at 35 two seconds after all 1970 Mac tests passed;
    # ov-1052). 45 leaves at least 25% over the slower of the two.
    timeout-minutes: 45
    steps:
      - name: Check the runner has Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - uses: actions/checkout@v4
        with:
          # Whole history, as `swift` has it. Nothing in this job asks
          # `version.sh` for the build number, so this is only for parity.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            apps/macos/.build/artifacts
            apps/macos/.build/checkouts
            apps/macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/Package.resolved') }}

      - run: ./scripts/macos-test-wrapper-test.sh
      - run: ./scripts/wait-for-unlock-test.sh
      - run: ./scripts/swift-test-guard-test.sh
      - run: ./scripts/macos-test-partitions.py --self-test
      - run: ./scripts/test-leak-check.py --self-test
      - run: ./scripts/mac-capture-stop-test.sh
      - run: ./scripts/capture-duplicates-test.sh

      - name: Build the Rust client library for AgentKit's tests
        run: cargo build --release -p farcooler-vt -p farcooler-client
      - name: Test AgentKit
        # Under the same early-exit guard as the Mac's tests (ov-324); a change
        # that adds tests raises the floor in apps/shared/AgentKit/test-floor.txt.
        run: ./scripts/swift-test-guard.sh apps/shared/AgentKit/test-floor.txt -- ./scripts/test-leak-check.py -- swift test --package-path apps/shared/AgentKit

      - name: Cache the pinned tmux build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmux
          key: tmux-swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-install-tmux.sh') }}
      - name: Install tmux
        timeout-minutes: 10
        run: ./scripts/ci-install-tmux.sh
      - name: Test the Mac app
        run: ./apps/macos/test.sh

  ios:
    name: iOS
    # The plan says whether the UI shards will want this job's products. Not
    # `success()`: a misplaced UI test class fails the plan, and that must not
    # also stop the app from being built and checked here.
    needs: [changes, ios-ui-plan]
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    # Xcode 27 on macOS 27. `macos-latest` is still macOS 26 with Xcode 26.6;
    # Xcode 27 is only on this label, which GitHub calls a public preview.
    # To go back, put `macos-latest` here again and drop the check step.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ios-ui-build
        with:
          package: ${{ needs.ios-ui-plan.outputs.run }}

      - run: ./scripts/import-ios-certificate-test.sh

      - run: ./scripts/generator-test.sh


  # Whether `ios-ui` runs, and that its class lists are complete.
  #
  # On Linux and in seconds, so a push or PR that touches nothing the iOS app is
  # built from does not hold an `xcode-27` runner (the pool canary and release
  # draw on too) for the smoke set.
  # The paths are what the app compiles (apps/ios, AgentKit under
  # apps/shared), the crates the xcframeworks link (farcooler-client and its
  # path dependencies core, fence, protocol, tailcat and transport, plus
  # farcooler-vt, per `cargo metadata`), the .proto protocol compiles, the
  # shared fixtures, and this job's own scripts and workflow.
  #
  # PUSHES TO MAIN FILTER TOO, comparing the push with the nearest ancestor whose
  # CI run on main was green, not with its own `before`: this workflow cancels a
  # run when the next push lands, so an iOS change whose run was cancelled (or
  # went red) must still be tested by the next green-bound run. With no green
  # ancestor in the history, or a range that cannot be computed, the smoke set
  # still runs (scripts/ios-ui-plan.py). What is lost: nothing the nightly run
  # does not catch. The full suite runs there on whatever is on main, whatever
  # the paths say (ov-534).
  #
  # `ios-ui-shards.py --check` runs whatever the paths say: a UI test class
  # placed in no shard and not in its LOCAL or CAPTURES list fails here, which is
  # how a class added beside another in one file cannot quietly go unrun, and it
  # holds this file and nightly.yml to the shape the tiers need.
  ios-ui-plan:
    name: iOS UI plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every UI test class is placed
        run: ./scripts/ios-ui-shards.py --check
      - run: ./scripts/ios-ui-shards.py --self-test
      - run: ./scripts/ios-ui-pick-simulator.py --self-test
      - name: List the green CI runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | {head_sha, created_at}' > "$RUNNER_TEMP/green.ndjson" 2> "$RUNNER_TEMP/gh.err"; then
            echo "$(wc -l < "$RUNNER_TEMP/green.ndjson") green CI runs listed"
          else
            why="$(head -c 200 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
            echo "CANDIDATES_ERROR=${why:-gh exited non-zero}" >> "$GITHUB_ENV"
          fi
      - name: Decide whether the UI tests run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AFTER: ${{ github.event.after }}
          CANDIDATES: ${{ runner.temp }}/green.ndjson
        run: ./scripts/ios-ui-plan.py
      - run: ./scripts/ios-ui-plan.py --self-test

  # The smoke set: the one iOS UI job a push runs (ov-534, owner, Oct 14).
  #
  # THREE TIERS. A push to main and a pull request run unit and integration
  # tests everywhere (Rust, AgentKit, Mac, Android, wire, lints) and this one
  # job, the SMOKE list in scripts/ios-ui-shards.py: nine tests across launch,
  # the workspace screen, the composer, the Plan and Needs You, 184 s of tests
  # by their seconds in main run 38563769221, so about 7.3 to 10.6 minutes as a
  # job once the 252 to 452 s of download, boot and first launch are added. The
  # train gate adds the UI classes a diff touches. The full suite, all five
  # shards, and the capture classes run nightly (nightly.yml) against whatever
  # is on main then, because things land on main at every hour and there is no
  # last train to hang it on. A red night files a GitHub issue naming the
  # classes and the commits since the last green night.
  #
  # It used to be five shards (25 to 34 minutes each, 271 app-launching test
  # methods in 40 classes) on every push. Each launches the app on an in-app
  # harness (`-phone-harness` and the like) and needs a simulator and nothing
  # else; a live-runner test that slipped in would skip with "NO LIVE RUNNER:",
  # and scripts/ios-ui-tests.sh turns that red.
  #
  # `!cancelled()` and not the implied `success()`: a red `ios` job that
  # still uploaded its products (one of its script tests failed after the build)
  # leaves this job to run, and a build that produced nothing makes it fail on
  # the download, saying so, rather than skip.
  ios-ui:
    name: iOS UI (smoke)
    needs: [changes, ios-ui-plan, ios]
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' && needs.ios-ui-plan.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-ui-shard
        with:
          shard: smoke

  android:
    name: Android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    # 40 (ov-1056): train 385 was cancelled at 25 after green runs of 16.6-24.3 min (last five on main, gh run view, Nov 9). Across them the Rust build for the phone went 1.7 to 2.8 min, Test 1.8 to 2.3, the release APK 2.4 to 3.8, and the Robolectric UI tests 9.1 to 12.8. 40 is 65% over the slowest.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # `versionCode` is `git rev-list --count HEAD` through
          # scripts/version.sh, which refuses a shallow clone outright rather
          # than silently emitting 1 — so without this the Gradle configure step
          # fails instead of stamping a build number that would go backwards.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;29.0.14206865' 'platforms;android-37.1' 'build-tools;37.0.0'

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          # The module lives under crates/, and setup-go looks for go.sum at
          # the root by default: without this every run warned "Dependencies
          # file is not found", restored nothing and built the tunnel cold
          # (about a minute in each job that builds it; ov-301).
          cache-dependency-path: crates/tailcat/go/go.sum

      - name: Build the Rust core and the tunnel for Android
        run: ./scripts/build-android-libs.sh

      - name: Build the Rust core for the host
        run: cargo build -p farcooler-jni

      - name: Test
        working-directory: apps/android
        run: ./gradlew testInstrumentedUnitTest "-Pfarcooler.nativeLibDir=$GITHUB_WORKSPACE/target/debug"

      - name: Build, including the instrumented test bundle
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleAndroidTest


      - name: Build the release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease

      - uses: actions/setup-java@v4
        id: jdk21
        with:
          distribution: temurin
          java-version: 21
      - name: UI tests (Robolectric)
        working-directory: apps/android
        env:
          CAPTURE_JDK: ${{ steps.jdk21.outputs.path }}
        run: |
          ./gradlew testInstrumentedUnitTest \
            -Pfarcooler.captures \
            "-Pfarcooler.captureJdk=$CAPTURE_JDK" \
            "-Pfarcooler.nativeLibDir=$GITHUB_WORKSPACE/target/debug" \
            --max-workers=2
      - name: Count the UI tests that ran
        if: success() || failure()
        working-directory: apps/android/app/build/test-results/testInstrumentedUnitTest
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          classes = []
          for f in sorted(glob.glob("TEST-com.farcooler.capture.*.xml")):
              r = ET.parse(f).getroot()
              n = int(r.get("tests"))
              total += n
              failed += int(r.get("failures")) + int(r.get("errors"))
              skipped += int(r.get("skipped"))
              classes.append(r.get("name").rsplit(".", 1)[-1])
              print(f"{r.get('name')}: {n} tests")
          print(f"UI tests that ran: {total} in {len(classes)} classes, {failed} failed, {skipped} skipped")
          # AppearanceViewTest holds the Appearance setting's effect (ov-690).
          required = ("NativeAgentViewTest", "AppearanceViewTest")
          if total == 0 or any(c not in classes for c in required):
              raise SystemExit("The capture/UI tests did not run; " + " and ".join(required) + " must.")
          PY

  relay:
    name: Relay
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relay != 'false' }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/relay-build

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/site-build
      - run: npx wrangler deploy --dry-run --env canary --outdir /tmp/site-build-canary
      - run: npx wrangler deploy --dry-run --env preview --outdir /tmp/site-build-preview

  # The web client (services/web and the wasm it serves, ov-764): its tests,
  # both channels' real bundles with the size gate on each, and the shell in
  # headless Chromium under its production CSP, on every push. Deploying is
  # web.yml's.
  web:
    name: Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/web
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      BINARYEN_VERSION: version_133
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh asks scripts/version.sh which channel the tree stamps,
          # and that reads tags and the commit count.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The repo's own workspace too, for the client core's wasm32 check
          # below: one crate tree, built for one target.
          workspaces: |
            crates/web
            .
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          cache-dependency-path: crates/tailcat/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Cache wasm-bindgen and wasm-opt
        id: wasm-tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wasm-tools
          key: wasm-tools-${{ env.WASM_BINDGEN_VERSION }}-${{ env.BINARYEN_VERSION }}-${{ env.WASM_BINDGEN_SHA256 }}-${{ env.BINARYEN_SHA256 }}
      - name: Install wasm-bindgen and wasm-opt
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The cache holds the tarballs, re-hashed against the pins on every
          # run, hit or miss, so a poisoned cache entry cannot supply a tool.
          mkdir -p wasm-tools
          if ! echo "$WASM_BINDGEN_SHA256  wasm-tools/wb.tgz" | shasum -a 256 -c - 2>/dev/null; then
            "$GITHUB_WORKSPACE/scripts/gh-download.sh" wasm-bindgen/wasm-bindgen "$WASM_BINDGEN_VERSION" "wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" wasm-tools/wb.tgz "$WASM_BINDGEN_SHA256"
          fi
          if ! echo "$BINARYEN_SHA256  wasm-tools/bn.tgz" | shasum -a 256 -c - 2>/dev/null; then
            "$GITHUB_WORKSPACE/scripts/gh-download.sh" WebAssembly/binaryen "$BINARYEN_VERSION" "binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz" wasm-tools/bn.tgz "$BINARYEN_SHA256"
          fi
          tar xzf wasm-tools/wb.tgz -C wasm-tools
          tar xzf wasm-tools/bn.tgz -C wasm-tools
      - name: Point the build at the wasm tools
        run: |
          echo "WASM_BINDGEN=$RUNNER_TEMP/wasm-tools/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$RUNNER_TEMP/wasm-tools/binaryen-$BINARYEN_VERSION/bin/wasm-opt" >> "$GITHUB_ENV"
      - run: cargo check --locked -p farcooler-client --no-default-features --features web --target wasm32-unknown-unknown
        working-directory: .
      - run: ./scripts/web-client-tree-check.py --self-test
        working-directory: .
      - run: ./scripts/web-client-tree-check.py
        working-directory: .
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run test:workflow
      - name: Make sure there is an sshd for the passkey login
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y openssh-server
          fi
          /usr/sbin/sshd -V 2>&1 | head -1
      - run: cargo test --locked --manifest-path ../../crates/web/Cargo.toml
      - run: GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" .
        working-directory: crates/tailcat/go
      - run: node scripts/size-gate.mjs --self-test
      - run: ../../crates/web/build.sh --channel stable --out "$RUNNER_TEMP/wasm-stable"
      - run: npx tsc --noEmit -p tsconfig.client.json
      - run: WEB_WASM_DIR="$RUNNER_TEMP/wasm-stable" ./build.sh --channel stable --build "$GITHUB_SHA"
      - run: node scripts/size-gate.mjs dist
      - run: npx wrangler deploy --dry-run --outdir /tmp/web-build
      - run: ../../crates/web/build.sh --channel canary --out "$RUNNER_TEMP/wasm-canary"
      - run: WEB_WASM_DIR="$RUNNER_TEMP/wasm-canary" ./build.sh --channel canary --build "$GITHUB_SHA"
      - run: node scripts/size-gate.mjs dist
      - run: npx wrangler deploy --dry-run --env canary --outdir /tmp/web-build-canary
      - run: cargo build --locked --manifest-path ../../crates/web/Cargo.toml --example fake_daemon
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: node test/browser/plan-render-check.mjs
      - run: node test/browser/csp-check.mjs --fake-daemon ../../crates/web/target/debug/examples/fake_daemon --tunnel-delay 100
      - run: node test/browser/sleep-check.mjs --fake-daemon ../../crates/web/target/debug/examples/fake_daemon --engines chromium
