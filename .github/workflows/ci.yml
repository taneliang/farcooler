# What must be true of every commit.
#
# GitHub Actions, and specifically because this repo is public: public repos get
# unlimited minutes on standard runners, macOS ones included, which is the whole
# question for a project that has to build a Mac app and an iOS app. A private
# repo would burn its monthly allowance on macOS runners in a couple of days
# (they bill at 10× Linux), and that is the point at which CircleCI's open-source
# plan would be worth the move.
#
# Five jobs because there are five things that can independently break: the Rust
# workspace, the Swift that both Apple apps share, the iOS app, the Android app,
# and the relay. They run in parallel; none depends on another's artefacts.
#
# Android is on Linux, unlike the two Apple jobs: nothing in that build needs a
# Mac, and a macOS runner for it would be ten times the minutes for the same
# result.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A push that supersedes another cancels it. Nobody needs the results of a
  # commit that is already two commits behind.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Can a client already in the field still talk to this?
  #
  # Its own job rather than a step inside `rust`, because it answers a different
  # question than "does this compile and pass". An App Store review takes days
  # and a daemon update takes one command, so there is always an app in the
  # field older than the machine it is talking to — and it decodes by tag
  # number, with no way to learn that a meaning changed.
  #
  # Needs no toolchain and no checkout depth: the baseline is a committed file
  # rather than something discovered from git history. See the script for why.
  wire:
    name: Wire compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The lint's own tests first. Before the first release there is no
      # baseline to compare against, so without these every check in it would
      # sit unexercised until exactly the moment it mattered.
      - run: ./scripts/proto-lint.py --self-test
      # preview and stable, which are the two channels promote.yml records a
      # baseline for. These said `beta` and `release` until `2ae5cf3` renamed
      # the channels — names no promotion has ever written, so both runs found
      # no baseline and passed without comparing anything.
      - run: ./scripts/proto-lint.py --channel preview
      - run: ./scripts/proto-lint.py --channel stable
      # And canary, which canary-baseline.yml records when a Canary run ends —
      # the channel on the owner's phones within the hour, where a renumbered
      # field would otherwise reach a phone and a newer daemon unchecked.
      - run: ./scripts/proto-lint.py --channel canary
      # The script that writes that baseline, against a scratch remote: a
      # mistake in it records nothing, and the lint above then passes saying
      # nothing shipped.
      - run: ./scripts/canary-baseline-test.sh
      # How the recorder decides a Canary run shipped, from its jobs' steps,
      # and that the job and step names it keys on are still in canary.yml.
      - run: ./scripts/canary-shipped.py --self-test
      # Whether Canary builds a CI-green commit: its path rule, the range, and
      # the commit it names, against a scratch repository.
      - run: ./scripts/canary-plan.py --self-test
      - run: ./scripts/notarytool-retry.sh --self-test
      # What version.sh answers decides where a daemon installs — its runtime
      # directory, database, tmux server and binary name — so a wrong channel is
      # not a cosmetic version string.
      - run: ./scripts/version-test.sh
      # The same answer decides which WorkOS project an app signs in against,
      # and there the partition is invisible when it breaks: a preview build
      # holding the stable client id looks entirely correct and is signing
      # people into the stable environment's accounts.
      - run: ./scripts/workos-test.sh
      # Pure Python and needs no Mac, unlike icon-test.sh — which is why that
      # one lives in the `swift` job below and this one lives here instead.
      - run: ./scripts/appcast-test.sh
      # The one retry an iOS UI shard gets (ov-449): on a simulator or runner
      # failure only, never on an assertion, and red if the retry fails too.
      - run: ./scripts/ios-ui-retry-test.sh
      # No count in parentheses in the Mac's, the phones' or the shared
      # package's copy (ov-101): its own patterns first, against cases it
      # must catch and cases it must pass, then the tree.
      - run: ./scripts/copy-lint.py --self-test
      - run: ./scripts/copy-lint.py
      # The capability names the apps ask a runner for are generated from
      # `farcooler_protocol::capability` (ov-154), and `can` takes the
      # generated type, so a misspelling does not compile. A generated file
      # that is out of date fails here, naming the command that rewrites it.
      - name: Capability names
        run: |
          ./scripts/capability-names.py --self-test
          ./scripts/capability-names.py --check
      # No source file grows past 1,500 lines (ov-169); the ones already past
      # it are grandfathered in scripts/file-size-budget.txt, each with a
      # ceiling of its size then plus max(2%, 50 lines). The rule against its
      # own cases first, then the tree.
      - name: File size budget
        run: |
          ./scripts/file-size-budget.py --self-test
          ./scripts/file-size-budget.py
      # The plan layer is removable (ov-268): the code that serves the board
      # never names its tables or modules. Its rule against planted
      # references first, then the tree. The drill that drops the tables from
      # a populated database is `plan_tests.rs`, in the Rust job.
      - name: Plan layer references
        run: |
          ./scripts/plan-layer-lint.py --self-test
          ./scripts/plan-layer-lint.py
      # Orchestrator pages are removable too (ov-269): nothing the board or the
      # plan layer runs on names them. Its rule against planted references
      # first, then the tree. The drills that drop the pages' tables from a
      # populated database are `pages_tests.rs` and
      # `pages_over_the_socket.rs`, in the Rust job.
      - name: Page layer references
        run: |
          ./scripts/page-layer-lint.py --self-test
          ./scripts/page-layer-lint.py
      # No new swallowed call to the host (ov-167): a `try?` on core.call or
      # runCLI, or an ignored runCatching/attempt or empty catch in the Android
      # app's Kotlin. Existing ones are listed, each with its reason,
      # in scripts/swallow-lint-allow.txt.
      - run: ./scripts/swallow-lint.py --self-test
      - run: ./scripts/swallow-lint.py
      # No new hand-drawn corner radius, material, glass, rule, stroke, shadow or
      # gray in a Mac or AgentKit view (ov-216): the tokens in DesignTokens.swift
      # draw them. There is no baseline: any site fails.
      - run: ./scripts/visual-tokens-lint.py --self-test
      - run: ./scripts/visual-tokens-lint.py
      # Mac pixel tests hold at 1x (ov-280): CI renders at 1x and every local Mac
      # at 2x, so a hard-coded 2 in a bitmap sample is red only on CI.
      - run: ./scripts/pixel-scale-lint.py --self-test
      - run: ./scripts/pixel-scale-lint.py
      # The iOS targets compile a hand-kept subset of AgentKit
      # (apps/ios/generate-project.py). A shared file that names a type from a
      # file the phone or watch doesn't compile builds on the Mac and breaks only
      # there (ov-339; PageLive and OneTreeFilter, Oct 5).
      - run: ./scripts/ios-agentkit-subset-lint.py --self-test
      - run: ./scripts/ios-agentkit-subset-lint.py

  # The tunnel itself, which is Go, and which nothing in this workflow ran until
  # now.
  #
  # `crates/tailcat/go` has had a test file since the tunnel landed, and every
  # test in it executed nowhere but the machine that wrote it: the two jobs that
  # install Go do so to BUILD an archive for an app, and neither ever ran `go
  # test`. That covers the identity file's 0600 mode, the region pin that keeps
  # a device's token resolving across a restart, the allowlist that must never
  # be handed to tailcat empty, and the panic recovery that turns a crash into
  # an errno — the guards nearest the part of this product that opens a path to
  # somebody's sshd.
  #
  # Its own job because it needs nothing else: no Rust, no Xcode, no NDK, no
  # tmux. Ubuntu, because none of it is platform-specific and a macOS runner
  # bills at ten times the minutes for the same answer.
  tunnel:
    name: Tunnel (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/tailcat/go
    steps:
      - uses: actions/checkout@v4
      # Pinned by `go-version-file` rather than trusted to the image, the same
      # way the two jobs that build the archive pin it: an image bump that
      # changes Go under this fails with an error that never mentions Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          # The module lives under crates/, and setup-go looks for go.sum at
          # the root by default: without this every run warned "Dependencies
          # file is not found", restored nothing and built the tunnel cold
          # (about a minute in each job that builds it; ov-301).
          cache-dependency-path: crates/tailcat/go/go.sum
      # Unlike the Rust tree, which is hand-formatted and skips `fmt --check`
      # on purpose, this directory is gofmt's. It is one command and it has an
      # answer everybody agrees with.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "gofmt wants: $unformatted"; exit 1; }
      # BOTH cgo settings, and that is not belt-and-braces — it is the only way
      # every file in this package is type-checked by anything.
      #
      # The package has two entry points and they are mutually exclusive by
      # construction: `exports_cgo.go` imports "C", which Go excludes whenever
      # cgo is off, and `main_helper.go` carries `//go:build !cgo`, which Go
      # excludes whenever cgo is on. A runner has a C toolchain, so
      # `CGO_ENABLED` defaults to 1 and `go list` puts `main_helper.go` in
      # `IgnoredGoFiles` — an ignored file is not compiled, not vetted and not
      # tested. That is the file that starts the tunnel helper on Linux, which
      # is how every Linux runner serves a tunnel at all, and until this line it
      # was compiled by nothing in CI.
      #
      # Measured rather than reasoned: dropping an argument from its one call to
      # `runHelper` left `gofmt -l .`, `CGO_ENABLED=1 go vet ./...` and
      # `CGO_ENABLED=1 go test -count=1 ./...` all at exit 0, and
      # `CGO_ENABLED=0 go vet ./...` at exit 1 naming the line. gofmt is the
      # exception that proves the rule — it reads every `.go` file regardless of
      # build tags, so formatting was never the gap; type-checking was.
      #
      # Running only at 0 would swap one hole for the other, since that is the
      # setting that ignores `exports_cgo.go` — the archive the Apple and
      # Android apps link. Neither setting alone covers this package.
      #
      # `-count=1` so a cached result from a previous run is never mistaken for
      # this commit passing.
      - name: Vet and test with cgo, which is what the apps link
        run: |
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=1 go test -count=1 ./...
      # And without it, which is what a Linux runner actually ships: the helper
      # is built `CGO_ENABLED=0` precisely because a Go c-archive inside a musl
      # binary segfaults in Go's runtime startup. This is that build.
      - name: Vet and test without cgo, which is what Linux ships
        run: |
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Both, because the daemon runs on both and the differences are real:
        # tmux behaves differently, launchd and systemd are different code paths,
        # and the Linux build is the one that has to work without OpenSSL
        # headers — which is why reqwest uses rustls.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # aarch64 Linux, added alongside the host target rather than in
          # place of it — see the `farcooler-tailcat` check below for why.
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # tmux is not a test double here. The tmux crate drives the real binary,
      # because a fake tmux would agree with whatever this code believed.
      # Bounded, and it has to be. This step hung for an hour on two
      # consecutive runs — `apt-get update` against a mirror that accepts the
      # connection and then stops answering, which has no timeout of its own
      # and no output, so the job reads as "still working" until someone looks
      # at the step list. A run that fails in five minutes can be re-run; one
      # that hangs holds a runner until the six-hour ceiling.
      #
      # The retries and the timeout are what make the failure fast rather than
      # eventual; `command -v` first is what makes it usually free, since the
      # Ubuntu runner image already ships tmux and the macOS one does not.
      - name: Install tmux
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            sudo apt-get $APT_OPTS update
            sudo apt-get $APT_OPTS install -y tmux
          else
            brew install tmux
          fi
          tmux -V

      # git-lfs, for the two daemon tests that use it
      # (`crates/daemon/tests/lfs_content_under_the_git_sandbox.rs`): one makes
      # the repository the daemon's own LFS filter reads, and one shows that a
      # planted `lfs.extension` does run under git-lfs, which is the control
      # for the test that it runs nothing under the daemon. The daemon itself
      # never runs git-lfs. With `CI` set, a missing git-lfs fails them rather
      # than skipping. Both runner images usually have it; bounded like tmux.
      - name: Install git-lfs
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            git-lfs version
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            sudo apt-get $APT_OPTS update
            sudo apt-get $APT_OPTS install -y git-lfs
          else
            brew install git-lfs
          fi
          git-lfs version

      # fish, because it is a login shell people have and the one whose quoting
      # differs: inside single quotes it reads `\\` and `\'`, which sh does not.
      # A pane's command is parsed by the login shell, so the daemon's launch
      # tests run every quoting case through fish as well as sh, bash and zsh
      # — and with `CI` set, a missing fish FAILS them rather than skipping
      # its half (`launch_prompt_tests::shells`). Bounded like tmux above.
      # Ubuntu's fish is 3.7 and Homebrew's is 4.x; the launch needs 3.4 or
      # later for `"$(…)"`.
      - name: Install fish
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
              sudo apt-get $APT_OPTS update
              sudo apt-get $APT_OPTS install -y fish
            else
              brew install fish
            fi
          fi
          fish --version

      # The ACP adapters are `npx` packages, which need only node and a network
      # — both of which the runner already has. These three are spawned BY NAME
      # instead, so the binary has to be on PATH before anything can hand shake
      # with it: opencode for `every_built_in_backend_completes_a_handshake`,
      # and claude and codex for the two native-backend tests, all in
      # crates/agent/tests/backends.rs.
      #
      # Installing them is the contract rather than a convenience.
      # `crates/agent/tests/backends.rs` says three times over that a missing
      # program is a FAILURE and not a skip — "silently passing would mean the
      # one test that can catch a broken adapter never runs where it matters" —
      # so the runner has to be a machine where they exist. The alternative,
      # teaching those tests to skip, would delete the only coverage the
      # dispatch path has.
      #
      # The handshake needs the binary and nothing else: no key, no login. It
      # answers in about five seconds for both.
      #
      # Those tests are `#[ignore]` and gated on `FARCOOLER_LIVE_AGENTS=1` (see
      # `test/live_agents.rs`), so a developer's `cargo test` never starts a
      # real agent. The step after `cargo test --workspace` below is where CI
      # turns the switch on and runs them.
      #
      # Pinned in .github/agent-clis.txt (ov-410): an unpinned install took
      # whatever npm served that minute, which once was a codex launcher whose
      # platform binary was not yet published. agent-clis-latest.yml tries the
      # newest versions daily in a run of its own. The `--version` calls fail
      # this step, by name, when a binary is missing, rather than leaving it to
      # a handshake test to report as silence.
      - name: Install the agents the native backends spawn
        run: |
          set -euo pipefail
          grep -v '^#' .github/agent-clis.txt | grep . | xargs npm install -g
          opencode --version
          claude --version
          codex --version

      # `crates/daemon/tests/a_real_sshd_forces_the_scope.rs` stands up a real
      # loopback sshd, and `cargo test --workspace` below runs it. It is the
      # closest thing this repository has to a security guard: sshd, not the
      # daemon, is what makes a `read` device unable to ask for `host_admin`,
      # and only a real sshd can be asked whether that is true.
      #
      # It was `#[ignore]`d for four months behind a reason that named a
      # scheduled lane, and no workflow here has ever had a `schedule:`
      # trigger. Nothing ran it. The attribute is gone; this step is the one
      # thing the runner has to supply that is not universal.
      #
      # NOT root, and that was the open question — `scripts/tunnel-e2e.sh` says
      # in its header that whether a non-root sshd starts on a GitHub runner
      # "has never been tried". It was tried before this line was written, on
      # macOS 26.6 (OpenSSH 10.3p1) and Ubuntu 26.04 (OpenSSH 10.2p1):
      # `restrict`, `command=` and `environment=` all behave, and OpenSSH skips
      # privilege separation outright when `getuid()` is not 0, which is the
      # only part that would have wanted a privileged runner.
      #
      # `command -v` first for the same reason the tmux step does it: the
      # Ubuntu image ships `openssh-server` already and the macOS one ships
      # sshd with the OS, so this is normally free. The test asserts on
      # `/usr/sbin/sshd` by absolute path — it will not take one off PATH,
      # because a runner is entitled to know which sshd it authenticated
      # against — so that is the path this checks.
      - name: Make sure there is an sshd to test the fence against
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ ! -x /usr/sbin/sshd ]; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
              sudo apt-get $APT_OPTS update
              sudo apt-get $APT_OPTS install -y openssh-server
            else
              echo "no /usr/sbin/sshd on a macOS runner, which ships one with the OS" >&2
              exit 1
            fi
          fi
          /usr/sbin/sshd -V 2>&1 | head -1

      # No `cargo fmt --check`, deliberately, and it is worth saying why rather
      # than leaving it looking forgotten. This workspace predates any
      # formatter, and default rustfmt wants to reformat sixty files — mostly by
      # expanding onto four lines things that were written on one. Adopting it
      # is a reasonable call to make later; making it as a side effect of adding
      # CI is not. Clippy, which finds real defects rather than disagreeing
      # about widths, runs at -D warnings.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The line above is `--workspace` at DEFAULT features, and that word is
      # the whole gap these seven lines close: every `tailcat` feature in this
      # workspace is off by default, so the code behind them had never been
      # linted by anything. Not "less often" — never, since the features were
      # added.
      #
      # It was not hypothetical. `cargo clippy -p farcooler-daemon --features
      # tailcat-helper --all-targets` failed with two `await_holding_lock`
      # errors in `tests/a_pairing_gives_the_runner_a_tunnel.rs` — a
      # `std::sync::MutexGuard` held across four `.await`s, which is a deadlock
      # the moment tokio resumes that task on another thread — and `cargo
      # clippy -p farcooler-cli --features tailcat --all-targets` failed with a
      # `dead_code`. Both files are ones CI already BUILDS: the four
      # `cargo test --features tailcat-helper` lines below run that daemon
      # test, and `apps/macos/build-app.sh` ships the CLI at `--features
      # tailcat`. Only the lint was blind.
      #
      # `-p` per crate rather than one `--workspace --features …`: clippy lints
      # only the packages it is asked for, so `-p farcooler-daemon --features
      # tailcat` says nothing about `farcooler-cli` even though it builds it.
      # `--all-targets` because all three findings were in test targets, which
      # is where a feature's `cfg(not(…))` arms live.
      #
      # None of these link, so none of them need a Go toolchain — verified with
      # `go` off PATH, the same standard `cargo check -p farcooler-daemon
      # --features tailcat` below is held to.
      #
      # Six of the seven lint source no other line here reaches: a
      # `cfg(feature = ...)` or `cfg(not(feature = ...))` item that the default
      # build never compiles. `farcooler-jni` is the exception and is kept
      # anyway — it has no feature-gated source of its own TODAY, so today it
      # only re-lints what `--workspace` already did, but `--features tailcat`
      # is what `scripts/build-android-libs.sh` and
      # `scripts/build-ios-frameworks.sh` both ship that crate with, and the
      # first `cfg` anybody writes there would otherwise land unlinted the same
      # way these findings did. Each of the seven was watched to go red on a
      # mutation behind its own feature while `--workspace` above stayed green.
      - run: cargo clippy -p farcooler-tailcat --features helper --all-targets -- -D warnings
      - run: cargo clippy -p farcooler-tailcat --features linked --all-targets -- -D warnings
      - run: cargo clippy -p farcooler-daemon --features tailcat-helper --all-targets -- -D warnings
      - run: cargo clippy -p farcooler-daemon --features tailcat --all-targets -- -D warnings
      - run: cargo clippy -p farcooler-client --features tailcat --all-targets -- -D warnings
      - run: cargo clippy -p farcooler-cli --features tailcat --all-targets -- -D warnings
      - run: cargo clippy -p farcooler-jni --features tailcat --all-targets -- -D warnings

      # The `linked` backend on the target it actually ships on. The clippy
      # line above now type-checks it too, but only for THIS job's host arch;
      # the second invocation here is the one that cannot be dropped, and the
      # first is kept as the plain-`check` baseline the paragraph below is
      # about. `--workspace` reaches neither: it builds every crate at DEFAULT
      # features, and so does `cargo test --workspace` below. `linked` is off
      # by default on purpose (see that crate's `Cargo.toml`) so a checkout
      # with no Go toolchain still builds — but that meant the only backend
      # that will ever run in production, every FFI declaration and every
      # errno mapping in it, was for a long time checked by nothing here at
      # all.
      # `cargo check` doesn't link, so it needs no Go archive; it still
      # catches a type mismatch in the `extern "C"` block, which is exactly
      # what shipped once before this step existed — `c_char` is `u8` on ARM
      # Linux and a hardcoded `i8` compiled cleanly on this job's own host
      # while failing on `aarch64-unknown-linux-musl`, this crate's own
      # release target and the same architecture Android ships on. The
      # second invocation below is the one that catches that: the host arm
      # of this matrix is darwin or x86_64 Linux, neither of which disagrees
      # with `i8`.
      - run: cargo check -p farcooler-tailcat --features linked
      - run: cargo check -p farcooler-tailcat --features linked --target aarch64-unknown-linux-musl

      # The same gap, for the backend Linux actually ships. `helper` is off by
      # default too, so `--workspace` never builds it — and unlike `linked`
      # this one can be TESTED rather than only type-checked, because it links
      # no Go and needs no toolchain at all: it spawns a program, and a test
      # can hand it a shell script.
      #
      # The daemon test is the one that matters and it is named for what it
      # asserts: a runner that admits nobody must start no helper PROCESS, not
      # merely return a refusal. Tailcat reads an empty allowlist as "admit
      # everyone", so that guard is the one this design is most likely to lose,
      # and this is the only place in CI where losing it goes red.
      - run: cargo test -p farcooler-tailcat --features helper
      - run: cargo test -p farcooler-daemon --features tailcat-helper --test an_empty_allowlist_starts_no_tunnel
      # Revocation's guards live or die by this line. A default `cargo test`
      # links no tunnel, so `serve` refuses every call for any input and "was
      # the tunnel rebuilt" is unobservable -- every assertion in that file
      # would pass vacuously. Under the helper backend the tunnel is a process
      # a fake helper records commands for, which is the only shape in which
      # revoking the LAST tunneled device can be seen to stop a running server.
      - run: cargo test -p farcooler-daemon --features tailcat-helper --test revocation_closes_what_it_revoked
      # The pairing's two halves, and they pull opposite ways: a runner with no
      # tunnel must GET one, and a runner that has one must keep serving it
      # rather than have it replaced under every other device. Neither is
      # observable in a default build — `serve` refuses every call for any
      # input there, so "was the running server replaced" has the same answer
      # whatever the code does. Under the helper backend the tunnel is a
      # process, and a fake helper records the commands it was given tagged
      # with its own pid, so two servers are two numbers in a file.
      - run: cargo test -p farcooler-daemon --features tailcat-helper --test a_pairing_gives_the_runner_a_tunnel
      # `FARCOOLER_DERP_MAP` end to end, and it is here for the same reason as
      # the three lines above: a default build's `serve` refuses every call, so
      # nothing is spawned and nothing is told anything, and "did the runner's
      # DERP map reach the thing that serves" would be a vacuous assertion.
      #
      # What it buys that `rendezvous`'s own unit tests cannot: those prove the
      # decision is wired to `set_derp_map_url`, and nothing in this workspace
      # can prove `main` CALLS it — that line is inside `#[tokio::main] async fn
      # main()`, which no test links. This file spawns the real `farcoolerd`
      # with the variable set and reads back what the tunnel helper was told, so
      # deleting the call from `main` turns it red.
      - run: cargo test -p farcooler-daemon --features tailcat-helper --test a_configured_derp_map_reaches_the_tunnel

      # The end-to-end tunnel test, type-checked and NOT run — and the second
      # half of that sentence is the point of this comment.
      #
      # `crates/daemon/tests/a_real_tunnel_carries_the_scope.rs` is the only
      # thing in this repository that has ever carried a byte end to end
      # through the tunnel: a real DERP relay on loopback, a real tailcat
      # server and client, a real sshd, and the scope out of a real
      # `authorized_keys`. **Nothing in this workflow runs it.** It needs a Go
      # archive linked into the test binary, a `derper` built from the same
      # tailscale.com, `TS_DEBUG_USE_DERP_HTTP=1` in the environment at exec,
      # and an Apple silicon host — `scripts/tunnel-e2e.sh` assembles all four
      # and is the only supported way to run it. See that script's header for
      # what a job here would have to install, and why the Linux runner in this
      # matrix cannot be the one to do it (its two tailcat targets are musl,
      # where a linked Go c-archive segfaults in Go's runtime startup, and the
      # helper backend it ships instead cannot dial at all).
      #
      # So this line buys exactly one thing and it should not be read as
      # buying more: the file cannot rot. `--workspace` above builds default
      # features, which `cfg`s that file away entirely, so a shipped API it
      # calls could be renamed and nothing in CI would notice until somebody
      # next ran the script by hand. `cargo check` links nothing, so it needs
      # no archive and no Go toolchain — verified with `go` off PATH — and it
      # goes red on exactly the drift it is here for: renaming
      # `allowlist::tunnel_plan` under it gives
      # `error[E0425]: cannot find function` and exit 101.
      #
      # It does NOT prove a tunnel comes up. Nothing here does.
      - run: cargo check -p farcooler-daemon --features tailcat --all-targets

      # A `changes` pane runs THIS CHANNEL'S CLI by name — `changes_host_command`
      # asks `shim_binary`, which looks beside the daemon's own executable and
      # otherwise falls back to the bare name for PATH to resolve. Under `cargo
      # test` the "daemon executable" is the test binary in `target/debug/deps`,
      # where no CLI has ever been placed, so the fallback is all there is.
      #
      # A developer machine has one installed, which is why
      # `a_pane_split_with_the_changes_preset_is_a_changes_pane` passes there and
      # nowhere else. A runner has none, the pane's command cannot start, and
      # `remain-on-exit` leaves a dead rectangle the test correctly calls Exited.
      #
      # Named for the channel because that is what `shim_binary` asks for, and a
      # clean untagged checkout is `local`. The other names are linked too, so
      # this does not quietly stop working the day CI builds a different one.
      - name: Put this channel's CLI where the daemon tests look for it
        run: |
          set -euo pipefail
          cargo build --workspace --bins
          for name in farcooler-local farcooler-preview farcooler-canary; do
            ln -sf "$PWD/target/debug/farcooler" "$PWD/target/debug/$name"
          done
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      # Wrapped so a test that leaves its tmux server running fails the job
      # (ov-207): one such server once ran for 15.5 hours at 92% CPU.
      - run: ./scripts/tmux-leak-check.py --self-test
      - run: ./scripts/tmux-stale-sockets.py --self-test
      - run: ./scripts/tmux-leak-check.py -- cargo test --workspace

      # The tests that start a real agent or adapter, which `cargo test
      # --workspace` above skips: the handshakes and the npm deprecation check
      # in crates/agent. They need the binaries and no sign-in. Run by target
      # so nothing else that is `#[ignore]` comes along.
      #
      # The npx adapters run at the versions pinned in .github/acp-adapters.txt
      # (ov-414), as the CLIs above do; agent-clis-latest.yml runs the newest.
      #
      # Not here, because they need a signed-in agent and this runner has none:
      # the `live_turn` tests in crates/claude and crates/codex, and
      # `crates/core/tests/live_agents.rs`. The live_turn tests used to run
      # here and pass on claude's "Not logged in" text in 0.4 s; they now
      # demand the actual answer, so they belong on a developer's machine.
      - name: Live agent handshakes
        env:
          FARCOOLER_LIVE_AGENTS: "1"
        run: cargo test -p farcooler-agent --test backends -- --ignored

  swift:
    name: Swift (shared + macOS)
    # Xcode 27 on macOS 27. `macos-latest` is still macOS 26 with Xcode 26.6;
    # Xcode 27 is only on this label, which GitHub calls a public preview.
    # To go back, put `macos-latest` here again and drop the check step.
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      # The label promises Xcode 27. This makes the log say which one, and
      # stops the job if the image ever hands it a different major.
      - name: Check the runner has Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - uses: actions/checkout@v4
        with:
          # The build number is `git rev-list --count HEAD`, and the default
          # depth-1 checkout would make it 1 — silently, since the command
          # succeeds. scripts/version.sh now refuses a shallow clone outright,
          # so without this the bundle step fails rather than lying.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Go, for the tunnel archive `build-app.sh` links into `farcoolerd`.
      # This job runs the whole bundle assembly, which is the point of it —
      # so it needs everything that assembly needs. Pinned by `go-version-file`
      # rather than trusted to the image: the macOS runner happens to ship a
      # Go, and an image bump that drops it fails with an error that never
      # mentions Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          # The module lives under crates/, and setup-go looks for go.sum at
          # the root by default: without this every run warned "Dependencies
          # file is not found", restored nothing and built the tunnel cold
          # (about a minute in each job that builds it; ov-301).
          cache-dependency-path: crates/tailcat/go/go.sum

      # Resolved ONCE, here, before the build step below runs `cargo build
      # --release`. That build rewrites the tracked `Cargo.lock` whenever it and
      # `Cargo.toml` have drifted — an ordinary version bump does exactly that —
      # and `version.sh channel` answers `local` for a dirty tree. A step below
      # that re-asked `version.sh app-name` after the build would then go looking
      # for `Far Cooler Local.app` while the bundle on disk is named for the real
      # channel, and fail on a missing path. Resolving it up front and passing it
      # through `$GITHUB_ENV` means every step below agrees with the one that
      # built the bundle.
      - name: Resolve this channel's app name
        run: |
          set -euo pipefail
          name="$(scripts/version.sh app-name)"
          [ -n "$name" ] || { echo "version.sh app-name returned nothing; refusing to continue"; exit 1; }
          echo "APP_NAME=$name" >> "$GITHUB_ENV"

      # The full bundle, not `swift build`. `build-app.sh` is the thing that has
      # gone wrong before — it once copied a stale Rust binary instead of
      # building one — so the assembly step is what CI should exercise.
      - name: Build Far Cooler.app
        run: apps/macos/build-app.sh

      # The bundled daemon, actually run. `build-app.sh` links the tunnel
      # archive into `farcoolerd`, and until it did, every Mac release carried
      # a daemon that answered `no_tailcat` to every tunnel it was asked to
      # serve — while building, signing, notarising and passing every check
      # there was. This is the check that would have caught it, and it runs
      # here rather than only in the release workflows because it is the same
      # `build-app.sh` producing the same binary, on every pull request.
      - name: Check the bundled daemon has the tunnel linked
        run: scripts/tunnel-smoke.sh "apps/macos/build/$APP_NAME.app/Contents/Resources/farcoolerd"

      - name: Check the bundle is stamped with this commit's version
        run: |
          app="apps/macos/build/$APP_NAME.app"
          expected="$(scripts/version.sh)"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist")"
          [ "$expected" = "$actual" ] || {
            echo "bundle says $actual, the workspace says $expected"; exit 1; }

      # Every component must report the same build stamp. This is the check that
      # would have caught a Mac driving a host running different source.
      #
      # It compares them, which the first version of this step did not: it ran
      # `farcooler --version`, threw the output away, and asserted only that the
      # process exited 0. The regression it names would have sailed through.
      - name: Check the CLI and daemon agree
        run: |
          app="apps/macos/build/$APP_NAME.app"
          resources="$app/Contents/Resources"
          cli="$("$resources/farcooler" --version | awk '{print $2}')"
          daemon="$("$resources/farcoolerd" --version | awk '{print $2}')"
          echo "cli $cli / daemon $daemon"
          [ "$cli" = "$daemon" ] || {
            echo "the bundled pair disagree — they must be built together"; exit 1; }
          case "$cli" in
            "$(scripts/version.sh)"+*) ;;
            *) echo "neither matches the workspace version $(scripts/version.sh)"; exit 1 ;;
          esac

      # That four channels draw four labeled icons and stable draws none — a
      # test nobody runs is not a test, and stable shipping a re-encoded (rather
      # than byte-identical) copy of the one icon every channel shares would
      # otherwise pass on nobody's machine but this one. Here, not in `wire`:
      # icon-label.swift is AppKit, and AppKit does not exist on the Linux
      # runner `wire` uses.
      - run: ./scripts/icon-test.sh

      # That we can derive a Sparkle public key from its private half, checked
      # against RFC 8032's published vectors rather than against a pair we made
      # up. The release workflows use that derivation to refuse to sign with a
      # key the shipped apps do not trust — a mismatch that fails nowhere in CI
      # and is rejected on every client instead. Here rather than in `wire` for
      # the same reason as the icon test: CryptoKit is macOS-only.
      - run: ./scripts/sparkle-key-test.sh

      # Hardened Runtime blocks camera access before macOS can show the consent
      # prompt unless the final app signature carries the camera entitlement.
      # Check every signing path, not only the local bundle assembled above.
      - run: ./scripts/macos-entitlements-test.sh "apps/macos/build/$APP_NAME.app"

      # `apps/macos/test.sh` builds the Rust cores before the Mac tests (ov-134).
      - run: ./scripts/macos-test-wrapper-test.sh
      # A test run that ends early, or counts fewer tests than its floor, fails
      # (ov-324): a test that exited the process once ended `swift test` with
      # exit 0 and left every later test unrun.
      - run: ./scripts/swift-test-guard-test.sh
      # The capture harness's stop ends its daemon and tmux with no CLI (ov-278).
      - run: ./scripts/mac-capture-stop-test.sh

      - name: Test AgentKit
        # Under the same early-exit guard as the Mac's tests (ov-324); a change
        # that adds tests raises the floor in apps/shared/AgentKit/test-floor.txt.
        run: ./scripts/swift-test-guard.sh apps/shared/AgentKit/test-floor.txt -- swift test --package-path apps/shared/AgentKit

      # The Mac app's own four test targets, which had never run here.
      #
      # `swift test --package-path apps/shared/AgentKit` above is the only Swift
      # test line this workflow has ever had, so `CeremonyTests`, `GlanceTests`,
      # `TilingTests` and `RenderBenchTests` — 196 tests across 33 suites —
      # executed nowhere but the machine that wrote them. That covers the
      # `~/.ssh/config` writer, whose failure modes its own Package.swift
      # comment names as "a runner taking over `github.com` for every push on
      # this Mac", and the glance vocabulary, which rasterises a mark and reads
      # the ink back out because "a view asked what it is will happily answer
      # correctly while rendering something else". Both are things that CANNOT
      # be caught by looking, which is the reason those targets exist at all.
      #
      # Last in the job, and it has to stay last. `swift test` can rewrite
      # `Package.resolved`, and a dirty tree makes `scripts/version.sh channel`
      # answer `local` — every step above that asks it must have asked already.
      #
      # It needs the same `target/release` static libraries `build-app.sh`
      # already built at the top of this job, so it costs a Swift compile and
      # nothing else. RenderBenchTests asserts nothing and stays silent unless
      # `FARCOOLER_RENDER_BENCH` is set, so this is not the slow benchmark.
      #
      # tmux, so `RealCLIConfirmationTests` runs here rather than reporting a
      # skip: it starts the bundle's real daemon, which needs tmux, and feeds
      # the Mac's parser what the real CLI prints (ov-160). The image has no
      # tmux of its own. Outside the work tree, so the channel stays clean.
      - name: Install tmux
        run: brew install tmux
      - name: Test the Mac app
        run: ./apps/macos/test.sh

  ios:
    name: iOS
    # The plan says whether the UI shards will want this job's products. Not
    # `success()`: a misplaced UI test class fails the plan, and that must not
    # also stop the app from being built and checked here.
    needs: ios-ui-plan
    if: ${{ !cancelled() }}
    # Xcode 27 on macOS 27. `macos-latest` is still macOS 26 with Xcode 26.6;
    # Xcode 27 is only on this label, which GitHub calls a public preview.
    # To go back, put `macos-latest` here again and drop the check step.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      # The label promises Xcode 27. This makes the log say which one, and
      # stops the job if the image ever hands it a different major.
      - name: Check the runner has Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2

      # The xcframeworks are gitignored — they are build output — so CI has to
      # build them before the project that links them. Without this the app
      # links nothing and fails at the linker, which reads as a Swift error.
      - name: Build the Rust xcframeworks
        run: ./scripts/build-ios-frameworks.sh

      # The project file is generated, never committed as the source of truth,
      # so CI must generate it too — otherwise a source file added to AgentKit
      # compiles locally and is missing from the app.
      - name: Generate the Xcode project
        run: apps/ios/generate-project.py

      # Several GB, and NOT optional. The FarCooler scheme embeds FarCoolerWatch
      # through a target dependency, and xcodebuild refuses to build a scheme
      # that embeds a watch app unless the watchOS Simulator platform is
      # installed — even here, where the destination is generic and no
      # simulator is ever launched. Worse, it refuses with no `error:` line
      # at all, so the failure reads like a project-generation bug and is
      # not one.
      #
      # Its own step, named for what it costs, so those minutes are visible in
      # the job timing instead of hidden inside a build that merely looks slow.
      # There is nothing to cache: -downloadPlatform installs into the runner's
      # system Xcode, outside anything actions/cache can carry between runs. It
      # is idempotent, so a runner image that already ships the platform pays
      # seconds rather than minutes.
      - name: Install the watchOS platform (several GB)
        run: xcodebuild -downloadPlatform watchOS

      # `ARCHS=arm64` explicitly, and a generic destination rather than a named
      # simulator. The vendored xcframeworks carry no x86_64 simulator slice, so
      # the default two-architecture build fails at link; naming a device
      # instead ("iPhone 17 Pro") would work until the runner image ships a
      # different set of simulators, which it does without warning.
      # `build-for-testing` and not `build`, which is a one-word difference
      # and the difference between compiling the UI suite and not.
      #
      # The scheme's Build action lists the app and nothing else — the test
      # bundle is in its Test action — so plain `build` compiled zero lines of
      # `FarCoolerUITests`. A UI test that did not compile therefore passed CI
      # and failed only on the laptop that eventually ran it, which is this
      # repo's own defining failure wearing a hat: a check that cannot fail.
      # `build-for-testing` compiles the app AND the bundle, boots no
      # simulator, and adds the test target's own compile time and nothing
      # else.
      #
      # It does NOT run them. See the note below, which is unchanged.
      #
      # `-derivedDataPath` so the products are somewhere this job can name,
      # outside the work tree: the UI shards below run these exact products
      # rather than each compiling their own (ov-301).
      - name: Build, including the UI test bundle
        run: |
          xcodebuild -project apps/ios/FarCooler.xcodeproj \
            -scheme FarCooler \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            ARCHS=arm64 \
            build-for-testing
        env:
          NSUnbufferedIO: YES

      # The app, the UI test runner and the `.xctestrun` that ties them
      # together, for the `ios-ui` shards. Each shard used to build all three
      # itself: the Rust xcframeworks, the project, and about five minutes of
      # Swift inside `xcodebuild test` — the same compile, three times over,
      # on the runner pool everything else on macOS waits for.
      #
      # A tarball rather than the directory, because upload-artifact does not
      # keep file modes: an app whose executable lost its x bit installs and
      # then cannot launch. One `.xctestrun` exactly, or the shards would have
      # to guess which to run.
      - name: Package the products for the UI shards
        if: needs.ios-ui-plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          runs=("$RUNNER_TEMP"/ios-dd/Build/Products/*.xctestrun)
          [ "${#runs[@]}" -eq 1 ] && [ -f "${runs[0]}" ] || {
            echo "expected one .xctestrun, found: ${runs[*]}" >&2; exit 1; }
          tar -C "$RUNNER_TEMP/ios-dd/Build" -cf "$RUNNER_TEMP/ios-ui-products.tar" Products
          ls -lh "$RUNNER_TEMP/ios-ui-products.tar"
      - name: Upload the products for the UI shards
        if: needs.ios-ui-plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-products
          path: ${{ runner.temp }}/ios-ui-products.tar
          retention-days: 1
          # A re-run of this job replaces what the first attempt uploaded.
          overwrite: true

      # Here rather than beside the other shell tests in the `swift` job because
      # what it covers is the iOS archive's signing, and it needs a Mac to have
      # a keychain to cover it with.
      - run: ./scripts/import-ios-certificate-test.sh

      # What the generated project must be true of, and none of it is something
      # the build above can catch. A watch app embedded in the extensions' slot,
      # a bundle identifier that stops nesting, a target that names a different
      # App Group — each compiles, links and signs, then fails at INSTALL, at
      # launch, or as a widget that is permanently and silently empty. There is
      # no `error:` line for any of them.
      #
      # After the build and its upload rather than before the xcframeworks
      # (ov-301): a failure here then still leaves the UI shards their
      # products, so they report on the app instead of on a missing artifact.
      # It costs a red here two minutes later, which is the trade.
      #
      # Here rather than in `wire`: the generator shells out to
      # scripts/icon-label.swift, which is AppKit, and AppKit does not exist on
      # the Linux runner that job uses — the same reason icon-test.sh lives in
      # `swift` instead.
      - run: ./scripts/generator-test.sh

      # Run by the `ios-ui` job below: every class that stands on an in-app
      # harness and needs no runner. The rest of FarCoolerUITests needs a
      # live runner — an sshd, a daemon and a tmux fleet, which is what
      # scripts/demo-host.sh stands up on a laptop and what CI has none of —
      # so that half stays a LOCAL guarantee. Run it before landing anything
      # that touches a pane:
      #
      #   ./scripts/demo-host.sh
      #   ./scripts/ios-ui-tests.sh
      #
      # Use that script and not xcodebuild directly. It puts the TEST_RUNNER_*
      # assignments where xcodebuild actually reads them, and it fails a run in
      # which every test skipped — which xcodebuild calls a success, and which
      # is how eight green scroll tests once covered for a terminal that would
      # not scroll.

  # Whether `ios-ui` runs, and that its class lists are complete.
  #
  # On Linux and in seconds, so a push or PR that touches nothing the iOS app is
  # built from does not hold two `xcode-27` runners — the pool canary and release
  # draw on too — for half an hour.
  # The paths are what the app compiles (apps/ios, AgentKit under
  # apps/shared), the crates the xcframeworks link (farcooler-client and its
  # path dependencies core, fence, protocol, tailcat and transport, plus
  # farcooler-vt, per `cargo metadata`), the .proto protocol compiles, the
  # shared fixtures, and this job's own scripts and workflow.
  #
  # PUSHES TO MAIN FILTER TOO, comparing the push with the nearest ancestor whose
  # CI run on main was green, not with its own `before`: this workflow cancels a
  # run when the next push lands, so an iOS change whose run was cancelled (or
  # went red) must still be tested by the next green-bound run. This used to
  # say "every push to main runs it regardless", on purpose, as a backstop.
  # The owner chose otherwise on Oct 5 (ov-301): GitHub gives this repository
  # five macOS runners, CI asked for seven per push and Canary two, so pushes
  # queued, and five shards are about 130 macOS minutes that a daemon-only or
  # Mac-only push does not need. With no green ancestor in the history, or a range
  # that cannot be computed, everything still runs (scripts/ios-ui-plan.py). A skipped
  # shard is ignored by the shard budget (scripts/ios-ui-shard-budget.py).
  # What is lost: an iOS UI break caused by a change outside the paths above
  # goes unreported until the next push that touches them.
  #
  # `ios-ui-shards.py --check` runs whatever the paths say: a UI test class
  # placed in no shard and not in its LOCAL list fails here, which is how a
  # class added beside another in one file cannot quietly go unrun.
  ios-ui-plan:
    name: iOS UI plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every UI test class is placed
        run: ./scripts/ios-ui-shards.py --check
      # Main's successful CI runs, for a push: the base is the nearest one in
      # this commit's history (scripts/ios-ui-plan.py). Without the list, or
      # with an empty one, everything runs. When gh fails (a 502, a timeout) the
      # step does not fail the job: it records why in CANDIDATES_ERROR, and the
      # plan runs every shard with a notice (ov-340).
      - name: List the green CI runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | {head_sha, created_at}' > "$RUNNER_TEMP/green.ndjson" 2> "$RUNNER_TEMP/gh.err"; then
            echo "$(wc -l < "$RUNNER_TEMP/green.ndjson") green CI runs listed"
          else
            why="$(head -c 200 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
            echo "CANDIDATES_ERROR=${why:-gh exited non-zero}" >> "$GITHUB_ENV"
          fi
      - name: Decide whether the UI tests run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AFTER: ${{ github.event.after }}
          CANDIDATES: ${{ runner.temp }}/green.ndjson
        run: ./scripts/ios-ui-plan.py
      - run: ./scripts/ios-ui-plan.py --self-test

  # Whether any UI shard is running close to the `ios-ui` timeout (ov-322).
  # `phone` was cancelled at 40 minutes twice in one day as classes landed
  # in it, and a cancelled shard reports no verdict at all. This reads what
  # each shard took in main's last runs and goes red past 75%, so the lane
  # that lands the next class rebalances first. Its own job, so a red here
  # never stops the shards from running. See the script for the rules.
  ios-ui-budget:
    name: iOS UI shard budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Each run's shard lists come from its own commit.
          fetch-depth: 0
      - run: ./scripts/ios-ui-shard-budget.py --self-test
      - run: ./scripts/ios-ui-shard-budget.py
        env:
          GH_TOKEN: ${{ github.token }}

  # The iOS app's own code, executed (ov-127). Until this job the app target
  # was compiled by CI and run by nothing, so a rule that lived only there was
  # untested on iOS even where Android tested its port.
  #
  # Only the runnerless classes, as `scripts/ios-ui-shards.py` lists them —
  # by class, because `-only-testing` takes a class and one file can hold
  # several. Each launches the app on an in-app harness (`-shell-harness`,
  # `-agent-layout-harness`, `-phone-harness`, or a fixture flag) and needs a
  # simulator and nothing else. A live-runner test that slipped into a shard
  # would skip with "NO LIVE RUNNER:", and the script turns that red.
  #
  # Five shards (four since ov-301; R-40 added one); the seconds per class are in
  # scripts/ios-ui-shards.py. Each runs the products the `ios` job built
  # (`test-without-building`), so its overhead is the download, the boot and
  # the first launch, not a compile: 440 to 570 s a shard, measured. The
  # timeout is 45 minutes (ov-384; it was 40) and the budget job above goes
  # red at 75% of it, 33.75 minutes. Since R-40 each of the five shards holds
  # about 1,160 s of tests, 25.5 minutes as a job at a 375 s overhead (57%).
  #
  # WHY TWO JOBS (ov-384, R-40). The account has five macOS runners. At the
  # start CI asks for three (`rust` on macOS, `swift`, `ios`), and when `ios`
  # ends after about five minutes the shards ask for more than the two free
  # slots plus one; which got them was arbitrary, and the last started when
  # Rust's macOS leg ended at 13 to 16.5 minutes. So `ios-ui` holds three
  # shards that start at once, and `ios-ui-late` below holds the other two,
  # always held until `rust` ends, so they end together near minute 40 (they
  # were one, `phone2`, until R-40). See
  # .claude/agent/reports/ci-queueing/report.md.
  #
  # `!cancelled()` and not the implied `success()`: a red `ios` job that
  # still uploaded its products (one of its script tests failed after the
  # build) leaves the shards to run, and a build that produced nothing makes
  # each shard fail on the download, saying so, rather than skip.
  ios-ui:
    name: iOS UI (${{ matrix.shard }})
    needs: [ios-ui-plan, ios]
    if: ${{ !cancelled() && needs.ios-ui-plan.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # With `ios-ui-late`'s shards, these are SHARDS in
        # scripts/ios-ui-shards.py, whose `--check` fails when the two
        # disagree. The big ones; see the comment above.
        shard: [shell, agent, phone]
    steps:
      # Only the scripts, and the action below: the app comes from the `ios`
      # job.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-ui-shard
        with:
          shard: ${{ matrix.shard }}

  # The fourth and fifth shards, held until `rust` ends. Not entries of
  # `ios-ui`'s matrix because `needs` is per job. `!cancelled()` again: a red
  # `rust` must not stop the app's UI tests from running. They wait for both of
  # `rust`'s legs; the Linux one ends first, so the wait is the macOS leg's.
  # The job names are the ones the budget script reads
  # (scripts/ios-ui-shard-budget.py) and the timeout must equal `ios-ui`'s,
  # which `ios-ui-shards.py --check` holds it to. A fifth shard because four
  # ran 1,470 to 1,860 s of tests and `shell` was 80% of the timeout (R-40).
  ios-ui-late:
    name: iOS UI (${{ matrix.shard }})
    needs: [ios-ui-plan, ios, rust]
    if: ${{ !cancelled() && needs.ios-ui-plan.outputs.run == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # SHARDS in scripts/ios-ui-shards.py, as `ios-ui`'s are.
        shard: [phone2, phone3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-ui-shard
        with:
          shard: ${{ matrix.shard }}

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # `versionCode` is `git rev-list --count HEAD` through
          # scripts/version.sh, which refuses a shallow clone outright rather
          # than silently emitting 1 — so without this the Gradle configure step
          # fails instead of stamping a build number that would go backwards.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4

      # The NDK is not in the runner image by default, and the version is
      # pinned: `build-android-libs.sh` discovers which API wrapper to use from
      # what the NDK ships, so an unpinned one changes the floor the `.so` links
      # against without anybody asking for it.
      - name: Install the NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;29.0.14206865' 'platforms;android-37.1' 'build-tools;37.0.0'

      # The tunnel is Go, and `build-android-libs.sh` builds it before the
      # crate that links it. Pinned by `go-version-file` rather than trusted to
      # the image, for the reason release.yml's iOS job gives at its own copy
      # of this step: an image bump that drops Go fails with an error that
      # never mentions Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          # The module lives under crates/, and setup-go looks for go.sum at
          # the root by default: without this every run warned "Dependencies
          # file is not found", restored nothing and built the tunnel cold
          # (about a minute in each job that builds it; ov-301).
          cache-dependency-path: crates/tailcat/go/go.sum

      # Both `.so` are gitignored — they are build output — so CI has to build
      # them before the Gradle project that packages them. Without this the APK
      # ships for an ABI with no core in it and the failure arrives as an
      # UnsatisfiedLinkError on the first screen rather than here.
      - name: Build the Rust core and the tunnel for Android
        run: ./scripts/build-android-libs.sh

      # The ported logic, against the same fixtures the Swift suite uses. This
      # is the job that catches the transcript reducer drifting from the Apple
      # apps', which is the one thing about this client that must not happen.
      - name: Test
        working-directory: apps/android
        run: ./gradlew testInstrumentedUnitTest

      # Both, in one invocation, and the second half is new.
      #
      # `app/src/androidTest/` was neither run nor COMPILED by this job.
      # `testInstrumentedUnitTest` above builds `app/src/test/` and nothing
      # else, `assembleDebug` builds the app, and no workflow in this
      # repository mentioned `androidTest` anywhere — so 348 lines, including
      # the `NativeBridgeTest` case that exists to catch
      # `libfarcooler_jni.so` failing to load at all, could stop compiling
      # while this job stayed green. That is this repository's own defining
      # failure: a check that cannot fail. The iOS job above had the identical
      # hole and closed it the identical way, with `build-for-testing`.
      #
      # `assembleAndroidTest` and not `assembleInstrumentedAndroidTest`: the
      # variant task's name is spelled out of `testBuildType`, which
      # `app/build.gradle.kts` sets to `instrumented` for a reason of its own
      # and could set differently tomorrow. The lifecycle task is the name AGP
      # keeps, and a job that named the variant would fail with
      # `Task '…' not found`, which reads like the build breaking rather than
      # like a rename.
      #
      # It does NOT run them. See the note below.
      - name: Build, including the instrumented test bundle
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleAndroidTest

      # NOT run here: everything under `app/src/androidTest/`. The suite is
      # COMPILED by the step above and executed by none, and the two halves of
      # that are worth keeping apart: a test that does not build is a defect
      # this job can catch for nothing, and a test that does not run is a
      # guarantee this job cannot give at all.
      #
      # Running it needs an emulator, and unlike the iOS suite there is no
      # subset that would not — `NativeBridgeTest` exists precisely because
      # there is no `libfarcooler_jni.so` on a desktop JVM's library path, and
      # mocking it would test the mock. Booting one in CI is a real option and
      # deliberately not taken here, so CI's silence about that suite is
      # absence of evidence rather than evidence of absence. Run it against a
      # connected device or emulator before landing anything that touches the
      # JNI boundary:
      #
      #   ./scripts/build-android-libs.sh --emulator
      #   ./gradlew connectedInstrumentedAndroidTest
      #
      # That task, and not `connectedAndroidTest`: `testBuildType` is
      # `instrumented`, and the separate application id is what keeps a test
      # run from uninstalling the debug app someone is using — which would take
      # its Keystore SSH identity with it.

      # The only build that reads `proguard-rules.pro` or runs `lintVital`, and
      # neither had ever run at all.
      #
      # `build.gradle.kts` named a rules file that was never committed, and R8
      # fails outright on a config that is not there — so `assembleRelease` had
      # not once succeeded, while `apps/android/README.md` documents it as a
      # command to run. Behind that sat a second failure nothing could reach:
      # `lintVitalRelease` runs on release and not on debug. `4a0ba97` fixed
      # both, and this step is what keeps them fixed. A debug build reads
      # neither, which is exactly why nobody noticed for the life of the
      # project.
      #
      # It needs nothing this job does not already have. The release block has
      # no signing config, so what comes out is `app-release-unsigned.apk` and
      # no keystore is involved; the Firebase plugin is applied only when
      # `google-services.json` is present, which it is in no checkout; and the
      # WorkOS client id is a Gradle property that defaults to empty. That is
      # the same configuration the debug build above already runs under — the
      # question here is whether it BUILDS, not whether it could ship, and a
      # release anyone installs is built with the property the README names.
      #
      # Last, because it costs the most and answers the narrowest question: the
      # release variant compiles from source again and then pays for R8 and
      # resource shrinking on top — 24 s for the whole task on a developer's
      # Mac, and more on a cold runner. A Kotlin error or a transcript reducer
      # that has drifted from the Apple apps' should be reported by the step
      # named for it, not out of the middle of a minified build.
      - name: Build the release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease

      # The Robolectric UI tests: everything in `com.farcooler.capture`, which
      # the plain `Test` step above excludes (app/build.gradle.kts) because they
      # need the merged resources and a newer JVM than the build's. That
      # includes `NativeAgentViewTest`, the conversation view's UI tests, so a
      # regression there (reconnect, off to on) failed no job until now (ov-398).
      #
      # Robolectric's sandbox for SDK 37 needs JDK 21, while the build stays on
      # 17. So this installs 21 as a second JDK and hands its path to the test
      # task alone, through `farcooler.captureJdk`; Gradle itself keeps running
      # on 17. This is last, so the JDK 21 step cannot change what the builds
      # above ran on. Animation scale stays 0 in the harness; nothing here
      # touches it.
      - uses: actions/setup-java@v4
        id: jdk21
        with:
          distribution: temurin
          java-version: 21
      - name: UI tests (Robolectric)
        working-directory: apps/android
        env:
          CAPTURE_JDK: ${{ steps.jdk21.outputs.path }}
        run: |
          ./gradlew testInstrumentedUnitTest \
            -Pfarcooler.captures \
            "-Pfarcooler.captureJdk=$CAPTURE_JDK" \
            --max-workers=2
      # Gradle prints no test count, and a filter that matches nothing passes.
      # Read the result files, print the count, and fail on none, or on a
      # missing `NativeAgentViewTest`, which is the one that must run.
      - name: Count the UI tests that ran
        if: success() || failure()
        working-directory: apps/android/app/build/test-results/testInstrumentedUnitTest
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          classes = []
          for f in sorted(glob.glob("TEST-com.farcooler.capture.*.xml")):
              r = ET.parse(f).getroot()
              n = int(r.get("tests"))
              total += n
              failed += int(r.get("failures")) + int(r.get("errors"))
              skipped += int(r.get("skipped"))
              classes.append(r.get("name").rsplit(".", 1)[-1])
              print(f"{r.get('name')}: {n} tests")
          print(f"UI tests that ran: {total} in {len(classes)} classes, {failed} failed, {skipped} skipped")
          if total == 0 or "NativeAgentViewTest" not in classes:
              raise SystemExit("The capture/UI tests did not run; NativeAgentViewTest must.")
          PY

  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Inside workerd against a real D1, not against fakes: the account scoping
      # on revoke and the expiry predicate on notify are SQL, and a fake would
      # agree with whatever this code believed.
      - run: npm test
      # A dry run compiles and bundles the worker without deploying it, which
      # catches the class of error that only appears at upload time.
      - run: npx wrangler deploy --dry-run --outdir /tmp/relay-build
