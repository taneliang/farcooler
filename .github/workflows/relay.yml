# One relay per channel, and each one gets its code the way that channel does.
#
#   push to main       → canary, continuously
#   promote to preview → preview, from promote.yml
#   promote to stable  → stable, from promote.yml
#   workflow_dispatch → any of them, for a fix that cannot wait
#
# This used to deploy production on every push to main, and the reasoning here
# said it had to: an App Store release takes days and can never be rolled
# forward on demand, so there will always be phones running an app from months
# ago that the relay must keep serving.
#
# That argument is real, but it argues for ADDITIVE ONLY — new routes and new
# optional fields, never a removed route, never a changed meaning, never a
# required field on an existing request — which is what actually keeps a
# months-old app working. It does not argue for shipping every commit straight
# to the people running those apps with nothing in between.
#
# So the cadence moves to canary, which is continuous, and the escape hatch
# stays: `workflow_dispatch` can put any commit on the stable relay in one press
# when something is actually broken.
#
# WHY PREVIEW AND STABLE ARE CALLED FROM promote.yml RATHER THAN TRIGGERED BY A
# TAG: a tag pushed with the default GITHUB_TOKEN does not trigger a workflow.
# GitHub suppresses those events to prevent recursion, so `on: push: tags` here
# would look right, never fire, and leave the preview relay silently months behind
# the app that talks to it. promote.yml calls this one instead, the same way it
# calls release.yml.
name: Relay

on:
  # Canary is the continuous one. Every relay change lands there first, without
  # anyone deciding to put it there.
  push:
    branches: [main]
    paths: ['services/relay/**', '.github/workflows/relay.yml']

  # Any relay, from any ref. Two uses: putting a branch on the preview relay to
  # try it against a real app before merging, and getting a fix onto the stable
  # relay when something is broken and the next promotion is too far away.
  workflow_dispatch:
    inputs:
      environment:
        description: Which relay to deploy
        required: true
        default: canary
        type: choice
        options: [canary, preview, stable, local]

  # Called by promote.yml, so a channel's relay moves when that channel does.
  workflow_call:
    inputs:
      environment:
        description: Which relay to deploy
        required: true
        type: string
      ref:
        description: The commit to deploy, so a channel's relay is that channel's code
        required: false
        type: string

# One relay deploy at a time per channel, and the older one never lands last.
#
# Two pushes to main a minute apart start two of these, and each one applies
# migrations and then deploys. Ungrouped they interleave, and the way that goes
# wrong is not subtle: Cloudflare takes whichever upload finishes last, so the
# OLDER commit can end up being the worker that serves every request until the
# next relay change happens along — which, on a filtered trigger, can be days.
# Two `d1 migrations apply` against one database at the same moment is the other
# half: that command reads a table to decide which files have already run, and
# two readers deciding at once can run the same file twice.
#
# NOT `cancel-in-progress`, which is what canary.yml does and would be wrong
# here. This job migrates BEFORE it deploys, so a run cancelled between those
# two steps leaves the database moved and the old code serving it — the one
# state additive-only cannot rescue, because being additive is a promise about
# the NEXT schema, not about code that has never seen this one. Queueing costs
# the thirty-odd seconds a relay deploy takes. The alternative costs someone
# working out, from a live fault, that they need to run `wrangler deploy` by
# hand.
#
# Keyed by environment, because the four channels are genuinely separate
# workers with separate databases and nothing to serialise between them. A
# `workflow_dispatch` putting a fix on the stable relay must not queue behind a
# canary push it has nothing to do with — that button exists for the moments
# when waiting is the problem.
concurrency:
  group: relay-${{ inputs.environment || 'canary' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # A fork's push must not try to deploy to the upstream account. Gated on the
    # credential rather than on a repository name: a fork does not have the
    # secret, and a name in a workflow is one more thing to be wrong after a
    # rename.
    #
    # Through `vars`, not `secrets`. The `secrets` context is NOT available in
    # an `if` — GitHub allows only github/needs/vars/inputs there — so
    # `secrets.X != ''` compares '' against '' and is ALWAYS FALSE. It fails
    # closed, which is why it looks like it works: the job simply never runs.
    # Set the repository variable RELAY_DEPLOY to `true` alongside the secrets.
    if: vars.RELAY_DEPLOY == 'true'
    defaults:
      run:
        working-directory: services/relay
    steps:
      # The tagged commit when promote.yml called this, so a channel's relay is
      # built from that channel's source rather than from whatever has landed on
      # main since. Falls back to the triggering ref for a push or a dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/relay/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

      # Which relay this run is for.
      #
      # A push to main is always canary — `inputs.environment` is empty for a push
      # trigger, and canary is the only channel it is ever safe to deploy without
      # anyone having decided to.
      #
      # `stable` is spelled as the ABSENCE of --env, because production is the
      # top-level configuration in wrangler.toml. That keeps `wrangler deploy`
      # with no arguments meaning what it has always meant.
      - name: Choose the environment
        id: env
        run: |
          set -euo pipefail
          channel="${{ inputs.environment || 'canary' }}"
          case "$channel" in
            stable)  echo "flag=" >> "$GITHUB_OUTPUT"; echo "db=farcooler" >> "$GITHUB_OUTPUT" ;;
            preview) echo "flag=--env preview" >> "$GITHUB_OUTPUT"; echo "db=farcooler-preview" >> "$GITHUB_OUTPUT" ;;
            canary)  echo "flag=--env canary" >> "$GITHUB_OUTPUT"; echo "db=farcooler-canary" >> "$GITHUB_OUTPUT" ;;
            local)   echo "flag=--env local" >> "$GITHUB_OUTPUT"; echo "db=farcooler-local" >> "$GITHUB_OUTPUT" ;;
            *)       echo "unknown environment: $channel" >&2; exit 1 ;;
          esac
          echo "Deploying the $channel relay"

      # Migrations before the code that depends on them, and additive only for
      # the same reason as the routes: the previous version of the worker is
      # still serving requests while this one rolls out.
      #
      # The database is named explicitly rather than taken from the binding,
      # because `d1 migrations apply` takes a name and getting it wrong means
      # migrating the WRONG CHANNEL'S data — the one mistake here that is not
      # recoverable by deploying again.
      - name: Apply migrations
        run: npx wrangler d1 migrations apply ${{ steps.env.outputs.db }} --remote ${{ steps.env.outputs.flag }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy ${{ steps.env.outputs.flag }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Secrets — the APNs key, the WorkOS API key, the FCM service account —
      # are NOT set here. They are set once with `wrangler secret put` and live
      # only in Cloudflare. A deploy does not need to see them, and a workflow
      # that could print them is a workflow that eventually does.
