# Does the web client's DERP_HOSTS still name every relay in Tailcat's map?
#
# The web shell's CSP lists Tailcat's relays by name (ov-764 review), so a
# relay added to https://tailcat.dev/derpmap.json would make connects to
# runners homed there fail with a false "didn't answer" (ov-785). This reads
# the map (scripts/derp-hosts-check.py), and on a difference fails the run and
# opens one issue, or adds a comment to the one already open.
#
# Scheduled, never on a push or a pull request: a change on Tailcat's side
# must not redden main or block a merge. The fix is a line in
# services/web/wrangler.toml (services/web/README.md says which).
#
# 22:37 UTC is 3:37 pm Pacific in summer (PDT) and 2:37 pm in winter (PST);
# cron has no time zone, so the hour drifts by one when the clocks change.
name: DERP hosts

on:
  schedule:
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  derp-hosts:
    name: DERP hosts match the map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/derp-hosts-check.py --self-test
      - name: Compare the map with DERP_HOSTS
        id: check
        run: |
          set +e
          python3 scripts/derp-hosts-check.py | tee "$RUNNER_TEMP/drift.txt"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # One issue at a time: a second day of the same drift comments on it.
      - name: Open or update the issue
        if: ${{ steps.check.outputs.code == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Web: Tailcat's DERP map and DERP_HOSTS differ"
          {
            echo "The daily check found a difference (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}):"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/drift.txt"
            echo
            echo "Fix: add the host to DERP_HOSTS in every environment of services/web/wrangler.toml. See services/web/README.md."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      # Red for any non-zero code: drift (1) or a map this script cannot read (2).
      - name: Fail on a difference
        if: ${{ steps.check.outputs.code != '0' }}
        run: exit 1
