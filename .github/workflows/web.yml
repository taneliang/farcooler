# The web client (services/web, ov-764): Far Cooler in a browser, at
# app.canary.farcooler.com for canary and, from slice 17 of the plan,
# app.farcooler.com for stable.
#
#   workflow_dispatch → canary, from the commit it is run on
#
# BY HAND ONLY FOR NOW. The first deploy creates the Worker, its custom
# domain's DNS record and its certificate, and app.canary.farcooler.com is two
# levels deep, so Universal SSL doesn't cover it: someone has to watch that
# first deploy and check the certificate
# (`curl -v https://app.canary.farcooler.com/ 2>&1 | grep 'subject:'`).
# Once that holds, a push to main deploys canary: add
#
#   push:
#     branches: [main]
#     paths: ['services/web/**', 'services/common/**', '.github/workflows/web.yml',
#             'crates/web/**', 'crates/ceremony/**', 'crates/protocol/**',
#             'proto/**', 'crates/tailcat/go/**']
#
# (the client carries wasm built from those crates). Stable joins through
# promote.yml in slice 17, with the build composed from the stable tag as
# site.yml composes www.
#
# Authenticates wrangler as site.yml does: the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets, passed to the deploy step and no other.
name: Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which web client to deploy
        required: true
        default: canary
        type: choice
        options: [canary]

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, never cancelled halfway.
    concurrency:
      group: web-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/web
    # The wasm tools, pinned as ci.yml's web job pins them.
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      BINARYEN_VERSION: version_133
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod
          cache-dependency-path: crates/tailcat/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install wasm-bindgen and wasm-opt
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o wb.tgz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$WASM_BINDGEN_SHA256  wb.tgz" | sha256sum -c -
          tar xzf wb.tgz
          curl -fsSL -o bn.tgz "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  bn.tgz" | sha256sum -c -
          tar xzf bn.tgz
          echo "WASM_BINDGEN=$PWD/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
          echo "WASM_OPT=$PWD/binaryen-$BINARYEN_VERSION/bin/wasm-opt" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p tsconfig.client.json
      # Before the deploy, so a red suite or an oversized build never ships.
      - run: npm test
      - run: cargo test --locked --manifest-path ../../crates/web/Cargo.toml
      - run: node scripts/size-gate.mjs --self-test
      - run: ../../crates/web/build.sh --channel canary --out "$RUNNER_TEMP/wasm"
      - run: WEB_WASM_DIR="$RUNNER_TEMP/wasm" ./build.sh --channel canary --build "$GITHUB_SHA"
      - run: node scripts/size-gate.mjs dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env canary
