# The full iOS UI suite, once a night, on whatever is on main (ov-534).
#
# THREE TIERS (owner, Oct 14). A push or pull request runs unit and
# integration tests, plus a small smoke set of UI tests (ci.yml's `ios-ui`, the
# SMOKE list in scripts/ios-ui-shards.py). The train gate adds the UI classes a
# diff touches. This workflow runs everything else: all eight shards (seven on an iPhone,
# `pad` on an iPad), 271
# app-launching test methods in 40 classes, which took 25 to 34 minutes a shard
# when they ran on every push, and the capture classes. It runs on a fixed
# schedule against the head of main because work lands on main at every hour,
# so there is no last train to hang a full run on.
#
# 11:23 UTC is 4:23 am Pacific in summer (PDT) and 3:23 am in winter (PST);
# cron has no time zone, so the hour drifts by one when the clocks change. An
# off-minute, because GitHub delays scheduled runs that start on the hour.
# Scheduled workflows run on the default branch, which is main.
#
# WHEN IT GOES RED the `report` job files one GitHub issue labeled
# `nightly-ui-red`, naming the failing classes and the commits since the last
# green night, or comments on the one already open; a green night closes it
# (scripts/nightly-report.py). An issue, not a board card: the board is a local
# tool on the owner's Mac and a runner cannot reach it.
#
# Everything runs with all five macOS runners free (nothing else is on a Mac at
# that hour but a Canary build): five shards start together and the rest
# take a runner as one finishes. Their job
# names are the ones the shard budget reads (scripts/ios-ui-shard-budget.py),
# which now reads this workflow's runs and not ci.yml's.
name: Nightly

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

concurrency:
  # Never cancel a night for another; a manual run waits its turn.
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The iOS app and its UI test bundle, built once for every job below, as ci.yml's
  # `ios` job does for the smoke set (the steps are the action's).
  ios:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ios-ui-build

  # With `captures` below, these are SHARDS in scripts/ios-ui-shards.py, whose
  # `--check` fails when the matrix and the file disagree. The job name and
  # the timeout are the ones the budget job reads. `pad` runs on an iPad
  # simulator (ov-355). Seven phone shards of about 1,500 s
  # of tests each (ov-722, Oct 30), so 31 minutes a job against a 45-minute
  # timeout; the budget job goes red at 75% of it.
  #
  # `!cancelled()` and not the implied `success()`: a red `ios` job that still
  # uploaded its products leaves the shards to run, and a build that produced
  # nothing makes each fail on the download, saying so.
  ios-ui:
    name: iOS UI (${{ matrix.shard }})
    needs: [ios]
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [shell, agent, phone, phone2, phone3, phone4, phone5, pad]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-ui-shard
        with:
          shard: ${{ matrix.shard }}

  # The capture classes (CAPTURES in scripts/ios-ui-shards.py): screenshots of the
  # Plan's sections and of every shipped screen at its extremes, light and dark.
  # They skip every method unless a folder is named, which the action does with
  # `capture-out`. The images are uploaded and kept for a week. They assert
  # almost nothing, so a red here means the harness did not draw.
  # Three jobs (CAPTURE_SHARDS in the same file, which `--check` holds to this matrix):
  # the four classes took 34 to 46 minutes as one job and were cancelled at the
  # timeout on Oct 23 (ov-722); as two, the second took 35 minutes (78%) on Oct 24.
  captures:
    name: iOS UI ${{ matrix.shard }}
    needs: [ios]
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [captures, captures2, captures3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-ui-shard
        with:
          shard: ${{ matrix.shard }}
          capture-out: ${{ runner.temp }}/captures
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-ui-${{ matrix.shard }}
          path: ${{ runner.temp }}/captures
          retention-days: 7
          if-no-files-found: warn

  # Whether any shard runs close to the `ios-ui` timeout (ov-322): `phone` was
  # cancelled at 40 minutes twice in one day as classes landed in it, and a
  # cancelled shard reports no verdict. This reads what each shard took in the
  # last nightly runs. It lags a night, since this run is not complete yet. It
  # also reads the per-push smoke job's times from ci.yml's runs and warns when
  # it passes 12 minutes.
  budget:
    name: iOS UI shard budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Each run's shard lists come from its own commit.
          fetch-depth: 0
      - run: ./scripts/ios-ui-shards.py --check
      - run: ./scripts/ios-ui-shard-budget.py --self-test
      - run: ./scripts/ios-ui-shard-budget.py
        env:
          GH_TOKEN: ${{ github.token }}

  # Whether the latest claude still has the hook fields mailbox delivery sets
  # (ov-571): asyncRewake, rewakeMessage and rewakeSummary, which Claude Code
  # marks @internal. An update that drops one makes messages read as 'Stop hook
  # blocking error', with nothing else to say so. It installs the newest
  # release and only reads its files; nothing runs claude. A red job files the
  # nightly issue through `report`, whose "ended without a test verdict" list
  # names it.
  claude-rewake:
    name: Claude rewake fields
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/claude-rewake-check.py --self-test
      - run: npm install -g @anthropic-ai/claude-code
      - run: ./scripts/claude-rewake-check.py

  # The opt-in timing gates (FARCOOLER_PERF=1), which can't run per push: with
  # every other suite drawing on the same main thread they starve the display
  # link and fail on nothing of their own (ov-691). Alone here, one a night:
  #
  # - `ConversationScrollTests/flingKeepsUp` and `noRowJumps` (rows jump only
  #   by the scroll): four trackpad flings up a
  #   400-row session while a reply streams; the median main-thread hitch
  #   must stay within 40 ms/s on an M-series Mac (47 to 72 before ov-691, 12
  #   to 17 after) and 75 here, where it measured 31 to 50 on Oct 22
  #   (`PerfBudget`, ov-703); this runner's numbers are in the job's log,
  #   `ov-691 fling:`, to tighten it by;
  # - `TranscriptJumpTests` (ov-699): the same flings with late frames, the
  #   rows on screen moving by what each scrolled, a check shown to catch an
  #   injected jump, and the scroller's knob holding still, every fifth
  #   frame 120 ms late as well, where the stack resizes its content
  #   (ov-701, ov-734);
  # - `NativeStreamingStallTests`: a 25.6K-character reply streaming into a
  #   5,000-row session, no main-thread stall over 50 ms (100 here, until
  #   this runner's numbers, `PERF[native] longest stall`, set it); and that
  #   session's first page laid out lazily, at its tail, within the same
  #   budget (ov-750), `PERF[native] first page: main thread`;
  # - AgentKit's `AgentRowBudgetTests`, whose main-thread share and disk read
  #   are held only under FARCOOLER_PERF.
  #
  # The floor of each run is the tests it names, so a filter that matches
  # nothing fails rather than passing empty. A red job files the nightly issue
  # through `report`, which names it.
  mac-perf:
    name: Mac perf gates
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      FARCOOLER_PERF: "1"
    steps:
      - name: Check the runner has Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.'
      - uses: actions/checkout@v4
      # The last of the setup that must pass: it is skipped when the Xcode
      # check or the checkout failed, so its outcome stands for all three.
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: AgentKit row budgets
        run: ./scripts/swift-test-guard.sh <(echo 2) -- ./scripts/test-leak-check.py -- swift test --package-path apps/shared/AgentKit --filter AgentRowBudgetTests
      # One `swift test` each: in one run the two suites go at once on the one
      # main thread, which doubled the fling's hitch time (12 to 14 ms/s alone,
      # 35 to 46 beside the stall test, on an M-series Mac at load 2).
      # Each runs whether or not a gate before it passed, so one red gate
      # doesn't hide the others' numbers (ov-734), but not after the setup
      # failed; a failed step still fails the job.
      - name: Mac scrolling
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        working-directory: apps/macos
        run: |
          ./build-vt.sh
          ../../scripts/swift-test-guard.sh <(echo 2) -- ../../scripts/test-leak-check.py -- swift test --filter 'ConversationScrollTests/(flingKeepsUp|noRowJumps)'
      # Its own run, as the two above: suites in one run fling at once.
      - name: Mac scroll jumps
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        working-directory: apps/macos
        run: ../../scripts/swift-test-guard.sh <(echo 3) -- ../../scripts/test-leak-check.py -- swift test --filter 'TranscriptJumpTests'
      - name: Mac streaming
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        working-directory: apps/macos
        run: ../../scripts/swift-test-guard.sh <(echo 2) -- ../../scripts/test-leak-check.py -- swift test --filter 'NativeStreamingStallTests'

  # The one daemon test that runs at the daemon's own timing, five minutes
  # long (ov-816, ov-823): a message sent to a claude no hook is heard from,
  # whose turn runs five minutes and raises a permission dialog partway, is
  # sent when the turn ends. The six-second variant per push covers the
  # logic; this is the one that catches the production waits working against
  # each other (`watch::timing::tests::the_production_waits_fit_together`
  # pins the values per push). Real tmux and perl, as ci.yml's Rust job has
  # them. Ubuntu, so it never takes one of the five macOS runners the shards
  # start on. `--run-ignored only` and a filter that names the one test; the
  # step reads nextest's summary for exactly one test run and passed, so a
  # renamed test fails it rather than passing empty. The test takes about 5.2 minutes, inside
  # nextest's 10-minute terminate-after (.config/nextest.toml); the job's
  # timeout is the build (about 12 minutes cold, 3 with a warm cache) plus
  # that, with room.
  daemon-production-timing:
    name: Daemon production timing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-production-timing
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Install tmux
        timeout-minutes: 10
        run: ./scripts/ci-install-tmux.sh
      - name: Five-minute turn with a dialog, at production timing
        run: |
          set -euo pipefail
          ./scripts/test-leak-check.py -- ./scripts/tmux-leak-check.py -- \
            cargo nextest run --color never --profile ci -p farcooler-daemon --run-ignored only \
            -E 'test(a_message_sent_during_a_five_minute_turn_with_a_dialog_is_sent_when_it_ends)' \
            2>&1 | tee "$RUNNER_TEMP/nextest.log"
          # `--color never`: the job's CARGO_TERM_COLOR=always put escape codes
          # between the words of the summary, and this grep missed a pass
          # (nightly 40543895510: the test passed in 302 s, the step failed).
          grep -q 'Summary.* 1 test run: 1 passed' "$RUNNER_TEMP/nextest.log"

  # Always runs, and decides for itself from the run's jobs, so a cancelled or
  # timed-out job (no verdict from the tests) is reported too.
  report:
    name: Report
    needs: [ios, ios-ui, captures, budget, claude-rewake, mac-perf, daemon-production-timing]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/nightly-report.py --self-test
      - run: ./scripts/nightly-report.py
        env:
          GH_TOKEN: ${{ github.token }}
