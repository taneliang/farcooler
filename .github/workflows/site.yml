# The marketing site, www.farcooler.com.
#
# Deploys on every push to main that touches the site, after its own tsc and
# tests, the way relay.yml does. No opt-in variable: the secrets and the zone
# already exist, so a gate would only be a second thing to forget.
#
# Authenticates wrangler the way relay.yml and canary.yml do: the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, passed as environment
# variables to the step that deploys and to no other.
name: Site

on:
  push:
    branches: [main]
    paths: ['services/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: the older commit must not
# be the one that finishes last.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Before the deploy, so a red suite never ships.
      - run: npm test
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
