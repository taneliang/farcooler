# Do the OPENAI rows in crates/core/src/usage.rs still match OpenAI's pricing page?
#
# The same job as claude-prices.yml, for the GPT models Codex runs (ov-1005).
# GPT-5.6 Sol's rate is promotional until 2026-11-30, so the table is known to
# drift. This reads the page (scripts/openai-prices.py) and fails with a diff
# when a row differs, so the same day's fix is `scripts/openai-prices.py --write`.
#
# Scheduled, never on a push or a pull request: a price change on someone
# else's website must not redden main or block a merge. A red run here is a
# reminder to update the table, not a verdict on any commit. A model OpenAI
# retires moves to usage.rs's RETIRED table, which the check skips (R-106).
#
# 22:17 UTC, ten minutes after the Claude check; cron has no time zone.
name: OpenAI prices

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prices:
    name: Prices match the docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/openai-prices.py --self-test
      - run: python3 scripts/openai-prices.py --check
