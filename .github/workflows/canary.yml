# Every push to main, to internal TestFlight.
#
# The channel that breaks first so the others do not. Nobody presses anything:
# if it is on main, it is on someone's phone within the hour, which is the only
# way a bug gets found before it reaches an external tester.
#
# WHY THIS IS NOT A TAG. Preview and stable derive their channel from one —
# `v0.2.0-preview.3` says what it is — but a commit on main carries no tag, so
# `scripts/version.sh` cannot derive anything and CI has to say so outright with
# `FARCOOLER_CHANNEL`. Forgetting to would yield `local`, which is the safe
# direction: a build that cannot prove what it is stays isolated from every
# other channel's data.
#
# Tagging every commit instead was the alternative, and it is worse — a tag per
# push is thousands of refs naming builds nobody will ever install again, and
# `git tag --list` becomes useless for the two channels where tags mean
# something.
name: Canary

on:
  push:
    branches: [main]
    # The relay has its own workflow and its own cadence, so a relay-only commit
    # should not spend twenty minutes of macOS runner time shipping an identical
    # app to TestFlight.
    paths-ignore: ['services/relay/**', 'docs/**', '**/*.md']
  workflow_dispatch:

# One canary at a time, and the newest wins. Two pushes a minute apart would
# otherwise race to upload, and App Store Connect takes whichever finishes last
# rather than whichever is newer.
concurrency:
  group: canary
  cancel-in-progress: true

env:
  FARCOOLER_CHANNEL: canary

jobs:
  # The static musl CLI and daemon the Mac app CARRIES, from the same file
  # release.yml calls.
  #
  # This job did not exist, and the whole channel was unusable because of it:
  # `host_install.rs` looks for `Resources/dist/<arch>-linux` inside the bundle
  # before anywhere else, so a canary with an empty `dist/` cannot install Far
  # Cooler onto a machine you ssh to — and someone running a canary has the app
  # and nothing else. The only way to use it was to build the Linux binaries by
  # hand first, which is not a thing an installed app should ask of anyone.
  #
  # `channel: canary`, spelled out, for the reason at the top of this file: a
  # commit on main carries no tag, so nothing can derive the channel from one,
  # and the Linux binaries would otherwise be stamped `local` and write the
  # Local channel's runtime directory on every host they reached.
  linux:
    uses: ./.github/workflows/linux-binaries.yml
    with:
      channel: canary

  ios:
    name: iOS (internal TestFlight)
    runs-on: macos-latest
    # Without the App Store key this cannot upload anything. Through `vars`, not
    # `secrets`: the `secrets` context is unavailable in an `if`, so
    # `secrets.X != ''` compares '' to '' and is ALWAYS false — it fails closed,
    # which is exactly why it looks like it works.
    if: vars.CANARY_TESTFLIGHT == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # `git rev-list --count HEAD` is the App Store build number, and a
          # shallow clone makes it 1. scripts/version.sh refuses outright rather
          # than emitting a plausible wrong answer, so this is not optional.
          fetch-depth: 0
      # The iOS targets are NOT installed by default, and their absence does not
      # look like a missing target: cargo reports `can't find crate for std`,
      # which reads as a broken toolchain. release.yml names them for the same
      # reason; this job was archiving for the phone without them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # --device links the real tailcat archive into farcooler-client, which
      # needs a Go toolchain to build (see scripts/build-tailcat.sh). GitHub's
      # macOS image happens to ship one, which is exactly the kind of
      # unstated dependency that breaks on an image bump with an error that
      # never mentions Go — pin it explicitly instead of relying on that.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod

      # `--device`, because this job ARCHIVES. The default is simulator-only —
      # fast, and right for the CI job that merely compiles — but an archive
      # built against simulator slices fails at the linker, and the error names
      # a missing symbol rather than a missing architecture.
      - name: Build the Rust xcframeworks
        run: ./scripts/build-ios-frameworks.sh --device

      # The canary's own WorkOS project, through the same script the release
      # builds use rather than a `vars.CANARY_…` written here. The channel is
      # already fixed to canary at the top of this file, so both spellings pick
      # the same value today — but one mechanism is what stops the next app
      # build from being added with no client id at all, which is exactly how
      # the iOS release job shipped without one.
      #
      # `vars`, not `secrets`, because a client id NAMES the app rather than
      # authenticating as it — it is already committed in wrangler.toml. Making
      # it a secret would be worse than pointless: GitHub masks a secret in the
      # log, so a wrong client id would print as *** and read exactly like a
      # right one, on the one axis whose failures are already invisible.
      - name: The WorkOS client id for this channel
        env:
          LOCAL_WORKOS_CLIENT_ID: ${{ vars.LOCAL_WORKOS_CLIENT_ID }}
          CANARY_WORKOS_CLIENT_ID: ${{ vars.CANARY_WORKOS_CLIENT_ID }}
          PREVIEW_WORKOS_CLIENT_ID: ${{ vars.PREVIEW_WORKOS_CLIENT_ID }}
          STABLE_WORKOS_CLIENT_ID: ${{ vars.STABLE_WORKOS_CLIENT_ID }}
        run: ./scripts/workos-client-id.sh

      - name: Generate the Xcode project
        run: ./apps/ios/generate-project.py

      # Imported, never created. Automatic signing creates a new Apple
      # Development certificate when the keychain has none, and Apple caps how
      # many an account may hold — see the script, which is the whole
      # explanation. This step is what keeps `-allowProvisioningUpdates` below
      # to making profiles.
      - name: Import the signing certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-ios-certificate.sh

      # Several GB, and NOT optional. The FarCooler scheme embeds FarCoolerWatch
      # through a target dependency, and xcodebuild refuses to build a scheme
      # that embeds a watch app unless the watchOS Simulator platform is
      # installed — even here, where the archive below targets a device and
      # no simulator is ever launched. Worse, it refuses with no `error:`
      # line at all, so the failure reads like a project-generation bug and
      # is not one.
      #
      # Its own step, named for what it costs, so those minutes are visible in
      # the job timing instead of hidden inside a build that merely looks slow.
      # There is nothing to cache: -downloadPlatform installs into the runner's
      # system Xcode, outside anything actions/cache can carry between runs. It
      # is idempotent, so a runner image that already ships the platform pays
      # seconds rather than minutes.
      - name: Install the watchOS platform (several GB)
        run: xcodebuild -downloadPlatform watchOS

      # The canary's own bundle identifier — `com.farcooler.ios.canary`, which
      # generate-project.py derives from the channel — so it installs alongside
      # the preview and the stable app rather than replacing either.
      #
      # It follows that this is a SEPARATE App Store Connect record with its own
      # internal tester group, and that its APNs topic is that identifier. The
      # canary relay's APNS_TOPIC secret has to match, or every push is rejected
      # and nothing says so.
      - name: Archive and upload
        working-directory: apps/ios
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_P8: ${{ secrets.APP_STORE_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_KEY_P8" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_KEY_ID.p8

          # Four overrides, and all four are load-bearing. generate-project.py
          # writes `CODE_SIGN_STYLE = Manual`, `CODE_SIGN_IDENTITY = "-"` and
          # `CODE_SIGNING_REQUIRED = NO` into every target, which is exactly
          # right for a checkout with no Apple account: it builds, ad-hoc
          # signed, and runs in a simulator.
          #
          # None of it can archive. Manual signing names no profile, and the
          # ad-hoc identity is refused outright — "Ad Hoc code signing is not
          # allowed with SDK 'iOS 26.5'", for the app and the Live Activity
          # extension both. The identity is the one that bites second: setting
          # only the style and the team leaves `-` in place and the archive
          # fails the same way with a different message.
          #
          # DEVELOPMENT, not Distribution, and that is not a typo. Automatic
          # signing archives with a development identity and the EXPORT step is
          # what re-signs for the App Store, using the method in
          # ExportOptions.plist. Naming a distribution identity here instead
          # produces "conflicting provisioning settings: automatically signed
          # for development, but a conflicting code signing identity Apple
          # Distribution has been manually specified" — Xcode asking for the
          # value below in as many words.
          xcodebuild -project FarCooler.xcodeproj -scheme FarCooler \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/FarCooler.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_KEY_ID.p8 \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES

          xcodebuild -exportArchive \
            -archivePath build/FarCooler.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_KEY_ID.p8

          xcrun altool --upload-app -f build/export/FarCooler.ipa -t ios \
            --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"

  # The Mac app, as a disk image you can actually install.
  #
  # It has no TestFlight — a Developer ID app is distributed directly — and it is
  # still NOT attached to a GitHub release, because a canary sitting beside the
  # stable download is the one place it must never appear. A workflow artifact
  # instead: it hangs off the run rather than the repository's front page,
  # expires on its own, and is exactly as findable as a canary should be.
  #
  # Signed and notarised like a release, and that is the whole point rather than
  # a nicety. An ad-hoc-signed dmg is refused by Gatekeeper, so an unsigned
  # canary would mean stripping quarantine attributes by hand on every build —
  # which is how a channel meant to be installed constantly stops being
  # installed at all. The cost is a notarisation round trip on every push to
  # main; if that gets tiresome, `if: github.event_name == 'workflow_dispatch'`
  # on the signing steps buys back the time and leaves a button for when you
  # want an installable one.
  macos:
    name: macOS (signed disk image)
    runs-on: macos-latest
    # Serialised behind the Linux build, which is a real cost paid for a real
    # reason — release.yml pays it too, and says why at length: the app carries
    # those binaries, so a Mac job that started before they existed would build
    # an app that silently cannot install to a Linux host.
    needs: linux
    # Hoisted so the steps can test them in an `if`: the `secrets` context is
    # not available there, and `secrets.X != ''` is always false — silently, so
    # the signing steps would skip and an unopenable dmg would ship looking
    # exactly like a good one. Same trap release.yml documents at length.
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The Linux binaries this app will carry, from the job that just built
      # them. `build-app.sh` reads `dist/<arch>-linux/` at the repo root, which
      # is exactly the layout the tarballs unpack into — they were packed with
      # `-C dist` for this.
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: linux-tarballs

      - name: Unpack the Linux binaries where build-app.sh looks for them
        run: |
          set -euo pipefail
          mkdir -p dist
          for tarball in linux-tarballs/*.tar.gz; do
            tar -xzf "$tarball" -C dist
          done
          # Loudly, because the alternative is exactly the canary this file
          # used to ship — build-app.sh only warns when dist/ is empty, by
          # design, so that a laptop without musl can still build the app, and
          # a warning inside a job that passes is one nobody reads.
          for slug in x86_64-linux aarch64-linux; do
            [ -x "dist/$slug/farcoolerd" ] || { echo "missing dist/$slug/farcoolerd" >&2; exit 1; }
            [ -x "dist/$slug/farcooler" ] || { echo "missing dist/$slug/farcooler" >&2; exit 1; }
          done

      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          trap 'rm -f certificate.p12' EXIT
          keychain=build.keychain
          security create-keychain -p actions "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p actions "$keychain"
          # Unlocked STAYS unlocked. The keychain `security create-keychain`
          # just made carries `timeout=300s` — five minutes after anything
          # last touched it, it re-locks itself — and a codesign that meets a
          # locked keychain does not fail. It blocks on the GUI unlock prompt
          # that a runner has nobody to answer, until the job's six-hour
          # ceiling or somebody cancels it. Thirty-eight minutes of "Sign and
          # notarise" with not one line of notarytool output is what that
          # looks like from the outside, and it reads as Apple being slow.
          #
          # Five minutes was longer than this job ever spent between here and
          # signing, which is why it worked for months and was never true.
          # Then the canary started carrying the Linux binaries, the build
          # step crossed five minutes, and every run since has hung. The last
          # green one had fifteen seconds of headroom.
          security set-keychain-settings "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"

      - name: The WorkOS client id for this channel
        env:
          LOCAL_WORKOS_CLIENT_ID: ${{ vars.LOCAL_WORKOS_CLIENT_ID }}
          CANARY_WORKOS_CLIENT_ID: ${{ vars.CANARY_WORKOS_CLIENT_ID }}
          PREVIEW_WORKOS_CLIENT_ID: ${{ vars.PREVIEW_WORKOS_CLIENT_ID }}
          STABLE_WORKOS_CLIENT_ID: ${{ vars.STABLE_WORKOS_CLIENT_ID }}
        run: ./scripts/workos-client-id.sh

      # Resolved ONCE, here, before the build step below runs `cargo build
      # --release`. That build rewrites the tracked `Cargo.lock` whenever it and
      # `Cargo.toml` have drifted — an ordinary version bump does exactly that —
      # and `version.sh channel` answers `local` for a dirty tree. A step below
      # that re-asked `version.sh app-name` after the build would then go looking
      # for `Far Cooler Local.app` while the bundle on disk is named for the real
      # channel, and fail on a missing path. Resolving it up front and passing it
      # through `$GITHUB_ENV` means every step below agrees with the one that
      # built the bundle.
      - name: Resolve this channel's app name
        run: |
          set -euo pipefail
          name="$(scripts/version.sh app-name)"
          [ -n "$name" ] || { echo "version.sh app-name returned nothing; refusing to continue"; exit 1; }
          echo "APP_NAME=$name" >> "$GITHUB_ENV"

      - name: Build Far Cooler.app
        run: apps/macos/build-app.sh

      - name: Sign and notarise
        if: env.HAS_SIGN_IDENTITY == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="apps/macos/build/$APP_NAME.app"
          # Inside-out, which is what codesign requires and what --deep gets
          # wrong: every nested executable is signed before the thing containing
          # it. Sparkle ships an updater app and XPC services inside its
          # framework, and an unsigned one fails notarization with a message
          # naming a path most people have never looked inside.
          sparkle="$app/Contents/Frameworks/Sparkle.framework"
          if [ -d "$sparkle" ]; then
            find "$sparkle/Versions/B" \( -name '*.xpc' -o -name '*.app' \) -print0 |
              while IFS= read -r -d '' nested; do
                codesign --force --options runtime --timestamp \
                  --sign "$MACOS_SIGN_IDENTITY" "$nested"
              done
            # Autoupdate is a bare Mach-O executable at the version root, not
            # matched by either pattern above. Signing Versions/B does not
            # reach it, and codesign refuses to sign a bundle whose nested
            # code is not already signed.
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$sparkle/Versions/B/Autoupdate"
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$sparkle/Versions/B"
          fi

          # Each nested binary on its own, not `--deep`: the CLI and daemon in
          # Resources are separate executables and each needs its own signature
          # and hardened runtime. release.yml says the same at more length.
          for binary in "$app/Contents/Resources/farcooler" "$app/Contents/Resources/farcoolerd"; do
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$binary"
          done
          codesign --force --options runtime --timestamp \
            --entitlements apps/macos/Resources/FarCooler.entitlements \
            --sign "$MACOS_SIGN_IDENTITY" "$app"

          ditto -c -k --keepParent "$app" 'Far Cooler.zip'
          xcrun notarytool submit 'Far Cooler.zip' \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"
          rm 'Far Cooler.zip'

      - name: Package the disk image
        run: |
          set -euo pipefail
          app="apps/macos/build/$APP_NAME.app"
          staging="$(mktemp -d)"
          ditto "$app" "$staging/$(basename "$app")"
          ln -s /Applications "$staging/Applications"
          # Named with the build number as well as the version, because every
          # canary shares one marketing version and the build number is the
          # commit count — so the filename says which commit you are holding,
          # which is the whole question a canary bug report has to answer.
          hdiutil create -volname 'Far Cooler Canary' -srcfolder "$staging" \
            -ov -format UDZO \
            "Far Cooler-$(scripts/version.sh)-canary-$(scripts/version.sh build).dmg"

      - name: Notarise the disk image
        if: env.HAS_SIGN_IDENTITY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls *.dmg)"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"

      # R2 write needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID — secrets,
      # invisible to `if:` (see relay.yml: `secrets.X != ''` compares '' to ''
      # and is silently always false, so a gate written that way never fires
      # rather than failing loudly). Gated the same way relay.yml gates its
      # deploy instead: set the repository variable SPARKLE_PUBLISH to `true`
      # once CANARY_SPARKLE_KEY and the R2-enabled Cloudflare token both exist.
      - name: Set up Node.js for wrangler
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Sparkle's signing tool
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        env:
          # apps/macos/Package.resolved already pins Package.swift's
          # `from: "2.6.0"` dependency to this exact version, so sign_update's
          # EdDSA output is byte-for-byte what the Sparkle build embedded in
          # the app understands. Any 2.x release would sign compatibly — the
          # format has not changed within Sparkle 2 — but matching the
          # resolved version exactly leaves nothing here for a future bump to
          # quietly drift out of.
          SPARKLE_VERSION: "2.9.5"
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          tar -xJf sparkle.tar.xz ./bin/sign_update
          chmod +x ./bin/sign_update
          echo "SIGN_UPDATE=$(pwd)/bin/sign_update" >> "$GITHUB_ENV"
          rm sparkle.tar.xz

      - name: Sign the dmg, upload it, and publish canary's appcast
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        env:
          CANARY_SPARKLE_KEY: ${{ secrets.CANARY_SPARKLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls *.dmg)"
          build="$(scripts/version.sh build)"

          # Refuse to sign with a key the shipped apps do not trust.
          #
          # The two halves travel by completely different routes: the public one
          # is committed and stamped into the bundle at build time, the private
          # one was exported from a Keychain by hand and reached CI as a secret.
          # Nothing compared them until here. A mismatched pair fails NOWHERE in
          # CI — it signs, publishes and serves perfectly — and is refused by
          # every client, because a signature that does not verify is
          # indistinguishable from a forged one. The failure would appear only on
          # other people's machines.
          expected="$(awk '$1 == "canary" { print $2 }' apps/macos/sparkle-public-keys.txt)"
          actual="$(printf '%s' "$CANARY_SPARKLE_KEY" | swift scripts/sparkle-public-key.swift)"
          [ "$expected" = "$actual" ] || {
            echo "CANARY_SPARKLE_KEY is not the pair of the committed canary public key." >&2
            echo "  apps ship trusting: $expected" >&2
            echo "  this key would sign as: $actual" >&2
            exit 1
          }

          # sign_update prints ONE line — sparkle:edSignature="…" length="…" —
          # and the order is not a promise, so both are pulled out by name
          # rather than by field position.
          # The key arrives on STDIN, not as `-s`. Sparkle deprecated that flag
          # and it is "no longer supported for newly generated keys" — ours are
          # the current 32-byte seed format, so `-s` exits 1 after printing only
          # a deprecation warning, which reads like a warning rather than the
          # cause. `--ed-key-file -` is the documented replacement, and it keeps
          # the key out of the process listing as a side benefit.
          signed="$(printf '%s' "$CANARY_SPARKLE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$dmg")"
          signature="$(printf '%s' "$signed" | grep -oE 'edSignature="[^"]*"' | cut -d'"' -f2)"
          length="$(printf '%s' "$signed" | grep -oE 'length="[^"]*"' | cut -d'"' -f2)"
          [ -n "$signature" ] && [ -n "$length" ] || {
            echo "could not parse sign_update's output: $signed" >&2
            exit 1
          }

          # The build number, not one fixed name. Overwriting a single
          # canary/Far Cooler.dmg would let a stale appcast — an edge cache, a
          # client that polled an hour ago — go on naming the OLD version
          # while the object underneath it holds the NEW build's bytes, so the
          # signature that appcast carries stops matching what Sparkle just
          # downloaded. Sparkle reports that as a signature verification
          # failure, which is indistinguishable from tampering — exactly the
          # error nobody should be trained to click past. A key that carries
          # the build number turns the same situation into a 404 instead:
          # "try again later," which is what it actually is.
          key="canary/Far Cooler-$build.dmg"
          npx --yes wrangler@4 r2 object put "farcooler-updates/$key" \
            --file "$dmg" --content-type application/octet-stream --remote

          url="https://updates.farcooler.com/canary/Far%20Cooler-$build.dmg"
          notes="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          ./scripts/appcast.py --channel canary \
            --version "$(scripts/version.sh)" --build "$build" \
            --url "$url" --length "$length" --signature "$signature" \
            --notes "$notes" > appcast.xml

          # Five minutes of caching, not the edge default: Cloudflare would
          # otherwise keep serving a stale canary feed for hours, and "the
          # update exists but nobody is offered it" is the hardest failure
          # here to notice.
          npx --yes wrangler@4 r2 object put "farcooler-updates/canary/appcast.xml" \
            --file appcast.xml \
            --content-type "application/xml; charset=utf-8" \
            --cache-control 'max-age=300' --remote

      - uses: actions/upload-artifact@v4
        with:
          name: canary-macos
          path: '*.dmg'
