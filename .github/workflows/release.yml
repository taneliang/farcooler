# Cutting a release: one tag, and everything ships from the commit it points at.
#
# Nothing here is meant to be started by hand. `scripts/release.sh 0.2.0` moves
# the version in Cargo.toml and stops; the **Promote** workflow makes the tag and
# calls this file with it. The two-step is in release.sh's header — a tag must
# point at a commit somebody has already built and run. The triggers below still
# accept a tag push and a dispatch, and the last paragraph of this header says
# what the tag one costs.
#
# The one rule this file exists to enforce: the CLI, the daemon, the Mac app and
# the phone app in a given release are built from ONE commit. They speak a
# protocol to each other and they check each other's build stamps, so a release
# assembled from four separate builds is a release that can disagree with itself.
# Everything below therefore checks out once and fans out from there.
#
# The relay is deliberately NOT here — see relay.yml, which carries its own
# triggers because it has its own cadence: every push to main deploys the CANARY
# relay, and promote.yml calls it for preview and stable so a channel's relay
# moves with that channel's apps.
#
# This comment used to say the relay "deploys continuously" and had to, because
# an App Store release cannot be rolled forward on demand. The second half is
# still true and the first is no longer what happens. What actually keeps a
# months-old app working is the relay being ADDITIVE ONLY, which is the argument
# relay.yml's header makes at length; additive-only is not a reason to put every
# commit in front of the people running those apps, so the continuous cadence
# moved to canary. Recorded rather than deleted, because the old sentence is
# still quoted elsewhere.
#
# One consequence worth naming here, since this file has a tag trigger and
# relay.yml has none: pushing a `v*` tag BY HAND runs everything below — the
# TestFlight upload, the GitHub release, the Sparkle appcast — and deploys no
# relay at all, so the stable app would move and the stable relay would not.
# Promote is the path that moves both, and it is the only path anyone is meant
# to take: scripts/release.sh stopped tagging for a different reason and closed
# this door on the way past, so reaching it now takes a deliberate `git tag`.
name: Release

on:
  push:
    tags: ['v*']
  # Buildable without a tag, so the signing and notarisation path can be
  # exercised before it matters.
  workflow_dispatch:
  # Called by promote.yml, which tags in a prior job and passes the tag it made.
  #
  # The tag has to be passed rather than read from HEAD: promotion puts two tags
  # on one commit — beta and release are different bundle identifiers, so a
  # release is a rebuild of the beta's source rather than a re-upload of its
  # binary — and `git tag --points-at` returns both. See scripts/version.sh.
  workflow_call:
    inputs:
      tag:
        description: The tag being built, which decides the channel
        required: false
        type: string

permissions:
  contents: write

env:
  # The tag being built, for scripts/version.sh.
  #
  # Set once here rather than per job, because build-app.sh,
  # generate-project.py and build.gradle.kts each ask that script
  # independently. Empty for a push-triggered build, where the tag on HEAD is
  # unambiguous; only promotion, which puts two tags on one commit, needs to
  # say which one it means.
  FARCOOLER_TAG: ${{ inputs.tag }}

jobs:
  # The static musl CLI and daemon, in linux-binaries.yml because canary.yml
  # needs the identical thing and had none — see that file. The channel comes
  # from the tag, which is what a release has and a canary does not.
  linux:
    uses: ./.github/workflows/linux-binaries.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      tag: ${{ inputs.tag }}

  macos:
    name: macOS app
    runs-on: macos-latest
    # Serialised behind the Linux builds, which is a real cost paid for a real
    # reason: the Mac app CARRIES them. `host_install.rs` looks for
    # `Resources/dist/<arch>-linux` inside the bundle before anywhere else,
    # because someone installing Far Cooler onto a remote host has the app and
    # nothing else — no checkout, no Rust, no `scripts/build-linux.sh`.
    #
    # Without this the two jobs ran in parallel, `build-app.sh` found no
    # `dist/`, and every release shipped an app that could not install to a
    # Linux host. It said so in the log — "(none found …)" — and a passing
    # green job is not where anyone reads that.
    needs: linux
    # Hoisted to the job so the steps below can test them in an `if`. The
    # `secrets` context is not available to `if` at any level — `secrets.X != ''`
    # is always false — and the failure is silent: the signing steps skip and an
    # ad-hoc-signed app ships as though it were notarised.
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    # For `publish` below, which needs a Sparkle signature but must not need a
    # Mac to get one: sign_update signs the dmg's BYTES, not its eventual
    # download URL, so the job that already has the file signs it, and the
    # signature — not the file, and never the key — travels as a job output.
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
      length: ${{ steps.sign.outputs.length }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamp is a git describe away, and a shallow clone makes
          # `git rev-list --count` — the App Store build number — wrong.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The Linux binaries this app will carry, from the jobs that just built
      # them. `build-app.sh` reads `dist/<arch>-linux/` at the repo root, which
      # is exactly the layout the tarballs unpack into — they were packed with
      # `-C dist` for this.
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: linux-tarballs

      - name: Unpack the Linux binaries where build-app.sh looks for them
        run: |
          set -euo pipefail
          mkdir -p dist
          for tarball in linux-tarballs/*.tar.gz; do
            tar -xzf "$tarball" -C dist
          done
          # Loudly, because the alternative is an app that silently cannot
          # install to a remote host — build-app.sh only warns, by design, so
          # that a laptop without musl can still build the app.
          for slug in x86_64-linux aarch64-linux; do
            [ -x "dist/$slug/farcoolerd" ] || { echo "missing dist/$slug/farcoolerd" >&2; exit 1; }
          done

      # Signing is conditional, not required. Without a Developer ID this still
      # produces a working ad-hoc-signed app — which is what a contributor gets,
      # and it must keep working for them.
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          trap 'rm -f certificate.p12' EXIT
          keychain=build.keychain
          security create-keychain -p actions "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p actions "$keychain"
          # No auto-lock, for the reason canary.yml sets out at length: a new
          # keychain re-locks after 300s idle, and the codesign that then
          # meets it HANGS on an unlock prompt no runner can answer rather
          # than failing. This job has more between import and signing than
          # the canary does, not less.
          security set-keychain-settings "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          rm certificate.p12

      - name: The WorkOS client id for this channel
        env:
          LOCAL_WORKOS_CLIENT_ID: ${{ vars.LOCAL_WORKOS_CLIENT_ID }}
          CANARY_WORKOS_CLIENT_ID: ${{ vars.CANARY_WORKOS_CLIENT_ID }}
          PREVIEW_WORKOS_CLIENT_ID: ${{ vars.PREVIEW_WORKOS_CLIENT_ID }}
          STABLE_WORKOS_CLIENT_ID: ${{ vars.STABLE_WORKOS_CLIENT_ID }}
        run: ./scripts/workos-client-id.sh

      # Resolved ONCE, here, before the build step below runs `cargo build
      # --release`. That build rewrites the tracked `Cargo.lock` whenever it and
      # `Cargo.toml` have drifted — an ordinary version bump does exactly that —
      # and `version.sh channel` answers `local` for a dirty tree. A step below
      # that re-asked `version.sh app-name` after the build would then go looking
      # for `Far Cooler Local.app` while the bundle on disk is named for the real
      # channel, and fail on a missing path. Resolving it up front and passing it
      # through `$GITHUB_ENV` means every step below agrees with the one that
      # built the bundle.
      - name: Resolve this channel's app name
        run: |
          set -euo pipefail
          name="$(scripts/version.sh app-name)"
          [ -n "$name" ] || { echo "version.sh app-name returned nothing; refusing to continue"; exit 1; }
          echo "APP_NAME=$name" >> "$GITHUB_ENV"

      # Resolved ONCE, here, same reason as APP_NAME just above and the same
      # trap this file already names at length: `cargo build --release`,
      # inside "Build Far Cooler.app" below, rewrites the tracked Cargo.lock
      # whenever it and Cargo.toml have drifted, and `version.sh channel`
      # answers `local` for a dirty tree. "Sign the dmg for Sparkle" runs its
      # OWN shell, well after that build, so asking `version.sh channel`
      # again there would silently see the dirtied tree, fall through its
      # `case`'s `*)` branch, and fail the whole release — after a full
      # build/sign/notarize cycle has already been paid for. Resolved here,
      # on the checkout's still-clean tree, and reused via $GITHUB_ENV.
      - name: Resolve this channel's name
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          channel="$(scripts/version.sh channel "$tag")"
          [ -n "$channel" ] || { echo "version.sh channel returned nothing; refusing to continue"; exit 1; }
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Build Far Cooler.app
        # FARCOOLER_WORKOS_CLIENT_ID reaches build-app.sh through GITHUB_ENV,
        # set by the step above. Not written here, because a literal
        # `secrets.WORKOS_CLIENT_ID` is how a preview build came to be stamped
        # with the stable environment's client id.
        run: apps/macos/build-app.sh

      - name: Sign and notarise
        if: env.HAS_SIGN_IDENTITY == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="apps/macos/build/$APP_NAME.app"
          # Inside-out, which is what codesign requires and what --deep gets
          # wrong: every nested executable is signed before the thing containing
          # it. Sparkle ships an updater app and XPC services inside its
          # framework, and an unsigned one fails notarization with a message
          # naming a path most people have never looked inside.
          sparkle="$app/Contents/Frameworks/Sparkle.framework"
          if [ -d "$sparkle" ]; then
            find "$sparkle/Versions/B" \( -name '*.xpc' -o -name '*.app' \) -print0 |
              while IFS= read -r -d '' nested; do
                codesign --force --options runtime --timestamp \
                  --sign "$MACOS_SIGN_IDENTITY" "$nested"
              done
            # Autoupdate is a bare Mach-O executable at the version root, not
            # matched by either pattern above. Signing Versions/B does not
            # reach it, and codesign refuses to sign a bundle whose nested
            # code is not already signed.
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$sparkle/Versions/B/Autoupdate"
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$sparkle/Versions/B"
          fi

          # --deep is deprecated and wrong for a bundle carrying its own
          # binaries: the CLI and daemon inside Resources are separate
          # executables and each needs its own signature and hardened runtime.
          for binary in "$app/Contents/Resources/farcooler" "$app/Contents/Resources/farcoolerd"; do
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" "$binary"
          done
          codesign --force --options runtime --timestamp \
            --entitlements apps/macos/Resources/FarCooler.entitlements \
            --sign "$MACOS_SIGN_IDENTITY" "$app"

          ditto -c -k --keepParent "$app" 'Far Cooler.zip'
          xcrun notarytool submit 'Far Cooler.zip' \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          # Stapled so the app opens on a machine that is offline the first time
          # it runs — otherwise Gatekeeper has to phone home and a plane is
          # exactly where someone tries a new tool.
          xcrun stapler staple "$app"
          rm 'Far Cooler.zip'

      # A disk image, because the app is what someone downloads and a .zip that
      # unpacks into ~/Downloads is an app most people then run from there —
      # where it is not quarantine-clean on the next update and not where its
      # LaunchAgent expects to find it. A window with an Applications symlink
      # says where it goes without saying anything.
      #
      # `ditto` rather than `cp -R` to stage it: a signed bundle carries
      # extended attributes and symlinks that `cp` quietly flattens, and the
      # signature does not survive that.
      - name: Package the disk image
        run: |
          set -euo pipefail
          app="apps/macos/build/$APP_NAME.app"
          staging="$(mktemp -d)"
          ditto "$app" "$staging/$(basename "$app")"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname 'Far Cooler' -srcfolder "$staging" \
            -ov -format UDZO "Far Cooler-$(scripts/version.sh)-macos.dmg"

      # Notarised SEPARATELY from the app inside it, and both are notarised on
      # purpose. Stapling only the image leaves the app that gets dragged out
      # of it without a ticket of its own, so Gatekeeper has to phone home the
      # first time it runs — which is exactly the moment someone is on a plane
      # or a bad hotel network. The app was stapled above; this staples the
      # container it arrives in.
      - name: Notarise the disk image
        if: env.HAS_SIGN_IDENTITY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls *.dmg)"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"

      # R2 write (in `publish`, below) needs CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID — secrets, invisible to `if:` (see relay.yml:
      # `secrets.X != ''` compares '' to '' and is silently always false, so a
      # gate written that way never fires rather than failing loudly). Gated
      # the same way relay.yml gates its deploy instead: set the repository
      # variable SPARKLE_PUBLISH to `true` once the *_SPARKLE_KEY secrets and
      # the R2-enabled Cloudflare token all exist. Signing happens here rather
      # than in `publish` purely because this job already holds the file —
      # see the job-level comment on `outputs:` above.
      - name: Fetch Sparkle's signing tool
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        env:
          # apps/macos/Package.resolved already pins Package.swift's
          # `from: "2.6.0"` dependency to this exact version, so sign_update's
          # EdDSA output is byte-for-byte what this Sparkle build understands.
          # Any 2.x release would sign compatibly — the format has not
          # changed within Sparkle 2 — but matching the resolved version
          # exactly leaves nothing here for a future bump to quietly drift
          # out of.
          SPARKLE_VERSION: "2.9.5"
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          tar -xJf sparkle.tar.xz ./bin/sign_update
          chmod +x ./bin/sign_update
          echo "SIGN_UPDATE=$(pwd)/bin/sign_update" >> "$GITHUB_ENV"
          rm sparkle.tar.xz

      - name: Sign the dmg for Sparkle
        id: sign
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        env:
          STABLE_SPARKLE_KEY: ${{ secrets.STABLE_SPARKLE_KEY }}
          PREVIEW_SPARKLE_KEY: ${{ secrets.PREVIEW_SPARKLE_KEY }}
        run: |
          set -euo pipefail

          # $RELEASE_CHANNEL, resolved before "Build Far Cooler.app" ran its
          # `cargo build --release` — not re-derived here. This step's shell
          # starts fresh after that build, and by then Cargo.lock may already
          # differ from what the checkout had, which is a dirty tree, which
          # is what `version.sh channel` treats as `local` — silently, and
          # only discovered here as this step's own failure. See the
          # "Resolve this channel's name" step above.
          case "$RELEASE_CHANNEL" in
            stable)  key="$STABLE_SPARKLE_KEY" ;;
            preview) key="$PREVIEW_SPARKLE_KEY" ;;
            *)
              # workflow_dispatch with no tag resolves RELEASE_CHANNEL to
              # `local` — this file's header advertises being buildable
              # without a tag so the signing and notarization path above can
              # be exercised before it matters, and failing here would undo
              # that after the expensive part already ran. Skip rather than
              # fail: `publish` only runs for a `v*` tag and already refuses
              # to publish with an empty Sparkle signature, so there is
              # nothing unsafe about leaving this step's outputs unset.
              echo "channel resolved to '$RELEASE_CHANNEL'; only stable and preview sign a release dmg — skipping"
              exit 0
              ;;
          esac

          dmg="$(ls *.dmg)"

          # Refuse to sign with a key the shipped apps do not trust.
          #
          # The two halves travel by completely different routes: the public one
          # is committed and stamped into the bundle at build time, the private
          # one was exported from a Keychain by hand and reached CI as a secret.
          # Nothing compared them until here. A mismatched pair fails NOWHERE in
          # CI — it signs, publishes and serves perfectly — and is refused by
          # every client, because a signature that does not verify is
          # indistinguishable from a forged one. On stable that would mean an
          # update nobody can install and nothing anywhere reporting why.
          expected="$(awk -v c="$RELEASE_CHANNEL" '$1 == c { print $2 }' apps/macos/sparkle-public-keys.txt)"
          actual="$(printf '%s' "$key" | swift scripts/sparkle-public-key.swift)"
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            echo "the $RELEASE_CHANNEL Sparkle key is not the pair of the committed public key." >&2
            echo "  apps ship trusting: ${expected:-<no line for $RELEASE_CHANNEL>}" >&2
            echo "  this key would sign as: $actual" >&2
            exit 1
          }

          # sign_update prints ONE line — sparkle:edSignature="…" length="…" —
          # and the order is not a promise, so both are pulled out by name
          # rather than by field position. The key itself never leaves this
          # step: only the signature and length it produces become job
          # outputs below, and neither is sensitive on its own — a signature
          # proves the key signed THIS file, it does not reveal the key.
          # The key arrives on STDIN, not as `-s`. Sparkle deprecated that flag
          # and it is "no longer supported for newly generated keys" — ours are
          # the current 32-byte seed format, so `-s` exits 1 after printing only
          # a deprecation warning, which reads like a warning rather than the
          # cause. `--ed-key-file -` is the documented replacement, and it keeps
          # the key out of the process listing as a side benefit.
          signed="$(printf '%s' "$key" | "$SIGN_UPDATE" --ed-key-file - "$dmg")"
          signature="$(printf '%s' "$signed" | grep -oE 'edSignature="[^"]*"' | cut -d'"' -f2)"
          length="$(printf '%s' "$signed" | grep -oE 'length="[^"]*"' | cut -d'"' -f2)"
          [ -n "$signature" ] && [ -n "$length" ] || {
            echo "could not parse sign_update's output: $signed" >&2
            exit 1
          }

          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "length=$length" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: '*.dmg'

  ios:
    name: iOS (TestFlight)
    runs-on: macos-latest
    env:
      HAS_APP_STORE_KEY: ${{ secrets.APP_STORE_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # --device links the real tailcat archive into farcooler-client, which
      # needs a Go toolchain to build (see scripts/build-tailcat.sh). GitHub's
      # macOS image happens to ship one, which is exactly the kind of
      # unstated dependency that breaks on an image bump with an error that
      # never mentions Go — pin it explicitly instead of relying on that.
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/tailcat/go/go.mod

      # The xcframeworks are gitignored — they are build output — so CI has to
      # build them before the project that links them. Without this the app
      # links nothing and fails at the linker, which reads as a Swift error.
      # --device, unlike CI's simulator-only build: this one is archived.
      - name: Build the Rust xcframeworks
        run: ./scripts/build-ios-frameworks.sh --device

      # Before the project is generated, because generate-project.py bakes the
      # client id into the target's build settings — a step that ran after it
      # would set an environment variable nothing reads. This job shipped
      # without one entirely until it was noticed, and the symptom was not a
      # failed build: it was a TestFlight app with no sign-in button.
      - name: The WorkOS client id for this channel
        env:
          LOCAL_WORKOS_CLIENT_ID: ${{ vars.LOCAL_WORKOS_CLIENT_ID }}
          CANARY_WORKOS_CLIENT_ID: ${{ vars.CANARY_WORKOS_CLIENT_ID }}
          PREVIEW_WORKOS_CLIENT_ID: ${{ vars.PREVIEW_WORKOS_CLIENT_ID }}
          STABLE_WORKOS_CLIENT_ID: ${{ vars.STABLE_WORKOS_CLIENT_ID }}
        run: ./scripts/workos-client-id.sh

      - name: Generate the Xcode project
        run: apps/ios/generate-project.py

      # Several GB, and NOT optional. The FarCooler scheme embeds FarCoolerWatch
      # through a target dependency, and xcodebuild refuses to build a scheme
      # that embeds a watch app unless the watchOS Simulator platform is
      # installed — even here, where both builds below target a device and
      # no simulator is ever launched. Worse, it refuses with no `error:`
      # line at all, so the failure reads like a project-generation bug and
      # is not one.
      #
      # Its own step, named for what it costs, so those minutes are visible in
      # the job timing instead of hidden inside a build that merely looks slow.
      # There is nothing to cache: -downloadPlatform installs into the runner's
      # system Xcode, outside anything actions/cache can carry between runs. It
      # is idempotent, so a runner image that already ships the platform pays
      # seconds rather than minutes.
      - name: Install the watchOS platform (several GB)
        run: xcodebuild -downloadPlatform watchOS

      # Always, credentials or not. This is the step that catches a release
      # broken for the phone, and a fork with no App Store account still
      # deserves to find that out.
      - name: Build for the device
        run: |
          xcodebuild -project apps/ios/FarCooler.xcodeproj \
            -scheme FarCooler \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Imported, never created, and for the reason the script gives at
      # length: automatic signing below creates an Apple Development
      # certificate whenever the keychain has none, and Apple caps how many an
      # account may hold. Gated with the archive, so a fork still builds
      # unsigned above and skips both.
      - name: Import the signing certificate
        if: env.HAS_APP_STORE_KEY == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-ios-certificate.sh

      - name: Archive and upload to TestFlight
        if: env.HAS_APP_STORE_KEY == 'true'
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_P8: ${{ secrets.APP_STORE_KEY_P8 }}
        run: |
          trap 'rm -f ~/.appstoreconnect/private_keys/*.p8' EXIT
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_KEY_P8" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_KEY_ID.p8

          xcodebuild -project apps/ios/FarCooler.xcodeproj \
            -scheme FarCooler \
            -destination 'generic/platform=iOS' \
            -archivePath build/FarCooler.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_KEY_ID.p8 \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_REQUIRED=YES \
            archive

          xcodebuild -exportArchive \
            -archivePath build/FarCooler.xcarchive \
            -exportOptionsPlist apps/ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_KEY_ID.p8

          xcrun altool --upload-app -f build/export/FarCooler.ipa -t ios \
            --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"

  publish:
    name: Publish the release
    needs: [linux, macos]
    # `inputs.tag` first, and it is not optional politeness.
    #
    # In a reusable workflow the `github` context belongs to the CALLER, so when
    # promote.yml dispatches this from main, `github.ref` is `refs/heads/main`
    # and this job would silently skip — the build would succeed, the tag would
    # exist, and no release would ever appear. Same trap for `prerelease` below,
    # where `github.ref_name` would be `main` and every preview would publish as
    # a full release.
    if: startsWith(inputs.tag, 'v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Hoisted the same way the macos job hoists it, and for the same reason:
    # `secrets` is not available to `if` here either. Publishing is gated on
    # this in addition to `vars.SPARKLE_PUBLISH` below, so a rotated or
    # expired MACOS_SIGN_IDENTITY stops the appcast update rather than
    # publishing an ad-hoc-signed, un-notarized dmg with CI staying green.
    env:
      HAS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # scripts/version.sh build (needed below, for the appcast's
          # sparkle:version) is `git rev-list --count HEAD`, and the script
          # refuses outright on a shallow clone rather than returning the
          # wrong count — the same reason the macos and ios jobs above pass
          # this.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        id: gh_release
        with:
          files: artifacts/*
          generate_release_notes: true
          # Named explicitly, because a workflow_call run is not a tag push and
          # the action would otherwise have no tag to attach to.
          tag_name: ${{ inputs.tag || github.ref_name }}
          # A preview is marked as one, so it does not become the download
          # anyone lands on — and so `-preview.3` is not silently the "latest
          # release".
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-preview.') }}
          body: |
            Every binary here was built from this one commit. The Mac app,
            the phone app, the CLI and the daemon check each other's build
            stamps, so mixing versions between them is a supported way to
            confuse yourself and nothing more.

            The Mac app is the disk image: drag it to Applications. It carries
            the Linux binaries for both architectures inside it, so installing
            Far Cooler onto a machine you ssh to needs nothing else downloaded —
            `farcooler host install <target>`, or the Install button.

            The tarballs are the same binaries for anyone who would rather put
            them on a host directly: unpack one into `dist/` and run
            `farcooler host install <target>` from there.

            The apps report their channel — a preview says so in Settings and in
            what it tells the relay, so a bug report names which build it came
            from rather than a version two different builds share.

      # R2 write needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID — secrets,
      # invisible to `if:` (see relay.yml: `secrets.X != ''` compares '' to ''
      # and is silently always false, so a gate written that way never fires
      # rather than failing loudly). Gated the same way relay.yml gates its
      # deploy instead: set the repository variable SPARKLE_PUBLISH to `true`
      # once the *_SPARKLE_KEY secrets (used by the macos job above, not here)
      # and the R2-enabled Cloudflare token all exist.
      #
      # No sign_update here, and no Mac needed for this job: the macos job
      # above already signed the dmg it built — sign_update signs BYTES, not a
      # download URL, so nothing about the enclosure being a GitHub asset
      # rather than an uploaded file requires re-signing on this side. Only
      # the resulting signature and length cross the job boundary, as
      # `needs.macos.outputs`.
      - name: Set up Node.js for wrangler
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # After action-gh-release, deliberately: stable and preview point their
      # enclosure at the release ASSET url rather than uploading a second copy
      # of the dmg to R2 (Sparkle signs a file's bytes, not its location — see
      # docs/superpowers/specs/2026-08-16-sparkle-auto-update-design.md), and
      # that url does not exist until the release does.
      - name: Publish this channel's appcast
        if: vars.SPARKLE_PUBLISH == 'true' && env.HAS_SIGN_IDENTITY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_ASSETS: ${{ steps.gh_release.outputs.assets }}
          SIGNATURE: ${{ needs.macos.outputs.signature }}
          LENGTH: ${{ needs.macos.outputs.length }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"

          # The same tag shape scripts/version.sh channel already parses — a
          # `-preview.N` suffix means preview, a bare `v…` means stable —
          # rather than re-deriving "which channel is this" a second way
          # here. (The macos job asked the same question independently, to
          # pick which *_SPARKLE_KEY to sign with; both jobs calling the one
          # authoritative script is not the drift a second implementation
          # would be.)
          channel="$(scripts/version.sh channel "$tag")"
          case "$channel" in
            stable|preview) ;;
            *)
              echo "tag $tag resolved to channel '$channel'; only stable and preview publish an appcast" >&2
              exit 1
              ;;
          esac

          [ -n "$SIGNATURE" ] && [ -n "$LENGTH" ] || {
            echo "the macos job produced no Sparkle signature for $channel — SPARKLE_PUBLISH was probably false when it ran. Refusing to publish an appcast with no signature." >&2
            exit 1
          }

          # The exact object Sparkle will fetch: the GitHub release asset
          # action-gh-release just created, read back from its own output
          # rather than reconstructed by guessing at GitHub's URL encoding.
          dmg_name="Far Cooler-$(scripts/version.sh)-macos.dmg"
          url="$(printf '%s' "$RELEASE_ASSETS" | jq -r --arg name "$dmg_name" \
            '.[] | select(.name == $name) | .browser_download_url')"
          [ -n "$url" ] || {
            echo "no release asset named $dmg_name among: $RELEASE_ASSETS" >&2
            exit 1
          }

          notes="${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          ./scripts/appcast.py --channel "$channel" \
            --version "$(scripts/version.sh)" --build "$(scripts/version.sh build)" \
            --url "$url" --length "$LENGTH" --signature "$SIGNATURE" \
            --notes "$notes" > appcast.xml

          # Five minutes, not the edge default: Cloudflare would otherwise
          # keep serving a stale feed for hours, and "the update exists but
          # nobody is offered it" is the hardest failure here to notice.
          npx --yes wrangler@4 r2 object put "farcooler-updates/$channel/appcast.xml" \
            --file appcast.xml \
            --content-type "application/xml; charset=utf-8" \
            --cache-control 'max-age=300' --remote
